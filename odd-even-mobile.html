<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171128">
  <title>SD홀짝 Mobile</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/odd-even.png">
  <link rel="stylesheet" href="assets/css/mobile-app.css?v=3">
  <link rel="stylesheet" href="assets/css/mobile-v107.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/supabase-config.js?v=2" defer></script>
  <script src="assets/js/auth-common.js?v=2" defer></script>
  <script src="assets/js/mobile-common.js?v=2" defer></script>
  <script src="assets/js/mobile-odd-even.js?v=7" defer></script>
</head>
<body class="mobile-body">
  <header class="mobile-topbar">
    <a class="mobile-brand" href="mobile.html"><img src="assets/icons/odd-even.png" alt=""><span><small>SERVER DICE</small><strong>SD홀짝</strong></span></a>
    <div class="sync-pill" data-mobile-balance>-</div>
  </header>
  <main class="mobile-main">
    <section class="app-panel">
      <div class="page-heading">
        <img src="assets/icons/odd-even.png" alt="">
        <div><span class="eyebrow-mobile">ODD OR EVEN</span><h1>주사위 홀짝</h1><p>PC처럼 먼저 굴리고 멈춘 뒤 홀·짝을 선택합니다.</p></div>
      </div>
      <div id="oddStatus" class="status-mobile" hidden></div>
      <div class="dice-stage"><div id="die1" class="die">1</div><div id="die2" class="die">1</div></div>
      <div id="oddResult" class="result-card-mobile">
        <span id="oddPhase" class="phase-chip">베팅 준비</span>
        <strong id="oddResultTitle">베팅금을 정하고 굴리기를 누르세요</strong>
        <span id="oddResultDetail">멈추기 후 주사위 결과는 선택 전까지 가려집니다.</span>
      </div>
      <div class="bet-box">
        <label for="oddWager">가상 베팅금</label>
        <div class="bet-input-row"><input id="oddWager" type="number" min="100" step="100" value="1000" inputmode="numeric"></div>
        <div class="quick-bets quick-bets-five">
          <button data-odd-bet="1000" type="button">+1천</button>
          <button data-odd-bet="10000" type="button">+1만</button>
          <button data-odd-bet="100000" type="button">+10만</button>
          <button data-odd-bet="all" type="button">올인</button>
          <button data-odd-bet="reset" class="reset-bet" type="button">초기화</button>
        </div>
      </div>
      <div class="round-controls">
        <button id="rollOddEven" class="roll-button" type="button">굴리기</button>
        <button id="stopOddEven" class="stop-button" type="button" disabled>멈추기</button>
      </div>
      <div id="oddChoiceGrid" class="choice-grid" hidden>
        <button id="chooseOdd" class="odd-button" type="button">홀</button>
        <button id="chooseEven" class="even-button" type="button">짝</button>
      </div>
      <p class="small-note">멈추기를 누르는 순간 서버에서 주사위 2개의 결과가 확정되며,<br>홀·짝을 선택하기 전에는 결과가 공개되지 않습니다.</p>
    </section>
  </main>
  <nav class="mobile-bottom-nav"></nav>
</body>
</html>
