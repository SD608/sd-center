<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<title>SD 관리자 도구</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="amount-preview.css" />
<link rel="stylesheet" href="roadmap.css" />
</head>
<body>
<main class="workspace">
<aside class="sidebar">
  <div class="sidebar-brand"><span class="mark">SD</span><strong>관리자 도구</strong></div>
  <button id="roadmapNav" class="nav-button active" type="button">로드맵</button>
  <button id="accessNav" class="nav-button" type="button">접속 현황</button>
</aside>
<section class="workspace-content">
  <section id="roadmapView" class="tool-view roadmap-view">
    <header class="topbar"><div><h1>로드맵</h1></div><div class="top-actions"><button id="roadmapFileButton" class="ghost" type="button">데이터 파일</button><button id="roadmapRefreshButton" class="ghost" type="button">새로고침</button></div></header>
    <section class="roadmap-summary"><div><span>전체 진행도</span><strong id="roadmapPercent">0%</strong><small id="roadmapCount">0 / 0</small></div><div class="progress-track large"><span id="roadmapOverallBar"></span></div></section>
    <p id="roadmapStatus" class="status app-status" role="status" hidden></p>
    <section id="roadmapList" class="roadmap-list" aria-live="polite"></section>
    <p id="roadmapPath" class="roadmap-path"></p>
  </section>

  <section id="accessView" class="tool-view" hidden>
    <section id="loginView" class="login-view"><form id="loginForm" class="login-card" autocomplete="on"><div class="mark">SD</div><h1>SD 사용자 현황</h1><label>관리자 이메일<input id="email" type="email" autocomplete="username" required /></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required /></label><button id="loginButton" class="primary" type="submit">로그인</button><p id="loginStatus" class="status" role="status" hidden></p></form></section>
    <section id="appView" class="app-view" hidden><header class="topbar"><div><h1>접속 현황</h1><span id="adminName" class="muted"></span></div><div class="top-actions"><button id="refreshButton" class="ghost" type="button">새로고침</button><button id="logoutButton" class="ghost" type="button">로그아웃</button></div></header><section class="metrics" aria-label="접속 요약"><article><span>온라인</span><strong id="onlineCount">0</strong></article><article><span>전체</span><strong id="totalCount">0</strong></article></section><section class="tools"><input id="searchInput" type="search" placeholder="사용자 또는 계좌 검색" /><label class="toggle"><input id="onlineOnly" type="checkbox" /> 온라인만</label></section><p id="appStatus" class="status app-status" role="status" hidden></p><section id="userList" class="user-list" aria-live="polite"></section></section>
  </section>
</section>
</main>
<dialog id="detailDialog" class="detail-dialog"><div class="detail-head"><div><strong id="detailName">-</strong><span id="detailOnline" class="pill">-</span></div><button id="detailClose" class="icon-button" type="button" aria-label="닫기">×</button></div><section class="detail-balance"><div><span>잔액</span><strong id="detailBalance">0 SD</strong></div><div class="detail-actions"><button id="creditButton" class="credit" type="button">입금</button><button id="debitButton" class="debit" type="button">출금</button></div></section><dl class="detail-grid"><div><dt>계좌</dt><dd id="detailAccount">-</dd></div><div><dt>마지막 접속</dt><dd id="detailSeen">-</dd></div></dl><section><h2>실행 중</h2><div id="detailApps" class="detail-apps"></div></section><section><h2>최근 거래</h2><div id="transactionList" class="transactions"></div></section></dialog>
<dialog id="adjustDialog" class="adjust-dialog"><form id="adjustForm" method="dialog"><div class="detail-head"><strong id="adjustTitle">입금</strong><button id="adjustClose" class="icon-button" type="button">×</button></div><label>금액<div class="amount-input-row"><input id="adjustAmount" type="number" min="1" max="100000000000" step="1" required /><span id="adjustAmountPreview" class="amount-preview">1 ~ 100,000,000,000 SD</span></div></label><label>사유<input id="adjustNote" type="text" maxlength="80" /></label><p id="adjustStatus" class="status" role="status" hidden></p><div class="form-actions"><button id="adjustCancel" class="ghost" type="button">취소</button><button id="adjustSubmit" class="primary" type="submit">확인</button></div></form></dialog>
<script src="ui-logic.js"></script><script src="app.js"></script>
</body>
</html>
