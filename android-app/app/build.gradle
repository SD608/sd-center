plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sd608.center'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sd608.center'
        minSdk 26
        targetSdk 35
        versionCode 105
        versionName '1.0.5'
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('SDCENTER_KEYSTORE_PATH')
            def keyPasswordValue = System.getenv('SDCENTER_KEY_PASSWORD')
            if (keyPath && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyPasswordValue
                keyAlias 'sdcenter'
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
