name: RLS Event Trigger Hardening

on:
  push:
    branches: [hardening/rls-event-trigger-20260820]
    paths:
      - 'database/migrations/rls_event_trigger_execute_lock_v1.sql'
      - 'tests/rls-event-trigger/**'
      - '.github/workflows/rls-event-trigger-hardening.yml'
  pull_request:
    paths:
      - 'database/migrations/rls_event_trigger_execute_lock_v1.sql'
      - 'tests/rls-event-trigger/**'
      - '.github/workflows/rls-event-trigger-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-trigger-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_trigger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rls_trigger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rls_trigger_test
    steps:
      - uses: actions/checkout@v4
      - name: Build RLS event-trigger fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/rls-event-trigger/fixture.sql
      - name: Apply execute-lock migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/rls_event_trigger_execute_lock_v1.sql
      - name: Verify client RPC removal and event-trigger behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/rls-event-trigger/regression.sql
