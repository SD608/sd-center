name: Authority Migration Source Lock

on:
  push:
    branches: [release/v024-final-gate-20260820]
    paths:
      - 'sql/release-gate/**'
      - '.github/workflows/authority-migration-source-lock.yml'
  pull_request:
    paths:
      - 'sql/release-gate/**'
      - '.github/workflows/authority-migration-source-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify DEV-validated authority migration bytes
        run: sha256sum -c sql/release-gate/AUTHORITY_SOURCE_SHA256.txt
