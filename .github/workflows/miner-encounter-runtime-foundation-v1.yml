name: Miner Encounter Runtime Foundation v1

on:
  push:
    branches: [feat/miner-encounter-runtime-foundation-v1-20260923]
    paths:
      - 'miner-remake/runtime-v1/**'
      - '.github/workflows/miner-encounter-runtime-foundation-v1.yml'
      - 'audits/ch4-5-miner-encounter-runtime-foundation-20260923.md'
  pull_request:
    paths:
      - 'miner-remake/runtime-v1/**'
      - '.github/workflows/miner-encounter-runtime-foundation-v1.yml'
      - 'audits/ch4-5-miner-encounter-runtime-foundation-20260923.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime dependencies
        run: npm ci --prefix miner-remake/runtime-v1
      - name: Runtime syntax and security contract
        run: npm --prefix miner-remake/runtime-v1 run check
      - name: Encounter/recovery deterministic tests
        run: npm --prefix miner-remake/runtime-v1 test

  windows-browser-runtime:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime dependencies
        shell: pwsh
        run: npm ci --prefix miner-remake/runtime-v1
      - name: Install pinned Edge automation driver
        shell: pwsh
        run: npm install --prefix .runtime-ci playwright-core@1.55.0 --no-save --ignore-scripts
      - name: Phaser boot and re-enter x100 on Edge
        shell: pwsh
        run: node miner-remake/runtime-v1/test/browser-gate.cjs
      - name: Upload runtime render evidence
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-Miner-Encounter-Runtime-v1-Windows
          path: ui-artifacts/miner-runtime-v1/*.png
          if-no-files-found: error
          retention-days: 14

  windows-electron-ui-integration:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime dependencies
        shell: pwsh
        run: npm ci --prefix miner-remake/runtime-v1
      - name: Install pinned Electron integration tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .runtime-electron-ci | Out-Null
          '{"name":"sd-miner-runtime-electron-ci","private":true}' | Set-Content .runtime-electron-ci/package.json -Encoding utf8NoBOM
          npm install --prefix .runtime-electron-ci --save-exact electron@44.4.3 playwright-core@1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SD광부 UI + Electron runtime IPC + Phaser E2E
        shell: pwsh
        run: node miner-remake/runtime-v1/test/electron-ui-gate.cjs
      - name: Upload Electron integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-Miner-Runtime-Electron-Integration-v1
          path: ui-artifacts/miner-runtime-v1-electron/*.png
          if-no-files-found: error
          retention-days: 14

  windows-storage-durability:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime dependencies
        shell: pwsh
        run: npm ci --prefix miner-remake/runtime-v1
      - name: Snapshot durability and performance 2s -> 3s -> 5s Gate
        shell: pwsh
        run: npm --prefix miner-remake/runtime-v1 run stress:snapshot
      - name: Upload storage profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-Miner-Runtime-Snapshot-Stress-v1
          path: runtime-profiles/snapshot-stress-v1.json
          if-no-files-found: error
          retention-days: 14
