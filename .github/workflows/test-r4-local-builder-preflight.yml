name: Test R4 Local Builder Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/test-r4-local-builder-preflight.yml'
      - 'tools/run-v024-final-installer-r4-local.ps1'
      - 'tools/run-v024-final-installer-local.ps1'
      - 'tools/test-extension-update-trust-bootstrap.js'
      - 'tools/patch-v024-extension-update-trust-bootstrap.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-parser-and-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse R4 wrapper with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $legacy="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if(-not (Test-Path $legacy)){ throw 'Windows PowerShell 5.1 missing' }
          & $legacy -NoProfile -Command @'
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path 'tools/run-v024-final-installer-r4-local.ps1').Path
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'R4 wrapper PowerShell parser PASS'
          '@
          if($LASTEXITCODE -ne 0){ throw 'R4 wrapper parser failed' }
      - name: Validate exact R4 identity and release safety markers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $wrapper=Get-Content 'tools/run-v024-final-installer-r4-local.ps1' -Raw
          $base=Get-Content 'tools/run-v024-final-installer-local.ps1' -Raw
          foreach($marker in @(
            'a563fe772adff9a9c4ce834c20c6a02c802e8b61da6ff411aa103ec43383448b',
            '13e90ad2b7c8e9576a2d98150c13d570f387d74c9ecf3a797d0a9c14a1c5d0ee',
            '61078f1e6bac7c2cc541d1bc0b13d4b260c9cb431f47fef3fcff796e201a234b',
            'test-extension-update-trust-bootstrap.js'
          )) {
            if(-not $wrapper.Contains($marker)){ throw "missing R4 marker: $marker" }
          }
          if(-not $base.Contains('publication_state=BLOCKED_FINAL_GATE_ARTIFACT_ONLY')){ throw 'base builder blocked-publication marker missing' }
          foreach($bad in @('gh release create','git push origin HEAD:main','center-update.json')) {
            if($wrapper.Contains($bad) -or $base.Contains($bad)){ throw "publication side effect marker found: $bad" }
          }
          Write-Host 'R4 local builder release-safety PASS'
