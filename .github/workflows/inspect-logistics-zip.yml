name: Inspect logistics desktop package

on:
  push:
    paths:
      - ".github/workflows/inspect-logistics-zip.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect logistics JS contexts
        run: |
          rm -rf /tmp/logistics-inspect
          mkdir -p /tmp/logistics-inspect
          unzip -q downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip -d /tmp/logistics-inspect
          python - <<'PY'
          from pathlib import Path
          keys=['const vehicleTypes','const ranks','buyVehicle','starterUpgradeInfo','renderVehicleShop','vehicleDef']
          for p in Path('/tmp/logistics-inspect').rglob('*.js'):
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except: continue
              if not any(any(k in line for k in keys) for line in lines): continue
              print('\n===== ',p,' =====')
              for i,line in enumerate(lines):
                  if any(k in line for k in keys):
                      a=max(0,i-4); b=min(len(lines),i+18)
                      print(f'--- {a+1}-{b} ---')
                      for n in range(a,b): print(f'{n+1:05d}: {lines[n]}')
          PY
