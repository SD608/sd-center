name: Build SD Logistics v1.1.0 progress bridge

on:
  push:
    paths:
      - ".github/workflows/build-logistics-v110-link-progress.yml"
      - "tools/patch-logistics-v110-link-progress.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched logistics package
        run: python tools/patch-logistics-v110-link-progress.py

      - name: Verify package
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('downloads/extensions/SDLogisticsCenter_v1.1.0_Desktop.zip')
          assert p.is_file() and p.stat().st_size > 100000, p.stat().st_size if p.exists() else 'missing'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              pkg_name=next(n for n in names if n.endswith('package.json') and 'node_modules/' not in n)
              root=pkg_name[:-len('package.json')]
              pkg=json.loads(z.read(pkg_name))
              assert pkg['version']=='1.1.0', pkg
              main=z.read(root+'main.js').decode('utf-8')
              preload=z.read(root+'preload.js').decode('utf-8')
              app=z.read(root+'public/app.js').decode('utf-8')
              assert 'SD_LOGISTICS_PROGRESS_BRIDGE_V110' in main
              assert 'sdlogistics:publish-progress' in main
              assert 'publishProgress' in preload
              assert 'progressBridgePayload' in app
          catalog=json.load(open('update/extensions-catalog.json',encoding='utf-8'))
          assert catalog['apps']['sd-logistics-center-desktop']['version']=='1.1.0'
          policy=json.load(open('update/desktop-policy.json',encoding='utf-8'))
          assert policy['apps']['sd-logistics-center-desktop']['minVersion']=='1.1.0'
          print('verification OK',p.stat().st_size)
          PY

      - name: Commit build and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            downloads/extensions/SDLogisticsCenter_v1.1.0_Desktop.zip \
            update/extensions-catalog.json \
            update/desktop-policy.json \
            extensions-data.js \
            assets/js/extensions-data.js
          if git diff --cached --quiet; then
            echo "No build changes"
            exit 0
          fi
          git commit -m "build: publish SD logistics v1.1.0 progress bridge"
          git push
