name: SD Core Regression

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sd-core
    paths:
      - 'database/migrations/sd_core_wallet_v1.sql'
      - 'database/migrations/sd_core_ledger_api_v1.sql'
      - 'tests/sd-core/**'
      - '.github/workflows/sd-core-regression.yml'
  pull_request:
    paths:
      - 'database/migrations/sd_core_wallet_v1.sql'
      - 'database/migrations/sd_core_ledger_api_v1.sql'
      - 'tests/sd-core/**'
      - '.github/workflows/sd-core-regression.yml'

permissions:
  contents: read

jobs:
  wallet-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sd_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sd_core_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compatible SD Online fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sd-core/fixture.sql

      - name: Apply SD Core wallet migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_core_wallet_v1.sql

      - name: Apply SD Core ledger API migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_core_ledger_api_v1.sql

      - name: Run required wallet regression
        run: psql -v ON_ERROR_STOP=1 -f tests/sd-core/wallet_regression.sql
