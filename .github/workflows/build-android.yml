name: SD센터 Android APK 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android SDK 준비
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 설치용 테스트 APK 빌드
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/SDCenter-Mobile-V1-debug.apk

      - name: APK 다운로드 파일 등록
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-Mobile-V1-APK
          path: android-app/output/SDCenter-Mobile-V1-debug.apk
          if-no-files-found: error
