name: SD센터 Android APK 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Android 35 설치
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.13 준비
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: 설치용 테스트 APK 빌드
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/SDCenter-Mobile.apk

      - name: Actions 다운로드 파일 등록
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-Mobile-APK
          path: android-app/output/SDCenter-Mobile.apk
          if-no-files-found: error

      - name: GitHub 최신 Release에 APK 등록
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.${{ github.run_number }}
          name: SD종합센터 Mobile v1.0.${{ github.run_number }}
          body: |
            SD608 Online 홈페이지 계정과 PC SD Link를 함께 사용하는 Android 테스트 APK입니다.
            표시 금액은 실제 현금이 아닌 SD 게임 시뮬레이션용 가상 데이터입니다.
          files: android-app/output/SDCenter-Mobile.apk
          make_latest: true
