name: SD Achievement Content Move Backfill v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/migrations/sd_achievement_identity_lineage_v1.sql'
      - 'database/migrations/sd_achievement_migration_classification_v1*.sql'
      - 'database/migrations/sd_achievement_core_event_registry_v1.sql'
      - 'database/migrations/sd_achievement_content_move_backfill_v1.sql'
      - 'tests/achievement-lineage/**'
      - 'tests/achievement-migration/**'
      - 'tests/achievement-core-event/**'
      - 'tests/achievement-content-move/**'
      - 'docs/achievement-content-move-backfill-v1.md'
      - '.github/workflows/achievement-content-move-backfill-v1.yml'

permissions:
  contents: read

jobs:
  content-move-backfill-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: achievement_content_move_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d achievement_content_move_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: achievement_content_move_test
    steps:
      - uses: actions/checkout@v4
      - name: Build Chapter 3-1 fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-lineage/fixture.sql
      - name: Apply permanent achievement identity
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_identity_lineage_v1.sql
      - name: Add Chapter 3-2 catalog and player assets
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-migration/fixture.sql
      - name: Apply Chapter 3-2 classification
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_migration_classification_v1.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_migration_classification_v1_rls.sql
      - name: Add Core event fixture support
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-core-event/fixture.sql
      - name: Apply and regress Chapter 3-3 Core registry
        working-directory: tests/achievement-core-event
        run: psql -v ON_ERROR_STOP=1 -f registry_event_stat_regression.sql
      - name: Add Chapter 3-4 server-state fixture and preservation snapshots
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-content-move/fixture.sql
      - name: Apply Chapter 3-4 content move and backfill
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_content_move_backfill_v1.sql
      - name: Run Chapter 3-4 monotonic and idempotent regression
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-content-move/content_move_backfill_regression.sql
      - name: Verify authority and release side-effect safety
        shell: bash
        run: |
          set -euo pipefail
          SQL=database/migrations/sd_achievement_content_move_backfill_v1.sql
          grep -q "move set drifted from the reviewed 13-code" "$SQL"
          grep -q "collection baseline drifted: expected 35" "$SQL"
          grep -q "binding_state='active'" "$SQL"
          grep -q "evaluation_mode='stat_threshold'" "$SQL"
          grep -q "ACHIEVEMENT_PRODUCER_BINDING_STAT_OWNER_MISMATCH" "$SQL"
          grep -q "client_submission_allowed=false" "$SQL"
          grep -q "ingress_mode='internal_only'" "$SQL"
          grep -q "sync_sd_sta_flea_legacy_v1" "$SQL"
          grep -q "accept_sd_achievement_event_v1" "$SQL"
          grep -q "Chapter 3-4 legacy refresh functions still contain direct moved-achievement writers" "$SQL"
          ! grep -Eiq 'insert[[:space:]]+into[[:space:]]+public\.sd_user_achievements' "$SQL"
          ! grep -Eiq '(^|[[:space:]])delete[[:space:]]+from[[:space:]]+public\.sd_(achievement_progress|user_achievements|achievements)' "$SQL"
          ! grep -Eiq 'wallets[[:space:]]+set[[:space:]]+balance|site-config\.js|center-update\.json|releases/download' "$SQL"
          ! grep -Eiq 'client_submission_allowed[[:space:]]*=[[:space:]]*true|ingress_mode[[:space:]]*=[[:space:]]*'"'"'authenticated_validated'"'"'' "$SQL"
          echo 'Chapter 3-4 identity/asset/authority/release safety guard PASS'
