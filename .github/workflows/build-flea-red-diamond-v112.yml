name: Build Flea Market v1.1.2 Red Diamond

on:
  push:
    branches:
      - feature/flea-red-diamond
    paths:
      - '.github/workflows/build-flea-red-diamond-v112.yml'
      - 'tools/patch-flea-red-diamond-v112.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flea-red-diamond
          fetch-depth: 0

      - name: Build Red Diamond update
        run: python tools/patch-flea-red-diamond-v112.py

      - name: Validate JavaScript
        run: |
          rm -rf /tmp/flea112-validate
          mkdir -p /tmp/flea112-validate
          unzip -q downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip -d /tmp/flea112-validate
          node --check /tmp/flea112-validate/main.js
          node --check /tmp/flea112-validate/public/app.js
          node --check assets/js/flea-market-mobile.js

      - name: Commit v1.1.2 build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip assets/js/flea-market-mobile.js flea-market-mobile.html
          git commit -m '플리마켓 v1.1.2: 레드 다이아 0.001% 한정판'
          git push origin HEAD:feature/flea-red-diamond
