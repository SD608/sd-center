name: Build Flea Market v1.1.2 Red Diamond

on:
  push:
    branches:
      - feature/flea-red-diamond
    paths:
      - '.github/workflows/build-flea-red-diamond-v112.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flea-red-diamond
          fetch-depth: 0

      - name: Patch PC expansion and mobile market
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          import zipfile

          SRC = Path('downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip')
          OUT = Path('downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip')
          ROOT = Path('/tmp/flea112')
          RED_NAME = '레드 다이아몬드'

          if ROOT.exists():
              shutil.rmtree(ROOT)
          ROOT.mkdir(parents=True)
          with zipfile.ZipFile(SRC, 'r') as zf:
              zf.extractall(ROOT)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'Missing anchor: {label}')
              return text.replace(old, new, 1)

          def patch_core_js(text):
              jackpot = 'const SAFE_JACKPOT_VALUE = Math.max(...ITEMS.safe.map(([, value]) => value));'
              text = replace_once(
                  text,
                  jackpot,
                  jackpot + '\nconst RED_DIAMOND_NAME = "레드 다이아몬드";\nconst RED_DIAMOND_CHANCE_DENOMINATOR = 100000;',
                  'red diamond constants',
              )

              roll_anchor = 'function rollItem(tierId, boxId) {\n  const pool = ITEMS[tierId] || ITEMS.worn;'
              helper = '''function makeRedDiamond(boxId) {
  return {
    id: `ITEM-${crypto.randomUUID().slice(0, 8).toUpperCase()}`,
    boxId,
    name: RED_DIAMOND_NAME,
    tier: "safe",
    originalValue: 1,
    currentValue: 1,
    conditionPercent: 100,
    acquiredAt: new Date().toISOString(),
    source: "금고 한정판",
    syncStatus: "pending",
    limitedEdition: true,
    sellable: false,
    tradeLocked: true,
  };
}

function rollRedDiamond(boxId) {
  return randomInt(RED_DIAMOND_CHANCE_DENOMINATOR) === 0 ? makeRedDiamond(boxId) : null;
}

function isLimitedItem(item) {
  return Boolean(item && (item.sellable === false || item.tradeLocked === true || item.name === RED_DIAMOND_NAME));
}

function itemValueDisplay(item) {
  if (isLimitedItem(item)) return "판매 불가 · 한정판 상품";
  return `원본 가치 ${Number(item?.originalValue || 0).toLocaleString("ko-KR")}원`;
}

function rollItem(tierId, boxId) {
  if (tierId === "safe") {
    const limited = rollRedDiamond(boxId);
    if (limited) return limited;
  }
  const pool = ITEMS[tierId] || ITEMS.worn;'''
              text = replace_once(text, roll_anchor, helper, 'rollItem rare reward')

              # 은행의 빈 금고도 "금고를 연 1회"로 보고 레드 다이아 1/100,000 판정은 수행합니다.
              text, count = re.subn(
                  r'const pendingItem = ([^;\n]*?\.empty) \? null : rollItem\("safe", safeId\);',
                  r'const pendingItem = \1 ? rollRedDiamond(safeId) : rollItem("safe", safeId);',
                  text,
              )
              if count < 1:
                  raise RuntimeError('Missing bank empty-safe reward anchor')

              old_glow = '''function previewGlowForSafeItem(item) {
  return Number(item?.originalValue || 0) >= SAFE_JACKPOT_VALUE ? "ruby" : "safe";
}'''
              new_glow = '''function previewGlowForSafeItem(item) {
  if (isLimitedItem(item)) return "ruby";
  return Number(item?.originalValue || 0) >= SAFE_JACKPOT_VALUE ? "ruby" : "safe";
}'''
              text = replace_once(text, old_glow, new_glow, 'red diamond glow')

              # 가치 하락은 판매 가능한 일반 물품에만 적용합니다.
              text = re.sub(
                  r'for \(const item of (state|localState)\.items\) \{\n(\s+)const baseCurrent',
                  r'for (const item of \1.items) {\n\2if (isLimitedItem(item)) continue;\n\2const baseCurrent',
                  text,
              )
              return text

          main_path = ROOT / 'main.js'
          app_path = ROOT / 'public/app.js'
          main = patch_core_js(main_path.read_text(encoding='utf-8'))
          app = patch_core_js(app_path.read_text(encoding='utf-8'))

          # PC 보관함/획득 화면에서는 가격 대신 한정판·판매불가 상태를 보여줍니다.
          app = app.replace('원본 가치 ${money(item.originalValue)}', '${itemValueDisplay(item)}')
          app = app.replace(
              '<div class="item-current-value ${dropped ? "degraded" : ""}">현재 가치 <strong>${money(currentValue)}</strong></div>',
              '<div class="item-current-value ${dropped && !isLimitedItem(item) ? "degraded" : ""}">${isLimitedItem(item) ? "<strong>한정판 · 판매 불가</strong>" : `현재 가치 <strong>${money(currentValue)}</strong>`}</div>'
          )
          app = app.replace(
              'makeMissionRecord(`${item.name} · ${money(item.originalValue)}`, "#ffd966", "safe")',
              'makeMissionRecord(`${item.name} · ${isLimitedItem(item) ? "한정판 · 판매 불가" : money(item.originalValue)}`, "#ffd966", "safe")'
          )

          main_path.write_text(main, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')

          # 버전 메타데이터
          package_path = ROOT / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.1.2'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = ROOT / 'package-lock.json'
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding='utf-8'))
              lock['version'] = '1.1.2'
              if isinstance(lock.get('packages'), dict) and isinstance(lock['packages'].get(''), dict):
                  lock['packages']['']['version'] = '1.1.2'
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          appmeta_path = ROOT / 'sd-app.json'
          appmeta = json.loads(appmeta_path.read_text(encoding='utf-8'))
          appmeta['version'] = '1.1.2'
          appmeta['displayVersion'] = 'PC Expansion · v1.1.2'
          appmeta_path.write_text(json.dumps(appmeta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          notes_path = ROOT / 'RELEASE_NOTES.txt'
          old_notes = notes_path.read_text(encoding='utf-8') if notes_path.exists() else ''
          note = 'v1.1.2\n- 금고 개봉 1회당 0.001%(1/100,000) 확률로 레드 다이아몬드가 등장합니다.\n- 레드 다이아몬드는 판매할 수 없는 한정판 아이템이며 가치 하락 대상에서도 제외됩니다.\n- 은행 금고는 기존처럼 현장에서 직접 개방합니다.\n\n'
          notes_path.write_text(note + old_notes, encoding='utf-8')

          # 모바일 플리마켓: 레드 다이아 판매 UI 차단 + 시스템 마켓 방어 필터
          mobile_path = Path('assets/js/flea-market-mobile.js')
          mobile = mobile_path.read_text(encoding='utf-8')
          mobile = replace_once(
              mobile,
              '  let currentProfile = null;\n',
              '  let currentProfile = null;\n  const RED_DIAMOND_NAME = "레드 다이아몬드";\n',
              'mobile red diamond constant'
          )
          mobile = replace_once(
              mobile,
              '      const purchased = item.acquisition_kind === "system_purchase";\n      const salePrice = purchased',
              '      const purchased = item.acquisition_kind === "system_purchase";\n      const saleLocked = item.name === RED_DIAMOND_NAME;\n      const salePrice = purchased',
              'mobile sale lock flag'
          )
          mobile = replace_once(
              mobile,
              '      value.innerHTML = `${won(item.current_value)}<small>현재 가치</small>`;',
              '      value.innerHTML = saleLocked ? `한정판<small>판매 불가</small>` : `${won(item.current_value)}<small>현재 가치</small>`;',
              'mobile limited value label'
          )
          mobile = replace_once(
              mobile,
              '      button.textContent = `시스템에 ${won(salePrice)} 판매`;\n      const rule = document.createElement("div");\n      rule.className = "flea-resale";\n      rule.textContent = purchased ? `구매가 ${won(item.purchase_price)} → 재판매 50%` : "PC 획득품 · 판매 수수료 5%";',
              '      button.textContent = saleLocked ? "판매 불가 · 한정판" : `시스템에 ${won(salePrice)} 판매`;\n      button.disabled = saleLocked;\n      const rule = document.createElement("div");\n      rule.className = "flea-resale";\n      rule.textContent = saleLocked ? "금고 0.001% 한정판 · 시스템 판매 불가" : (purchased ? `구매가 ${won(item.purchase_price)} → 재판매 50%` : "PC 획득품 · 판매 수수료 5%");',
              'mobile sell button lock'
          )
          mobile = replace_once(
              mobile,
              '      button.addEventListener("click", async () => {\n        const message = purchased',
              '      button.addEventListener("click", async () => {\n        if (saleLocked) return;\n        const message = purchased',
              'mobile sell handler lock'
          )
          mobile = replace_once(
              mobile,
              '      market = marketResult.data?.items || [];',
              '      market = (marketResult.data?.items || []).filter((item) => item.name !== RED_DIAMOND_NAME);',
              'mobile market defensive filter'
          )
          mobile_path.write_text(mobile, encoding='utf-8')

          mobile_html_path = Path('flea-market-mobile.html')
          mobile_html = mobile_html_path.read_text(encoding='utf-8')
          mobile_html = replace_once(mobile_html, 'assets/js/flea-market-mobile.js?v=1', 'assets/js/flea-market-mobile.js?v=2', 'mobile cache bump')
          mobile_html = replace_once(
              mobile_html,
              'PC에서 직접 획득한 물건은 기존 규칙대로 현재 가치의 95%를 받습니다. 시스템에서 구매한 물건은 구매가의 정확히 50%에만 재판매할 수 있습니다.',
              'PC에서 직접 획득한 물건은 기존 규칙대로 현재 가치의 95%를 받습니다. 시스템에서 구매한 물건은 구매가의 정확히 50%에만 재판매할 수 있습니다. 레드 다이아몬드는 금고 한정판이라 판매할 수 없습니다.',
              'mobile rule copy'
          )
          mobile_html_path.write_text(mobile_html, encoding='utf-8')

          if OUT.exists():
              OUT.unlink()
          with zipfile.ZipFile(OUT, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.relative_to(ROOT).as_posix())

          print(f'Built {OUT} ({OUT.stat().st_size} bytes)')
          PY

      - name: Validate build
        shell: bash
        run: |
          set -euo pipefail
          unzip -t downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip
          rm -rf /tmp/flea112-check && mkdir -p /tmp/flea112-check
          unzip -q downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip -d /tmp/flea112-check
          node --check /tmp/flea112-check/main.js
          node --check /tmp/flea112-check/public/app.js
          node --check assets/js/flea-market-mobile.js
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('/tmp/flea112-check')
          main = (root/'main.js').read_text(encoding='utf-8')
          app = (root/'public/app.js').read_text(encoding='utf-8')
          mobile = Path('assets/js/flea-market-mobile.js').read_text(encoding='utf-8')
          html = Path('flea-market-mobile.html').read_text(encoding='utf-8')
          package = json.loads((root/'package.json').read_text(encoding='utf-8'))
          appmeta = json.loads((root/'sd-app.json').read_text(encoding='utf-8'))

          for text in (main, app):
              assert 'const RED_DIAMOND_CHANCE_DENOMINATOR = 100000;' in text
              assert 'randomInt(RED_DIAMOND_CHANCE_DENOMINATOR) === 0' in text
              assert 'name: RED_DIAMOND_NAME' in text
              assert 'limitedEdition: true' in text
              assert 'sellable: false' in text
              assert 'tradeLocked: true' in text
              assert '? rollRedDiamond(safeId) : rollItem("safe", safeId)' in text
              assert 'if (isLimitedItem(item)) return "ruby";' in text
          assert '판매 불가 · 한정판 상품' in app
          assert 'const saleLocked = item.name === RED_DIAMOND_NAME;' in mobile
          assert 'button.disabled = saleLocked;' in mobile
          assert 'if (saleLocked) return;' in mobile
          assert '.filter((item) => item.name !== RED_DIAMOND_NAME)' in mobile
          assert 'flea-market-mobile.js?v=2' in html
          assert package['version'] == '1.1.2'
          assert appmeta['version'] == '1.1.2'
          assert appmeta['displayVersion'] == 'PC Expansion · v1.1.2'
          print('RED DIAMOND V1.1.2 ASSERTIONS PASSED')
          PY

      - name: Commit v1.1.2 build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip assets/js/flea-market-mobile.js flea-market-mobile.html
          git commit -m '플리마켓 v1.1.2: 레드 다이아 0.001% 한정판'
          git push origin HEAD:feature/flea-red-diamond
