name: Build SDCenter UI Preview

on:
  push:
    branches: [preview/center-ui-v230-20260819]
    paths:
      - 'tools/center-ui-preview-assets-v04-good.b64'
      - 'tools/patch-center-ui-v04.js'
      - 'tools/patch-center-ui-v05.js'
      - '.github/workflows/build-center-ui-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/center-ui-preview-assets-v04-good.b64'
      - 'tools/patch-center-ui-v04.js'
      - 'tools/patch-center-ui-v05.js'
      - '.github/workflows/build-center-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.7.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.7/SDCenterSetup.exe' -OutFile $setup
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '9e17490d34a10f8ae076597ef2fb27451bd6c11a318776c4fd70ecde1d87fcde'){ throw "v2.2.7 hash mismatch: $hash" }
          "BASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process -FilePath $env:BASE_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $base=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.7'
          if(-not (Test-Path (Join-Path $base 'SDCenter.exe'))){ throw 'v2.2.7 install missing' }
          "BASE_APP_DIR=$base" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare portable preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $preview=Join-Path $env:RUNNER_TEMP 'SDCenter-UI-Preview-v0.5'
          if(Test-Path $preview){ Remove-Item $preview -Recurse -Force }
          Copy-Item $env:BASE_APP_DIR $preview -Recurse -Force
          $root=Join-Path $preview 'resources\app'
          $assets=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04'
          if(Test-Path $assets){ Remove-Item $assets -Recurse -Force }
          $assetZip=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04.zip'
          $assetB64=(Get-Content 'tools/center-ui-preview-assets-v04-good.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes($assetZip, [Convert]::FromBase64String($assetB64))
          $assetHash=(Get-FileHash $assetZip -Algorithm SHA256).Hash.ToLower()
          if($assetHash -ne '1b250228b0112b8722eec3eb4cf89dbe138c20d5e7060e7995812e2d73db6b72'){ throw "v0.4 asset hash mismatch: $assetHash" }
          Expand-Archive -Path $assetZip -DestinationPath $assets -Force
          Copy-Item (Join-Path $assets 'index.html') (Join-Path $root 'public\index.html') -Force
          Copy-Item (Join-Path $assets 'ui-preview.css') (Join-Path $root 'public\css\ui-preview.css') -Force
          Copy-Item (Join-Path $assets 'ui-preview.js') (Join-Path $root 'public\js\ui-preview.js') -Force
          node tools/patch-center-ui-v04.js "$root"
          node tools/patch-center-ui-v05.js "$root"
          @(
            'SD종합센터 UI Remake Preview v0.5',
            'Base: official v2.2.7',
            '',
            'v0.5 수정:',
            '- 완전 종료 후 재실행해도 폴더 안 앱 배치가 유지되도록 수정',
            '- 앱 목록이 로딩되기 전 저장된 폴더 멤버십을 삭제하지 않도록 초기화 순서 보강',
            '- v0.4의 새 폴더/이름 변경/기본 폴더 제거 동작 유지',
            '',
            '참고:',
            '- v0.4에서 이미 한 번 풀려 나온 앱은 v0.5에서 폴더에 다시 넣어야 합니다.',
            '- 그 뒤부터는 완전 종료 후에도 폴더 배치가 유지되어야 합니다.',
            '',
            '실행 방법:',
            '1. 기존 종합센터를 완전 종료합니다.',
            '2. 이 폴더의 SDCenter.exe를 실행합니다.',
            '3. 프리뷰는 정식 업데이트 서버에 등록되지 않습니다.'
          ) | Set-Content (Join-Path $preview 'PREVIEW_README.txt') -Encoding utf8
          'SD종합센터 UI Preview`nBase: v2.2.7`nPreview: UI Remake v0.5`nOfficial update metadata is NOT changed.' | Set-Content (Join-Path $root 'UI_PREVIEW.txt') -Encoding utf8
          "PREVIEW_DIR=$preview" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate preview source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check "$env:APP_ROOT\main.js"
          node --check "$env:APP_ROOT\public\js\app.js"
          node --check "$env:APP_ROOT\public\js\ui-preview.js"
          node --check "$env:APP_ROOT\preload.js"
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "Base version changed unexpectedly: $($pkg.version)" }
          $html=Get-Content "$env:APP_ROOT\public\index.html" -Raw
          $previewJs=Get-Content "$env:APP_ROOT\public\js\ui-preview.js" -Raw
          $main=Get-Content "$env:APP_ROOT\main.js" -Raw
          $appJs=Get-Content "$env:APP_ROOT\public\js\app.js" -Raw
          foreach($marker in @('previewHomePanel','previewHomeGrid','previewUpdatesPanel','previewFolderBackdrop','previewNameBackdrop','globalSearchInput')) {
            if(-not $html.Contains($marker)){ throw "preview HTML marker missing: $marker" }
          }
          foreach($marker in @('PREVIEW_LAYOUT_KEY = "sd-center-ui-preview-home-v2"','function createPreviewFolder()','preview.layout.push({ type: "folder"','previewElements.newFolderButton.addEventListener("click", createPreviewFolder)','UI Preview v0.5: 앱 목록이 로딩되기 전에는 저장된 폴더 멤버십을 정리하지 않습니다.','if (!Array.isArray(state.apps) || state.apps.length === 0)','preview.layout = Array.isArray(preview.layout) ? preview.layout : [];')) {
            if(-not $previewJs.Contains($marker)){ throw "v0.5 folder persistence marker missing: $marker" }
          }
          $guardIndex=$previewJs.IndexOf('UI Preview v0.5: 앱 목록이 로딩되기 전에는 저장된 폴더 멤버십을 정리하지 않습니다.')
          $pruneIndex=$previewJs.IndexOf('const validIds = new Set(state.apps.map((app) => app.id));')
          if($guardIndex -lt 0 -or $pruneIndex -lt 0 -or $guardIndex -gt $pruneIndex){ throw 'startup persistence guard must run before layout pruning' }
          foreach($forbidden in @('id: "economy"','id: "games"','name: "경제"','name: "게임"')) {
            if($previewJs.Contains($forbidden)){ throw "default folder must not remain: $forbidden" }
          }
          foreach($marker in @('Menu.setApplicationMenu(null);','mainWindow.setMenuBarVisibility(false);','mainWindow.removeMenu();')) {
            if(-not $main.Contains($marker)){ throw "menu removal marker missing: $marker" }
          }
          if(-not $appJs.Contains('sdCenterPreviewMarkLaunched')){ throw 'launch-all recent hook missing' }
          if($appJs.Contains('elements.quitCenterButton.textContent = "완전 종료";')){ throw 'old quit label remains' }

      - name: Smoke test portable preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe=Join-Path $env:PREVIEW_DIR 'SDCenter.exe'
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if($proc.HasExited){ throw "UI preview exited during smoke test: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Write build info
        shell: pwsh
        run: |
          $files=(Get-ChildItem $env:PREVIEW_DIR -Recurse -File | Measure-Object).Count
          $bytes=(Get-ChildItem $env:PREVIEW_DIR -Recurse -File | Measure-Object Length -Sum).Sum
          @("Files: $files","Bytes: $bytes","Commit: $env:GITHUB_SHA","Built: $(Get-Date -Format o)") | Set-Content (Join-Path $env:PREVIEW_DIR 'BUILD_INFO.txt') -Encoding utf8

      - name: Upload portable preview
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-UI-Preview-v0.5-win-x64
          path: ${{ env.PREVIEW_DIR }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
