name: Inspect Flea red diamond patch points

on:
  push:
    branches:
      - feature/flea-red-diamond
    paths:
      - '.github/workflows/inspect-flea-red-diamond.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flea-red-diamond
      - name: Inspect deployed flea source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flea111 && mkdir -p /tmp/flea111
          unzip -q downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip -d /tmp/flea111
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/flea111')
          targets = [root/'main.js', root/'public/app.js']
          needles = [
              'function rollItem', 'function completeOpen', 'safeAttempt',
              'sell', 'currentValue', 'originalValue', 'item-card', 'item-actions'
          ]
          out = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              out.append(f'===== {path.relative_to(root)} =====')
              seen = set()
              for needle in needles:
                  for i, line in enumerate(lines):
                      if needle.lower() in line.lower():
                          start = max(0, i-18)
                          end = min(len(lines), i+45)
                          key = (start, end)
                          if key in seen:
                              continue
                          seen.add(key)
                          out.append(f'--- needle: {needle} @ line {i+1} ---')
                          out.extend(f'{j+1:04d}: {lines[j]}' for j in range(start, end))
                          out.append('')
          dest = Path('diagnostics/flea-red-diamond-source.txt')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/flea-red-diamond-source.txt
          git commit -m '진단: 플리마켓 레드 다이아 패치 지점 확인'
          git push origin HEAD:feature/flea-red-diamond
