name: Inspect Flea integration sources

on:
  push:
    branches:
      - chatgpt/flea-v110-rebuild
    paths:
      - '.github/workflows/inspect-flea-integration.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect v1.0.4 and companion integrations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/f104 /tmp/link /tmp/logi
          mkdir -p /tmp/f104 /tmp/link /tmp/logi
          unzip -q downloads/extensions/SDFleaMarket_v1.0.4_Desktop.zip -d /tmp/f104
          unzip -q downloads/extensions/SDLink_v1.2.7_Desktop.zip -d /tmp/link || true
          unzip -q downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip -d /tmp/logi || true

          echo '=== FLEA META ==='
          cat /tmp/f104/package.json
          cat /tmp/f104/sd-app.json
          echo '=== FLEA RELEASE NOTES ==='
          cat /tmp/f104/RELEASE_NOTES.txt

          echo '=== FLEA integration grep ==='
          grep -RniE 'logistics|company|rank|refresh|sync|bridge|online|inventory|storage|sd.?link|flea' /tmp/f104/main.js /tmp/f104/preload.js /tmp/f104/src /tmp/f104/public/app.js /tmp/f104/public/index.html | head -n 500 || true

          echo '=== FLEA src/sd-integration.js ==='
          cat /tmp/f104/src/sd-integration.js

          echo '=== FLEA preload.js ==='
          cat /tmp/f104/preload.js

          echo '=== LINK integration grep ==='
          grep -RniE 'bridge|flea|inventory|logistics|company|rank|refresh|sync|online|127|1\.2\.7' /tmp/link 2>/dev/null | head -n 500 || true

          echo '=== LOGISTICS integration grep ==='
          grep -RniE 'bridge|flea|inventory|logistics|company|rank|refresh|sync|snapshot|shared|state' /tmp/logi 2>/dev/null | head -n 500 || true

          echo '=== likely text files in Link ==='
          find /tmp/link -maxdepth 3 -type f \( -name '*.js' -o -name '*.json' -o -name '*.txt' -o -name '*.md' \) -print | sort | head -n 100
          echo '=== likely text files in Logistics ==='
          find /tmp/logi -maxdepth 3 -type f \( -name '*.js' -o -name '*.json' -o -name '*.txt' -o -name '*.md' \) -print | sort | head -n 100
