name: Cleanup Economy Temp
on:
  push:
    paths:
      - '.github/workflows/cleanup-economy-temp.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary patch files
        shell: bash
        run: |
          rm -rf .tmp-btc-upload
          rm -f .github/workflows/apply-economy-nerf.yml
          rm -f .github/workflows/cleanup-economy-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary economy patch helpers" || exit 0
          git push
