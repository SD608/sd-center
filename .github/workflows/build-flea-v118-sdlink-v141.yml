name: Build Flea v1.1.8 and SD Link v1.4.1

on:
  push:
    branches: [fix/flea-v118-sdlink-icon-20260818]
    paths:
      - 'tools/patch-flea-v118-bank-heist.py'
      - 'tools/patch-sdlink-v141-icon.py'
      - 'assets/icons/sdlink.svg'
      - '.github/workflows/build-flea-v118-sdlink-v141.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flea-v118-sdlink-icon-20260818
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check patch scripts
        run: |
          python -m py_compile tools/patch-flea-v118-bank-heist.py
          python -m py_compile tools/patch-sdlink-v141-icon.py

      - name: Build flea market v1.1.8
        run: python tools/patch-flea-v118-bank-heist.py

      - name: Build SD Link v1.4.1
        run: python tools/patch-sdlink-v141-icon.py

      - name: Validate built packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, tempfile, zipfile
          from pathlib import Path

          root = Path('.')
          flea = root / 'downloads/extensions/SDFleaMarket_v1.1.8_Desktop.zip'
          link = root / 'downloads/extensions/SDLink_v1.4.1_Desktop.zip'
          assert flea.is_file() and flea.stat().st_size > 100000, flea
          assert link.is_file() and link.stat().st_size > 100000, link

          with tempfile.TemporaryDirectory() as tmp:
              dst = Path(tmp) / 'flea'
              dst.mkdir()
              with zipfile.ZipFile(flea) as z: z.extractall(dst)
              package = next(p for p in dst.rglob('package.json') if 'node_modules' not in p.parts)
              app_root = package.parent
              main = (app_root / 'main.js').read_text(encoding='utf-8')
              app = (app_root / 'public/app.js').read_text(encoding='utf-8')
              chase = (app_root / 'public/bankchase.js').read_text(encoding='utf-8')
              assert json.loads(package.read_text(encoding='utf-8'))['version'] == '1.1.8'
              assert 'state.mission.safeOpened || 0) < 1' not in app
              assert 'bankCarriedSafeCount(mission) < 1' in main
              assert 'Array.from({ length: 8 }' in main and 'Array.from({ length: 8 }' in app
              assert 'emptySlots' not in main and 'emptySlots' not in app
              assert 'const risk = 0.32' in chase
              print('FLEA_ROOT=' + str(app_root))

          with tempfile.TemporaryDirectory() as tmp:
              dst = Path(tmp) / 'link'
              dst.mkdir()
              with zipfile.ZipFile(link) as z: z.extractall(dst)
              package = next(p for p in dst.rglob('package.json') if 'node_modules' not in p.parts)
              app_root = package.parent
              manifest = json.loads((app_root / 'sd-app.json').read_text(encoding='utf-8'))
              assert json.loads(package.read_text(encoding='utf-8'))['version'] == '1.4.1'
              assert manifest['version'] == '1.4.1'
              assert manifest['icon'] == 'assets/sdlink-icon.svg'
              assert (app_root / manifest['icon']).is_file()
              print('LINK_ROOT=' + str(app_root))
          PY

      - name: JavaScript syntax smoke test from packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/flea118" "$RUNNER_TEMP/link141"
          mkdir -p "$RUNNER_TEMP/flea118" "$RUNNER_TEMP/link141"
          unzip -q downloads/extensions/SDFleaMarket_v1.1.8_Desktop.zip -d "$RUNNER_TEMP/flea118"
          unzip -q downloads/extensions/SDLink_v1.4.1_Desktop.zip -d "$RUNNER_TEMP/link141"
          FLEA_ROOT=$(find "$RUNNER_TEMP/flea118" -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n1)
          LINK_ROOT=$(find "$RUNNER_TEMP/link141" -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n1)
          node --check "$FLEA_ROOT/main.js"
          node --check "$FLEA_ROOT/public/app.js"
          node --check "$FLEA_ROOT/public/bankchase.js"
          node --check "$LINK_ROOT/main.js"

      - name: Commit built releases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            downloads/extensions/SDFleaMarket_v1.1.8_Desktop.zip \
            downloads/extensions/SDLink_v1.4.1_Desktop.zip \
            extensions-data.js assets/js/extensions-data.js \
            update/extensions-catalog.json update/desktop-policy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: 플리마켓 v1.1.8·SD Link v1.4.1'
          git push origin HEAD:fix/flea-v118-sdlink-icon-20260818
