name: Validate SD Flea Market PC Prototype
on:
  push:
    branches: [dev-flea-market-pc-20260816]
    paths:
      - 'dev/flea-market-pc/**'
      - '.github/workflows/test-flea-market-pc.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        working-directory: dev/flea-market-pc
        run: |
          node --check main.js
          node --check preload.js
          node --check public/app.js
      - name: Manifest checks
        working-directory: dev/flea-market-pc
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.1.0'||p.main!=='main.js') process.exit(1)"
          node -e "const m=require('./sd-app.json'); if(m.id!=='sd-flea-market'||m.version!=='0.1.0') process.exit(1)"
      - name: Gameplay constant checks
        working-directory: dev/flea-market-pc
        run: |
          grep -q 'probability: 55' main.js
          grep -q 'probability: 29' main.js
          grep -q 'probability: 11' main.js
          grep -q 'probability: 3' main.js
          grep -q 'probability: 2' main.js
          grep -q 'CUTTER_PRICE = 100000' main.js
          grep -q 'LOCKPICK_PRICE = 10000' main.js
