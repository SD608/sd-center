name: Fix mobile vault RPC catch

on:
  push:
    branches:
      - chatgpt/fix-mobile-vault-rpc-catch-20260817

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-mobile-vault-rpc-catch-20260817
          fetch-depth: 0

      - name: Patch and validate mobile vault
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/js/mobile-vault.js')
          text = p.read_text(encoding='utf-8')
          old = '''    if (Number.isFinite(snapshotBars) && Number.isFinite(snapshotGrams)) {
              void mobile.auth.client.rpc("upsert_sd_flea_gold_snapshot", {
                p_gold_bars: snapshotBars,
                p_gold_grams: snapshotGrams
              }).catch(() => {});
            }
          '''
          new = '''    if (Number.isFinite(snapshotBars) && Number.isFinite(snapshotGrams)) {
              void (async () => {
                try {
                  const { error } = await mobile.auth.client.rpc("upsert_sd_flea_gold_snapshot", {
                    p_gold_bars: snapshotBars,
                    p_gold_grams: snapshotGrams
                  });
                  if (error) throw error;
                } catch (_) {
                  // 프로필용 금 보유량 동기화 실패가 금고 화면 자체를 막지 않게 합니다.
                }
              })();
            }
          '''
          if old not in text:
              raise SystemExit('snapshot rpc catch block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('vault-mobile.html')
          text = p.read_text(encoding='utf-8')
          if 'assets/js/mobile-vault.js?v=8' not in text:
              raise SystemExit('vault cache marker v8 not found')
          text = text.replace('assets/js/mobile-vault.js?v=8', 'assets/js/mobile-vault.js?v=9', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('service-worker.js')
          text = p.read_text(encoding='utf-8')
          if 'sd608-mobile-v12-profile-gold-fix' not in text:
              raise SystemExit('service worker cache marker not found')
          text = text.replace('sd608-mobile-v12-profile-gold-fix', 'sd608-mobile-v13-vault-rpc-fix', 1)
          text = text.replace('./assets/js/mobile-vault.js?v=8', './assets/js/mobile-vault.js?v=9', 1)
          p.write_text(text, encoding='utf-8')
          PY

          node --check assets/js/mobile-vault.js
          git diff --check
          ! grep -Fq '}).catch(() => {});' assets/js/mobile-vault.js
          grep -Fq 'await mobile.auth.client.rpc("upsert_sd_flea_gold_snapshot"' assets/js/mobile-vault.js
          grep -Fq 'mobile-vault.js?v=9' vault-mobile.html
          grep -Fq 'sd608-mobile-v13-vault-rpc-fix' service-worker.js

          rm -f .github/workflows/fix-mobile-vault-rpc-catch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/mobile-vault.js vault-mobile.html service-worker.js .github/workflows/fix-mobile-vault-rpc-catch.yml
          git commit -m '모바일 금고 RPC catch 오류 수정'
          git push origin HEAD:chatgpt/fix-mobile-vault-rpc-catch-20260817
