name: Build SD Link v1.2.9 achievements

on:
  push:
    paths:
      - ".github/workflows/build-sdlink-v129-achievements.yml"
      - "tools/patch-sdlink-v129-achievements.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SD Link v1.2.9
        run: python tools/patch-sdlink-v129-achievements.py
      - name: Verify package
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('downloads/extensions/SDLink_v1.2.9_Desktop.zip')
          assert p.is_file() and p.stat().st_size>60000, p.stat().st_size if p.exists() else 'missing'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              r=next(n for n in z.namelist() if n.endswith('src/achievement-reader.js'))
              s=next(n for n in z.namelist() if n.endswith('src/sync-engine.js'))
              pkg=next(n for n in z.namelist() if n.endswith('package.json'))
              assert 'SDLINK_ACHIEVEMENT_BRIDGE_V129' in z.read(r).decode()
              assert 'sync_sd_achievement_progress' in z.read(s).decode()
              assert json.loads(z.read(pkg).decode())['version']=='1.2.9'
          c=json.loads(Path('update/extensions-catalog.json').read_text())
          assert c['apps']['sdlink-desktop']['version']=='1.2.9'
          print('SD Link v1.2.9 verification passed')
          PY
      - name: Commit built package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/extensions/SDLink_v1.2.9_Desktop.zip update/extensions-catalog.json assets/js/extensions-data.js extensions-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: publish SD Link v1.2.9 achievement bridge"
          git push
