name: Build Flea v1.1.9 Safe Storage

on:
  push:
    branches: [fix/flea-v119-safe-storage-20260818]
    paths:
      - 'tools/patch-flea-v119-safe-storage.py'
      - '.github/workflows/build-flea-v118-sdlink-v141-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flea-v119-safe-storage-20260818
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Flea v1.1.9
        run: |
          python -m py_compile tools/patch-flea-v119-safe-storage.py
          python tools/patch-flea-v119-safe-storage.py

      - name: Validate package internals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/flea119"
          mkdir -p "$RUNNER_TEMP/flea119"
          unzip -q downloads/extensions/SDFleaMarket_v1.1.9_Desktop.zip -d "$RUNNER_TEMP/flea119"
          FLEA_ROOT=$(find "$RUNNER_TEMP/flea119" -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n1)
          node --check "$FLEA_ROOT/main.js"
          node --check "$FLEA_ROOT/public/app.js"
          node --check "$FLEA_ROOT/public/bankchase.js"
          grep -q '"version": "1.1.9"' "$FLEA_ROOT/package.json"
          grep -q 'objectLabel: "금고"' "$FLEA_ROOT/main.js"
          ! grep -q '은행 금고 ${index + 1}' "$FLEA_ROOT/main.js"
          grep -q 'state.boxes.unshift(box)' "$FLEA_ROOT/main.js"
          grep -q 'localState.boxes.unshift(box)' "$FLEA_ROOT/public/app.js"
          grep -q '상자 보관함에 보관했으니 원하는 때 직접 열 수 있습니다.' "$FLEA_ROOT/public/app.js"
          grep -q 'Array.from({ length: 8 }' "$FLEA_ROOT/main.js"
          ! grep -q 'emptySlots' "$FLEA_ROOT/main.js"
          grep -q 'const risk = 0.32' "$FLEA_ROOT/public/bankchase.js"

      - name: Commit v1.1.9 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            downloads/extensions/SDFleaMarket_v1.1.9_Desktop.zip \
            extensions-data.js assets/js/extensions-data.js \
            update/extensions-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: SD 플리마켓 v1.1.9'
          git push origin HEAD:fix/flea-v119-safe-storage-20260818
