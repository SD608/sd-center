name: Patch achievement completed UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-achievement-custom-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load achievement custom UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('achievements.html')
          text = path.read_text(encoding='utf-8')
          old = '<script defer src="assets/js/achievements-all.js?v=20260818-sync"></script>'
          new = old + '\n<script defer src="assets/js/achievement-custom-ui.js?v=20260818-completed1"></script>'
          if new not in text:
              if old not in text:
                  raise SystemExit('achievements-all script anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit page update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add achievements.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: 업적 달성 모아보기 UI 연결'
          git push origin HEAD:main
