name: Build SDCenter UI Preview v0.21 SD Link

on:
  push:
    branches: [feature/sdlink-integrated]
    paths:
      - 'preview/v021/**'
      - 'tools/patch-center-ui-v021-sdlink-main.js'
      - 'tools/patch-center-ui-v021-sdlink-ui.js'
      - 'tools/check-center-ui-v021-sdlink.js'
      - '.github/workflows/build-center-ui-preview-v021-sdlink.yml'
  pull_request:
    branches: [preview/center-ui-v230-20260819]
    paths:
      - 'preview/v021/**'
      - 'tools/patch-center-ui-v021-sdlink-main.js'
      - 'tools/patch-center-ui-v021-sdlink-ui.js'
      - 'tools/check-center-ui-v021-sdlink.js'
      - '.github/workflows/build-center-ui-preview-v021-sdlink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-v021:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.7.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.7/SDCenterSetup.exe' -OutFile $setup
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '9e17490d34a10f8ae076597ef2fb27451bd6c11a318776c4fd70ecde1d87fcde'){ throw "v2.2.7 hash mismatch: $hash" }
          "BASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process -FilePath $env:BASE_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $base=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.7'
          if(-not (Test-Path (Join-Path $base 'SDCenter.exe'))){ throw 'v2.2.7 install missing' }
          "BASE_APP_DIR=$base" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare portable preview v0.21
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $preview=Join-Path $env:RUNNER_TEMP 'SDCenter-UI-Preview-v0.21-SDLink'
          if(Test-Path $preview){ Remove-Item $preview -Recurse -Force }
          Copy-Item $env:BASE_APP_DIR $preview -Recurse -Force
          $root=Join-Path $preview 'resources\app'
          $assets=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04'
          $assetZip=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04.zip'
          $assetB64=(Get-Content 'tools/center-ui-preview-assets-v04-good.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes($assetZip,[Convert]::FromBase64String($assetB64))
          $assetHash=(Get-FileHash $assetZip -Algorithm SHA256).Hash.ToLower()
          if($assetHash -ne '1b250228b0112b8722eec3eb4cf89dbe138c20d5e7060e7995812e2d73db6b72'){ throw "preview asset hash mismatch: $assetHash" }
          Expand-Archive -Path $assetZip -DestinationPath $assets -Force
          Copy-Item (Join-Path $assets 'index.html') (Join-Path $root 'public\index.html') -Force
          Copy-Item (Join-Path $assets 'ui-preview.css') (Join-Path $root 'public\css\ui-preview.css') -Force
          Copy-Item (Join-Path $assets 'ui-preview.js') (Join-Path $root 'public\js\ui-preview.js') -Force
          foreach($v in @('04','05','06','07','08','09','010','011','012','013','014','015','016','017','018','019','020')){ node "tools/patch-center-ui-v$v.js" "$root" }
          node 'tools/patch-center-ui-v021-sdlink-main.js' "$root"
          node 'tools/patch-center-ui-v021-sdlink-ui.js' "$root"
          @(
            'SD종합센터 UI Remake Preview v0.21',
            'Base: official v2.2.7',
            '',
            'SD Link integrated service preview:',
            '- Center start always restores SD Link background service',
            '- legacy Link config/session/sync state migrates into durable Center user data',
            '- local account / online account binding summary persists outside app-* update folders',
            '- one integrated Link process; manager request reuses the running process',
            '- SD Link is protected from generic terminate-all/remove controls',
            '- existing SD Link wallet/economy sync engine is not rewritten',
            '',
            'Theme Store v0.20 core remains included.',
            '프리뷰이며 main 병합 및 정식 업데이트 메타데이터는 변경하지 않았습니다.'
          ) | Set-Content (Join-Path $preview 'PREVIEW_README.txt') -Encoding utf8
          "PREVIEW_DIR=$preview" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate v0.20 plus SD Link v0.21
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node "$env:APP_ROOT\tools\check-all.js"
          node "$env:APP_ROOT\tools\test-theme-catalog-v020.js"
          node "$env:APP_ROOT\tools\test-theme-assets-v020.js"
          node "$env:APP_ROOT\tools\test-theme-ui-v020.js"
          node "$env:APP_ROOT\tools\test-sdlink-integration-v021.js"
          node 'tools/check-center-ui-v021-sdlink.js' "$env:APP_ROOT"
          node --check "$env:APP_ROOT\main.js"
          node --check "$env:APP_ROOT\preload.js"
          node --check "$env:APP_ROOT\public\js\app.js"
          node --check "$env:APP_ROOT\public\js\ui-preview.js"
          node --check "$env:APP_ROOT\src\theme-catalog.js"
          node --check "$env:APP_ROOT\src\theme-assets.js"
          node --check "$env:APP_ROOT\src\sdlink-integration.js"
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "Base version changed unexpectedly: $($pkg.version)" }
          $html=Get-Content "$env:APP_ROOT\public\index.html" -Raw
          $removed=$html.IndexOf('data-preview-view="removed"')
          $themes=$html.IndexOf('data-preview-view="themes"')
          $spacer=$html.IndexOf('preview-nav-spacer')
          $zip=$html.IndexOf('id="previewAddAppNav"')
          if(-not ($removed -lt $themes -and $themes -lt $spacer -and $spacer -lt $zip)){ throw 'v0.21 sidebar order changed unexpectedly' }
          foreach($marker in @('UI Preview v0.21','previewSdLinkStatus','manifest와 SHA-256')){ if(-not $html.Contains($marker)){ throw "v0.21 html marker missing: $marker" } }
          $main=Get-Content "$env:APP_ROOT\main.js" -Raw
          foreach($marker in @('createThemeAssetService','launchIntegratedSdLinkService','center:get-sdlink-state','--sd-link-open-manager')){ if(-not $main.Contains($marker)){ throw "v0.21 main marker missing: $marker" } }

      - name: Smoke test portable preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe=Join-Path $env:PREVIEW_DIR 'SDCenter.exe'
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if($proc.HasExited){ throw "UI preview exited during smoke test: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload portable preview v0.21
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-UI-Preview-v0.21-SDLink-win-x64
          path: ${{ env.PREVIEW_DIR }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
