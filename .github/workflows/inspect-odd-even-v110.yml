name: Inspect SDOddEven v1.1.0

on:
  push:
    branches:
      - fix/odd-even-open-center
    paths:
      - '.github/workflows/inspect-odd-even-v110.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/odd-even-open-center
          fetch-depth: 0

      - name: Download and inspect SDOddEven v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/odd-even && mkdir -p /tmp/odd-even
          gh release download 'v.2.2.1' --repo 'SD608/sd-center' --pattern 'SDOddEven_v1.1.0_Desktop.zip' --dir /tmp/odd-even
          unzip -q /tmp/odd-even/SDOddEven_v1.1.0_Desktop.zip -d /tmp/odd-even/app
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/odd-even/app')
          out=[]
          for p in root.rglob('main.js'):
              text=p.read_text(encoding='utf-8', errors='replace')
              lines=text.splitlines()
              out.append(f'=== {p.relative_to(root)} ===')
              for i,line in enumerate(lines):
                  if any(n in line for n in ('open-center','openCenter','openSdCenter','isSdCenterUrl')):
                      lo=max(0,i-12); hi=min(len(lines),i+28)
                      out.append(f'-- around line {i+1} --')
                      for j in range(lo,hi): out.append(f'{j+1:04d}: {lines[j]}')
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/odd-even-v110.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/odd-even-v110.txt
          git commit -m '진단 결과 보강: 홀짝 open-center 호출부' || exit 0
          git push origin HEAD:fix/odd-even-open-center
