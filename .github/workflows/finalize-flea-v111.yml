name: Finalize Flea Market v1.1.1

on:
  push:
    branches:
      - chatgpt/flea-v110-rebuild
    paths:
      - '.github/workflows/finalize-flea-v111.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/flea-v110-rebuild
          fetch-depth: 0
      - name: Publish catalog entries and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          new_block = '''  {
            "id": "sd-flea-market",
            "name": "SD 플리마켓",
            "stage": "PC Expansion",
            "version": "v1.1.1",
            "category": "파밍·습격 확장팩",
            "icon": "assets/icons/flea-market.png?v=3",
            "fileName": "SDFleaMarket_v1.1.1_Desktop.zip",
            "downloadUrl": "downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip?v=111",
            "description": "v1.1.1에서 손상된 v1.0.9 배포본의 후속 연동 기능을 정상 코드에 재구축했습니다. 실제 물류회사 등급을 최신 기준으로 반영하고 회사 등급·온라인 물품 새로고침을 추가했으며, 기존 SD Link 5초 자동 재연결과 PC·모바일 재고 동기화를 유지합니다. 금고는 A/D 키와 마우스 직접 회전을 모두 지원합니다.",
            "requirements": "SD종합센터 v2.2.0 이상 · SD Link 로그인 · Windows 10/11",
            "updatedAt": "2026-08-17",
            "tags": ["회사 등급 직접연동", "온라인 물품 새로고침", "금고 A/D·마우스"],
            "featured": true
          }'''

          for rel in ['assets/js/extensions-data.js', 'extensions-data.js']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              pattern = re.compile(r'  \{\n    "id": "sd-flea-market",.*?\n  \}(?=\n\];)', re.S)
              text2, count = pattern.subn(new_block, text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to replace flea block in {rel}: {count}')
              p.write_text(text2, encoding='utf-8')

          p = Path('update/extensions-catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['catalogVersion'] = max(17, int(data.get('catalogVersion') or 0) + 1)
          data['updatedAt'] = '2026-08-17T03:23:00+09:00'
          flea = data['apps']['sd-flea-market']
          flea['version'] = '1.1.1'
          flea['downloadUrl'] = 'https://sd608.github.io/sd-center/downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip?v=111'
          flea['notes'] = 'v1.1.0의 구버전 베이스 문제를 바로잡은 복구판입니다. 최신 물류회사 등급 스냅샷 연동과 회사·온라인 물품 새로고침을 재구축하고, 기존 5초 SD Link 자동 재연결·PC↔모바일 재고 동기화·금고 A/D 조작을 유지하면서 마우스 다이얼 회전을 추가했습니다.'
          flea['requiredCenterVersion'] = '2.2.0'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text2, count = re.subn(r'assets/js/extensions-data\.js\?v=[^"\']+', 'assets/js/extensions-data.js?v=20260817-flea111', text, count=1)
          if count != 1:
              raise SystemExit(f'failed to bump extensions-data cache key: {count}')
          p.write_text(text2, encoding='utf-8')
          PY

          test -f downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip
          unzip -t downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip >/dev/null

          rm -f downloads/extensions/SDFleaMarket_v1.1.0_Desktop.zip
          rm -f .github/workflows/inspect-flea109-bytes.yml
          rm -f .github/workflows/inspect-flea-integration.yml
          rm -f .github/workflows/inspect-flea104-sections.yml
          rm -f .github/workflows/inspect-flea-main-state.yml
          rm -f .github/workflows/build-flea-v111.yml
          rm -f .github/workflows/finalize-flea-v111.yml
          rm -f tools/build-flea-v111.py

          python - <<'PY'
          import json
          from pathlib import Path
          for rel in ['assets/js/extensions-data.js', 'extensions-data.js']:
              t=Path(rel).read_text(encoding='utf-8')
              assert '"version": "v1.1.1"' in t
              assert 'SDFleaMarket_v1.1.1_Desktop.zip?v=111' in t
              assert 'SDFleaMarket_v1.1.0_Desktop.zip' not in t
          c=json.loads(Path('update/extensions-catalog.json').read_text(encoding='utf-8'))
          f=c['apps']['sd-flea-market']
          assert f['version']=='1.1.1'
          assert 'SDFleaMarket_v1.1.1_Desktop.zip?v=111' in f['downloadUrl']
          assert not Path('downloads/extensions/SDFleaMarket_v1.1.0_Desktop.zip').exists()
          assert Path('downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip').exists()
          assert '20260817-flea111' in Path('index.html').read_text(encoding='utf-8')
          print('FINAL CATALOG ASSERTIONS PASSED')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SD 플리마켓 v1.1.1 배포 전환 · v1.1.0 제거'
          git push origin HEAD:chatgpt/flea-v110-rebuild
