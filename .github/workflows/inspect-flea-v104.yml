name: Inspect Flea Market v1.0.4

on:
  push:
    branches:
      - chatgpt/flea-upgrade-v1010
    paths:
      - '.github/workflows/inspect-flea-v104.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v1.0.4
        shell: bash
        run: |
          set -euo pipefail
          ZIP=downloads/extensions/SDFleaMarket_v1.0.4_Desktop.zip
          unzip -t "$ZIP"
          rm -rf /tmp/flea104 && mkdir -p /tmp/flea104
          unzip -q "$ZIP" -d /tmp/flea104
          echo '=== FILES ==='
          find /tmp/flea104 -maxdepth 5 -type f -printf '%P %s bytes\n' | sort
          echo '=== JSON / METADATA ==='
          while IFS= read -r f; do echo "--- ${f#/tmp/flea104/}"; cat "$f"; echo; done < <(find /tmp/flea104 -maxdepth 5 -type f \( -name '*.json' -o -name '*.webmanifest' \) | sort)
          echo '=== APP.JS ==='
          APP=$(find /tmp/flea104 -type f -path '*/public/app.js' | head -n1)
          wc -c "$APP"
          node --check "$APP"
          grep -nE 'version|safeDial|function renderSafe|safe-control-grid|SDFleaMarket|SD 플리마켓' "$APP" | head -n 160 || true
