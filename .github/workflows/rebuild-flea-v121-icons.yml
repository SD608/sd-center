name: Rebuild Flea Market v1.2.2 Icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/flea-v120-items-sprite.webp.b64'
      - 'tools/flea-v120-items-sprite.part*.b64'
      - 'tools/flea-v120-items-manifest.txt'
      - '.github/workflows/rebuild-flea-v121-icons.yml'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == '[build] flea v1.2.2 icons'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report build start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드를 시작했습니다. Run ID: $RUN_ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reassemble item sprite
        shell: bash
        run: |
          cat \
            tools/flea-v120-items-sprite.part00.b64 \
            tools/flea-v120-items-sprite.part01.b64 \
            tools/flea-v120-items-sprite.part02.b64 \
            tools/flea-v120-items-sprite.part03a.b64 \
            tools/flea-v120-items-sprite.part03b.b64 \
            tools/flea-v120-items-sprite.part04a.b64 \
            tools/flea-v120-items-sprite.part04b.b64 \
            > tools/flea-v120-items-sprite.webp.b64
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('tools/flea-v120-items-sprite.webp.b64')
          text = ''.join(p.read_text(encoding='ascii').split())
          if len(text) != 36720:
              raise SystemExit(f'bad sprite base64 length: {len(text)}')
          raw = base64.b64decode(text, validate=True)
          if len(raw) != 27538:
              raise SystemExit(f'bad sprite byte length: {len(raw)}')
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('sprite is not a WEBP RIFF file')
          print('sprite verified:', len(text), 'base64 chars,', len(raw), 'bytes')
          PY

      - name: Build v1.2.0 with corrected mapping
        shell: bash
        run: |
          cat tools/build-flea-v120.part0.py tools/build-flea-v120.part1.py tools/build-flea-v120.part2.py > /tmp/build-flea-v120.py
          python /tmp/build-flea-v120.py

      - name: Promote corrected package to v1.2.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tempfile, zipfile

          src = Path('downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip')
          out = Path('downloads/extensions/SDFleaMarket_v1.2.2_Desktop.zip')
          sha = Path('downloads/extensions/SDFleaMarket_v1.2.2_Desktop.sha256')

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              with zipfile.ZipFile(src) as z:
                  z.extractall(root)
              pkg = root / 'sd-flea-market'
              if not pkg.is_dir():
                  raise RuntimeError('sd-flea-market package root missing')

              package_json = pkg / 'package.json'
              data = json.loads(package_json.read_text(encoding='utf-8'))
              data['version'] = '1.2.2'
              package_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              app_json = pkg / 'sd-app.json'
              data = json.loads(app_json.read_text(encoding='utf-8'))
              data['version'] = '1.2.2'
              data['displayVersion'] = 'PC Expansion · v1.2.2'
              app_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              (pkg / 'RELEASE_NOTES.txt').write_text(
                  'SD 플리마켓 v1.2.2\n\n'
                  '- 아이템 이름과 아이콘이 서로 어긋나던 매핑 오류 수정\n'
                  '- 최초 스프라이트의 정상 6x6 좌표표 복원\n'
                  '- 아이템 사전과 물건 보관함에 동일하게 적용\n'
                  '- 기존 보관함, 획득 기록, 가격 및 게임 진행도 유지\n',
                  encoding='utf-8'
              )

              if out.exists():
                  out.unlink()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for path in sorted(pkg.rglob('*')):
                      if path.is_file():
                          z.write(path, Path('sd-flea-market') / path.relative_to(pkg))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          sha.write_text(f'{digest}  {out.name}\n', encoding='utf-8')
          print(out, out.stat().st_size, digest)
          PY

      - name: Validate item artwork count
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for filename in ['SDFleaMarket_v1.2.0_Desktop.zip', 'SDFleaMarket_v1.2.2_Desktop.zip']:
              path = Path('downloads/extensions') / filename
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if n.startswith('sd-flea-market/public/assets/items/') and n.endswith('.png')]
                  if len(names) != 36:
                      raise SystemExit(f'{filename}: expected 36 item images, got {len(names)}')
                  app = z.read('sd-flea-market/public/app.js').decode('utf-8')
                  for token in ['dictionary-product-image', 'inventory-item-image', 'itemImageHtml']:
                      if token not in app:
                          raise SystemExit(f'{filename}: missing {token}')
              print(filename, 'OK')
          PY

      - name: Commit rebuilt packages
        shell: bash
        run: |
          git config user.name 'SD Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            tools/flea-v120-items-sprite.webp.b64 \
            downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip \
            downloads/extensions/SDFleaMarket_v1.2.0_Desktop.sha256 \
            downloads/extensions/SDFleaMarket_v1.2.2_Desktop.zip \
            downloads/extensions/SDFleaMarket_v1.2.2_Desktop.sha256
          if git diff --cached --quiet; then
            echo 'No package changes to commit.'
          else
            git commit -m 'Build flea market v1.2.2 icon mapping fix'
            git push
          fi

      - name: Report build success
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드가 완료되었습니다. Run ID: $RUN_ID"

      - name: Report build failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드가 실패했습니다. Run ID: $RUN_ID"
