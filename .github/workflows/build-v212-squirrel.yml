name: Build genuine SDCenter v2.1.2 Squirrel

on:
  push:
    branches:
      - build-v212-squirrel-20260814
    paths:
      - '.github/workflows/build-v212-squirrel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download official v2.1.1 Squirrel installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.1.1/SDCenterSetup.exe' -OutFile "$env:RUNNER_TEMP\SDCenterSetup-v2.1.1.exe"
          $size = (Get-Item "$env:RUNNER_TEMP\SDCenterSetup-v2.1.1.exe").Length
          if ($size -lt 100MB) { throw "Official v2.1.1 installer is unexpectedly small: $size" }

      - name: Install official v2.1.1 base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\SDCenterSetup-v2.1.1.exe"
          Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $appDir = Get-ChildItem $env:LOCALAPPDATA -Filter SDCenter.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\SDCenter\\app-2\.1\.1\\SDCenter\.exe$' } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $appDir) { throw 'Could not locate official %LOCALAPPDATA%\SDCenter\app-2.1.1 base' }
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installed official base: $appDir"

      - name: Apply direct v2.1.2 source hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hotfix = Join-Path $env:GITHUB_WORKSPACE 'build\v212-hotfix'
          $appRoot = Join-Path $env:APP_DIR 'resources\app'
          if (-not (Test-Path (Join-Path $appRoot 'package.json'))) { throw "Packaged app root not found: $appRoot" }
          $part1 = Get-Content -Raw (Join-Path $hotfix 'main.part1')
          $part2 = Get-Content -Raw (Join-Path $hotfix 'main.part2')
          $part3 = Get-Content -Raw (Join-Path $hotfix 'main.part3')
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $appRoot 'main.js'), ($part1 + $part2 + $part3), $utf8NoBom)
          Copy-Item (Join-Path $hotfix 'package.json') (Join-Path $appRoot 'package.json') -Force
          Copy-Item (Join-Path $hotfix 'forge.config.js') (Join-Path $appRoot 'forge.config.js') -Force
          Copy-Item (Join-Path $hotfix 'required-updates.js') (Join-Path $appRoot 'src\required-updates.js') -Force
          Copy-Item (Join-Path $hotfix 'app.js') (Join-Path $appRoot 'public\js\app.js') -Force
          Copy-Item (Join-Path $hotfix 'style.css') (Join-Path $appRoot 'public\css\style.css') -Force
          node --check (Join-Path $appRoot 'main.js')
          node --check (Join-Path $appRoot 'src\required-updates.js')
          node --check (Join-Path $appRoot 'public\js\app.js')
          $pkg = Get-Content (Join-Path $appRoot 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.2') { throw "Patched package version is $($pkg.version), expected 2.1.2" }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern 'sdlink-desktop' -Quiet)) { throw 'SD Link enforcement missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern '1.2.4' -Quiet)) { throw 'SD Link v1.2.4 requirement missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern '1.0.7' -Quiet)) { throw 'Logistics v1.0.7 requirement missing' }
          Write-Host 'Direct source hotfix verified.'

      - name: Rebuild genuine in-place Squirrel installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = "$env:RUNNER_TEMP\squirrel-builder"
          New-Item -ItemType Directory -Path $builder -Force | Out-Null
          Set-Location $builder
          npm init -y | Out-Null
          npm install electron-winstaller@latest --no-audit --no-fund
          @'
          const path = require('node:path');
          const { createWindowsInstaller } = require('electron-winstaller');
          const appDirectory = process.env.APP_DIR;
          const outputDirectory = path.join(process.env.RUNNER_TEMP, 'squirrel-v212');
          createWindowsInstaller({
            appDirectory,
            outputDirectory,
            name: 'SDCenter',
            productName: 'SD종합센터',
            version: '2.1.2',
            authors: 'SDWallet',
            description: '필수 확장팩 업데이트와 SD 앱을 통합 관리하는 Windows 데스크톱 센터',
            exe: 'SDCenter.exe',
            setupExe: 'SDCenterSetup.exe',
            noMsi: true,
            setupIcon: path.join(appDirectory, 'resources', 'app', 'public', 'icons', 'icon.ico')
          }).then(() => console.log('Squirrel build complete:', outputDirectory))
            .catch((error) => { console.error(error); process.exit(1); });
          '@ | Set-Content -Path build.js -Encoding utf8
          node build.js
          $setup = "$env:RUNNER_TEMP\squirrel-v212\SDCenterSetup.exe"
          if (-not (Test-Path $setup)) { throw 'SDCenterSetup.exe was not generated' }
          $size = (Get-Item $setup).Length
          if ($size -lt 100MB) { throw "Generated installer is unexpectedly small: $size" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Write-Host "Generated installer bytes: $size"
          Write-Host "Generated installer SHA256: $hash"
          "BUILT_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install-test in-place v2.1.2 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:BUILT_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $expected = Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.1.2\SDCenter.exe'
          if (-not (Test-Path $expected)) { throw "Generated installer did not update in place to $expected" }
          $pkgPath = Join-Path (Split-Path $expected -Parent) 'resources\app\package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.2') { throw "Installed package version mismatch: $($pkg.version)" }
          node --check (Join-Path (Split-Path $expected -Parent) 'resources\app\main.js')
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'sdcenter-desktop\app-2.1.2\SDCenter.exe')) { throw 'Installer incorrectly created a parallel sdcenter-desktop installation' }
          Write-Host "In-place install test passed: $expected"

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\release-v2.1.2" -Force | Out-Null
          Copy-Item $env:BUILT_SETUP "$env:GITHUB_WORKSPACE\release-v2.1.2\SDCenterSetup.exe" -Force
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\release-v2.1.2\SDCenterSetup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SDCenterSetup.exe" | Set-Content "$env:GITHUB_WORKSPACE\release-v2.1.2\SHA256.txt" -Encoding ascii

      - name: Upload genuine installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-v2.1.2-Genuine-Squirrel-InPlace
          path: release-v2.1.2/*
          if-no-files-found: error
          retention-days: 7
