name: Trigger Flea v1.2.2 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-flea-v122.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v1.2.2 build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run rebuild-flea-v122-icons.yml --repo "$REPO" --ref main
