name: Build Flea Market v1.1.1

on:
  push:
    branches:
      - chatgpt/flea-v110-rebuild
    paths:
      - '.github/workflows/build-flea-v111.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/flea-v110-rebuild
          fetch-depth: 0
      - name: Build v1.1.1
        shell: bash
        run: |
          set -euo pipefail
          SRC='downloads/extensions/SDFleaMarket_v1.0.4_Desktop.zip'
          OUT='downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip'
          python tools/build-flea-v111.py "$SRC" "$OUT"
          unzip -t "$OUT"
          rm -rf /tmp/flea111 && mkdir -p /tmp/flea111
          unzip -q "$OUT" -d /tmp/flea111

          echo '=== JavaScript syntax ==='
          node --check /tmp/flea111/main.js
          node --check /tmp/flea111/preload.js
          node --check /tmp/flea111/src/wallet-db.js
          node --check /tmp/flea111/src/sd-integration.js
          node --check /tmp/flea111/public/mission3d.js
          node --check /tmp/flea111/public/bankchase.js
          node --check /tmp/flea111/public/app.js

          echo '=== Functional assertions ==='
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/flea111')
          package = json.loads((root/'package.json').read_text(encoding='utf-8'))
          appmeta = json.loads((root/'sd-app.json').read_text(encoding='utf-8'))
          integ = (root/'src/sd-integration.js').read_text(encoding='utf-8')
          main = (root/'main.js').read_text(encoding='utf-8')
          preload = (root/'preload.js').read_text(encoding='utf-8')
          html = (root/'public/index.html').read_text(encoding='utf-8')
          js = (root/'public/app.js').read_text(encoding='utf-8')
          css = (root/'public/style.css').read_text(encoding='utf-8')
          notes = (root/'RELEASE_NOTES.txt').read_text(encoding='utf-8')

          assert package['version'] == '1.1.1'
          assert appmeta['id'] == 'sd-flea-market'
          assert appmeta['version'] == '1.1.1'
          assert appmeta['displayVersion'] == 'PC Expansion · v1.1.1'
          assert 'requiredLogisticsRank' not in appmeta
          assert 'requiredLogisticsRep' not in appmeta
          assert appmeta['requiredCenterVersion'] == '2.2.0'

          assert 'const S_RANK_REP = 2200;' in integ
          for marker in ['rep >= 2200', 'rep >= 1450', 'rep >= 900', 'rep >= 520', 'rep >= 260', 'rep >= 100']:
              assert marker in integ, marker
          assert 'get_sd_flea_company_snapshot' in integ
          assert 'sd_logistics_progress' in integ
          assert 'sync_sd_flea_pc_inventory' in integ
          assert 'snapshotResolved' in integ

          assert 'setInterval(() => void tick(), 5000)' in main
          assert 'flea:refresh-company' in main
          assert 'flea:refresh-inventory' in main
          assert 'companyRequiredRep: Number(company.requiredRep || 2200)' in main
          assert '온라인 동기화 실패' in main
          assert '모바일 판매 반영' in main

          assert 'refreshCompany' in preload
          assert 'refreshInventory' in preload
          assert 'refreshCompany' in html
          assert 'refreshInventory' in html
          assert 'onlineInventoryStatus' in html

          assert '// SD_SAFE_MOUSE_DIAL_V1' in js
          assert 'safeDialKeyDown' in js
          assert 'pointerdown' in js and 'pointermove' in js
          assert 'bindSafeDialPointerControls();' in js
          assert 'refreshCompanyNow' in js
          assert 'refreshOnlineInventoryNow' in js
          assert 'onlineInventoryStatus' in js
          assert 'SD Link 실시간 연동' in js
          assert 'SD_FLEA_V111_REFRESH_UI' in css
          assert 'repeat(4,1fr)' in css
          assert 'v1.1.1' in notes
          print('ALL V1.1.1 ASSERTIONS PASSED')
          PY

          echo '=== Package ==='
          ls -lh "$OUT"
          sha256sum "$OUT"
      - name: Commit generated ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/SDFleaMarket_v1.1.1_Desktop.zip
          git commit -m 'SD 플리마켓 v1.1.1 최신 연동 복구 · 금고 마우스 조작'
          git push origin HEAD:chatgpt/flea-v110-rebuild
