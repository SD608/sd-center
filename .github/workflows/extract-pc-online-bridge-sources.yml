name: Extract PC online bridge sources

on:
  push:
    branches:
      - feat/pc-game-online-bridge-20260818
    paths:
      - '.github/workflows/extract-pc-online-bridge-sources.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pc-game-online-bridge-20260818
          fetch-depth: 0

      - name: Extract source snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pcbridge diagnostics/pc-online-bridge-sources
          mkdir -p /tmp/pcbridge diagnostics/pc-online-bridge-sources

          extract_one() {
            local zip="$1"
            local key="$2"
            local dst="/tmp/pcbridge/$key"
            mkdir -p "$dst"
            unzip -q "$zip" -d "$dst"
            local root
            root=$(find "$dst" -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n1)
            test -n "$root"
            mkdir -p "diagnostics/pc-online-bridge-sources/$key"
            for rel in main.js preload.js package.json sd-app.json public/index.html public/js/app.js src/auth-service.js src/sync-engine.js src/wallet-database.js src/game-engine.js src/slot-engine.js src/settings.js; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "diagnostics/pc-online-bridge-sources/$key/$(dirname "$rel")"
                cp "$root/$rel" "diagnostics/pc-online-bridge-sources/$key/$rel"
              fi
            done
          }

          extract_one downloads/extensions/SDSlot_Stage7_Desktop.zip slot
          extract_one downloads/extensions/SDOddEven_v1.1.1_Desktop.zip odd-even
          extract_one downloads/extensions/SDLink_v1.3.1_Desktop.zip sdlink

          find diagnostics/pc-online-bridge-sources -type f -maxdepth 5 -print | sort

      - name: Commit snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pc-online-bridge-sources
          git diff --cached --quiet && exit 0
          git commit -m 'chore: snapshot PC game sources for online bridge'
          git push origin HEAD:feat/pc-game-online-bridge-20260818
