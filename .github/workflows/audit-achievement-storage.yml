name: Audit achievement storage

on:
  push:
    paths:
      - ".github/workflows/audit-achievement-storage.yml"
      - "tools/audit-achievement-storage.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/audit-achievement-storage.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/achievement-storage-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostics: map extension achievement storage"
          git push
