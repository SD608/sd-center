name: Miner Economy Balance v1

on:
  push:
    branches: [feat/miner-economy-balance-v1-20260825]
    paths:
      - 'database/migrations/sd_miner_economy_balance_v1.sql'
      - 'database/migrations/sd_shared_item_inventory_v1.sql'
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - 'tests/shared-item-inventory-v1/**'
      - 'tests/miner-economy-balance-v1/**'
      - '.github/workflows/miner-economy-balance-v1.yml'
  pull_request:
    paths:
      - 'database/migrations/sd_miner_economy_balance_v1.sql'
      - 'database/migrations/sd_shared_item_inventory_v1.sql'
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - 'tests/shared-item-inventory-v1/**'
      - 'tests/miner-economy-balance-v1/**'
      - '.github/workflows/miner-economy-balance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miner-economy-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miner_economy_balance_v1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d miner_economy_balance_v1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: miner_economy_balance_v1_test
    steps:
      - uses: actions/checkout@v4
      - name: Build production-shaped auth/device/achievement fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/fixture.sql
      - name: Apply trusted Core wallet delta helper
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_core_server_wallet_delta_v1.sql
      - name: Apply miner authority baseline
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql
      - name: Apply Chapter 4-2 server-timed miner loop
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_work_loop_v3.sql
      - name: Apply Chapter 4-3 shared item authority
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_shared_item_inventory_v1.sql
      - name: Prove inherited Chapter 4-2 and 4-3 regression
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/shared-item-inventory-v1/regression.sql
      - name: Seed two already-accepted current-day claims before economy cutover
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.sd_miner_jobs(
            job_id,user_id,start_request_id,mine_key,status,cycle_ms,
            started_at,ready_at,claimed_at,claim_request_id,result_ore_key,result_quantity
          ) values
          (
            '61000000-0000-4000-8000-000000000001',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '62000000-0000-4000-8000-000000000001','surface','claimed',5000,
            now()-interval '20 seconds',now()-interval '15 seconds',now()-interval '10 seconds',
            '63000000-0000-4000-8000-000000000001','stone',1
          ),
          (
            '61000000-0000-4000-8000-000000000002',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '62000000-0000-4000-8000-000000000002','surface','claimed',5000,
            now()-interval '20 seconds',now()-interval '15 seconds',now()-interval '9 seconds',
            '63000000-0000-4000-8000-000000000002','stone',1
          );
          SQL
      - name: Apply Chapter 4-4 final miner economy
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_economy_balance_v1.sql
      - name: Verify final constants and preserved assets
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/constants.sql
      - name: Verify daily quota exact-once and rollover
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/quota.sql
      - name: Verify final sale prices and Core exact-once payouts
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/sales.sql
