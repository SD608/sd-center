name: Reconstruct v0.23 From Verified v0.8 Artifact

on:
  push:
    branches: [release/v024-final-gate-20260820]
    paths:
      - '.github/workflows/reconstruct-v023-from-v08.yml'
      - 'tools/patch-center-ui-v09.js'
      - 'tools/patch-center-ui-v010.js'
      - 'tools/patch-center-ui-v011.js'
      - 'tools/patch-center-ui-v012.js'
      - 'tools/patch-center-ui-v013.js'
      - 'tools/patch-center-ui-v014.js'
      - 'tools/patch-center-ui-v015.js'
      - 'tools/patch-center-ui-v016.js'
      - 'tools/patch-center-ui-v017.js'
      - 'tools/patch-center-ui-v018.js'
      - 'tools/patch-center-ui-v019.js'
      - 'tools/patch-center-ui-v020.js'
      - 'tools/apply-center-ui-v021-sdlink.js'
      - 'tools/patch-center-ui-v022-sdlink-hardening.js'
      - 'tools/patch-center-ui-v023-sdlink-session.js'
      - 'tools/patch-center-ui-v024-core.js'
  pull_request:
    branches: [release/sd-center-core-v1]
    paths:
      - '.github/workflows/reconstruct-v023-from-v08.yml'
      - 'tools/patch-center-ui-v09.js'
      - 'tools/patch-center-ui-v010.js'
      - 'tools/patch-center-ui-v011.js'
      - 'tools/patch-center-ui-v012.js'
      - 'tools/patch-center-ui-v013.js'
      - 'tools/patch-center-ui-v014.js'
      - 'tools/patch-center-ui-v015.js'
      - 'tools/patch-center-ui-v016.js'
      - 'tools/patch-center-ui-v017.js'
      - 'tools/patch-center-ui-v018.js'
      - 'tools/patch-center-ui-v019.js'
      - 'tools/patch-center-ui-v020.js'
      - 'tools/apply-center-ui-v021-sdlink.js'
      - 'tools/patch-center-ui-v022-sdlink-hardening.js'
      - 'tools/patch-center-ui-v023-sdlink-session.js'
      - 'tools/patch-center-ui-v024-core.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconstruct-and-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BASE_ARTIFACT_ID: '9369432878'
      BASE_ARTIFACT_SHA256: 'c1cc3ed5e6a45d2fd777c9f98dd9fa05ed43ca8d1e5190ae4486429ca2c812ed'
      BASE_BUILD_COMMIT: '951031fabe8c3a24e75858b4e3d618a499ae7162'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact preserved v0.8 artifact archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'v08-artifact.zip'
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$env:BASE_ARTIFACT_ID/zip" -OutFile $archive
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if($hash -ne $env:BASE_ARTIFACT_SHA256){ throw "v0.8 artifact archive SHA mismatch: $hash" }
          $baseline=Join-Path $env:RUNNER_TEMP 'SDCenter-v08-baseline'
          Expand-Archive -Path $archive -DestinationPath $baseline -Force
          if(-not (Test-Path (Join-Path $baseline 'SDCenter.exe'))){ throw 'v0.8 baseline SDCenter.exe missing' }
          $buildInfo=Get-Content (Join-Path $baseline 'BUILD_INFO.txt') -Raw
          if(-not $buildInfo.Contains("Commit: $env:BASE_BUILD_COMMIT")){ throw 'v0.8 BUILD_INFO commit mismatch' }
          $root=Join-Path $baseline 'resources\app'
          $preview=Get-Content (Join-Path $root 'UI_PREVIEW.txt') -Raw
          if(-not $preview.Contains('UI Remake v0.8')){ throw 'v0.8 preview marker mismatch' }
          $pkg=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "v0.8 base package version mismatch: $($pkg.version)" }
          "BASELINE_DIR=$baseline" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reconstruct v0.23 only from v0.8 forward
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v023=Join-Path $env:RUNNER_TEMP 'SDCenter-Reconstructed-v0.23'
          Copy-Item $env:BASELINE_DIR $v023 -Recurse -Force
          $root=Join-Path $v023 'resources\app'
          $patches=@('09','010','011','012','013','014','015','016','017','018','019','020')
          foreach($v in $patches){
            $script="tools/patch-center-ui-v$v.js"
            if(-not (Test-Path $script)){ throw "required reconstruction patch missing: $script" }
            node $script $root
            if($LASTEXITCODE -ne 0){ throw "reconstruction patch failed: $script" }
          }
          node 'tools/apply-center-ui-v021-sdlink.js' $root
          if($LASTEXITCODE -ne 0){ throw 'v0.21 apply failed' }
          node 'tools/patch-center-ui-v022-sdlink-hardening.js' $root
          if($LASTEXITCODE -ne 0){ throw 'v0.22 apply failed' }
          node 'tools/patch-center-ui-v023-sdlink-session.js' $root
          if($LASTEXITCODE -ne 0){ throw 'v0.23 apply failed' }
          "V023_DIR=$v023" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "V023_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate reconstructed v0.23 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node "$env:V023_ROOT\tools\check-all.js"
          node "$env:V023_ROOT\tools\test-theme-catalog-v020.js"
          node "$env:V023_ROOT\tools\test-theme-assets-v020.js"
          node "$env:V023_ROOT\tools\test-theme-ui-v020.js"
          node "$env:V023_ROOT\tools\test-sdlink-integration-v021.js"
          node "$env:V023_ROOT\tools\test-sdlink-hardening-v022.js"
          node "$env:V023_ROOT\tools\test-sdlink-session-persistence-v023.js"
          foreach($file in @(
            "$env:V023_ROOT\main.js",
            "$env:V023_ROOT\preload.js",
            "$env:V023_ROOT\public\js\app.js",
            "$env:V023_ROOT\public\js\ui-preview.js",
            "$env:V023_ROOT\src\sdlink-integration.js",
            "$env:V023_ROOT\src\sdlink-session-persistence.js",
            "$env:V023_ROOT\src\theme-catalog.js",
            "$env:V023_ROOT\src\theme-assets.js"
          )){ node --check $file }
          $pkg=Get-Content "$env:V023_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "reconstructed v0.23 changed official package version: $($pkg.version)" }

      - name: Create v0.23 reconstruction file inventory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inventory=Join-Path $env:RUNNER_TEMP 'v023-file-sha256.txt'
          Get-ChildItem $env:V023_ROOT -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($env:V023_ROOT.Length).TrimStart('\') -replace '\\','/'
            $sha=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sha  $rel"
          } | Sort-Object | Set-Content $inventory -Encoding utf8
          Get-FileHash $inventory -Algorithm SHA256 | Format-List
          Copy-Item $inventory (Join-Path $env:V023_DIR 'V023_RECONSTRUCTION_SHA256.txt') -Force

      - name: Build v0.24 candidate from reconstructed v0.23
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:RUNNER_TEMP 'SDCenter-v0.24-ReconstructedBaseline-Candidate'
          Copy-Item $env:V023_DIR $candidate -Recurse -Force
          $root=Join-Path $candidate 'resources\app'
          node 'tools/patch-center-ui-v024-core.js' $root
          if($LASTEXITCODE -ne 0){ throw 'v0.24 Core overlay failed' }
          "CANDIDATE_DIR=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full v0.24 regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node "$env:APP_ROOT\tools\check-all.js"
          node "$env:APP_ROOT\tools\test-theme-catalog-v020.js"
          node "$env:APP_ROOT\tools\test-theme-assets-v020.js"
          node "$env:APP_ROOT\tools\test-theme-ui-v020.js"
          node "$env:APP_ROOT\tools\test-sdlink-integration-v021.js"
          node "$env:APP_ROOT\tools\test-sdlink-hardening-v022.js"
          node "$env:APP_ROOT\tools\test-sdlink-session-persistence-v023.js"
          node "$env:APP_ROOT\tools\test-sdlink-core-runtime-v024.js"
          node "$env:APP_ROOT\tools\test-core-public-errors-v024.js"
          foreach($file in @(
            "$env:APP_ROOT\main.js",
            "$env:APP_ROOT\preload.js",
            "$env:APP_ROOT\public\js\app.js",
            "$env:APP_ROOT\public\js\ui-preview.js",
            "$env:APP_ROOT\src\sdlink-integration.js",
            "$env:APP_ROOT\src\sdlink-session-persistence.js",
            "$env:APP_ROOT\src\sdlink-core-runtime.js",
            "$env:APP_ROOT\src\theme-catalog.js",
            "$env:APP_ROOT\src\theme-assets.js"
          )){ node --check $file }
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "candidate changed official package version early: $($pkg.version)" }

      - name: Portable Windows process smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe=Join-Path $env:CANDIDATE_DIR 'SDCenter.exe'
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if($proc.HasExited){ throw "candidate exited during process smoke: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload diagnostic reconstruction outputs
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-v0.24-ReconstructedBaseline-Diagnostic
          path: |
            ${{ env.V023_DIR }}/V023_RECONSTRUCTION_SHA256.txt
            ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
