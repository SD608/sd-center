name: Inspect extension package metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-extension-metadata.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect extension ZIP metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sd-ext-inspect
          mkdir -p /tmp/sd-ext-inspect
          for zip in downloads/extensions/*.zip; do
            name=$(basename "$zip")
            dir="/tmp/sd-ext-inspect/${name%.zip}"
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
            echo "===== $name ====="
            found=0
            while IFS= read -r f; do
              found=1
              echo "--- ${f#$dir/} ---"
              python - "$f" <<'PY'
import json,sys
p=sys.argv[1]
try:
  d=json.load(open(p,encoding='utf-8'))
except Exception as e:
  print('JSON_ERROR',e); raise SystemExit
keys=['id','name','productName','version','stage','userDataFolder','entry','main']
print({k:d.get(k) for k in keys if k in d})
PY
            done < <(find "$dir" -type f \( -name sd-app.json -o -name package.json \) | sort)
            if [ "$found" -eq 0 ]; then echo "NO METADATA"; fi
          done
