name: Restore Authority Migration Sources

on:
  workflow_dispatch:
  push:
    branches: [release/v024-final-gate-20260820]
    paths:
      - '.github/workflows/restore-authority-migration-sources.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v024-final-gate-20260820
          fetch-depth: 0
      - name: Fetch validated DEV migration sources
        run: curl -fsSL --retry 3 'https://rwjueffaziiawdebbwpf.supabase.co/functions/v1/ai-release-source-export-20260820' -o /tmp/authority-sources.json
      - name: Restore exact SQL bytes and verify SHA-256
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          expected = {
            '20260820102125': ('sd_flea_pc_authority_v2_05_bank', 'c0dff5db80101899807295dfb33859fec1cdb50a2853aed8d63cac7638cbb96d'),
            '20260820102145': ('sd_flea_pc_authority_v2_06_sale_achievements', 'ecb9432e4e67ccaa2e3e04610429d3f666a1709ed3f67543d68b6211aae87b68'),
            '20260820102534': ('sd_flea_pc_authority_v2_07_prep_secret_hardening', '5a5467e29ebd3ca1eae04b6e1abba5bcb2a457950475d9c51bb1122f669fd2a1'),
            '20260820103821': ('sd_flea_pc_authority_v2_08_escape_hardening', '37978dba4492d8e044c003af7b1dad21f7bfba93bad2a8c4a86b560a255c7aeb'),
            '20260820104805': ('sd_bitcoin_authority_v2_01_schema', 'c1e57ce96d5697b759f2b494969e66f7c299dc752cfa93782e8e925f25b8118d'),
            '20260820104906': ('sd_bitcoin_authority_v2_02_api', 'f5bfdad85ddcdce703fc2524f77aefaf9b3195dd02fbf152ed24ba4eb04eee19'),
            '20260820104928': ('sd_bitcoin_authority_v2_03_compat', '470b2ddd757e4f125800e28cce4094c09c09e2eedfde85d29c3db6bedc43d777'),
            '20260820105343': ('sd_miner_authority_v2_01_schema', '96a1f95d2ada94bda03c71fbbea5b8f668a88ec604551b3a740ce2fea51d7b67'),
            '20260820105412': ('sd_miner_authority_v2_02_api', 'd83c62c16ad13db712df7c6155ae40436b837d73305d02c495f5c5dd637dddba'),
            '20260820105625': ('sd_mukjjippa_authority_v2', 'e28f182847b20a60fdb852d0a69d61d615fba5a6fdf12d6351c9587e7ebedf0a'),
            '20260820112733': ('sd_sta_authority_v2_03_server_transport_hardening', 'd5eceec69bbd9cff61fe84aa2ed927d44a34df11138871979376ff5d554a3cb3'),
            '20260820122325': ('sd_sta_authority_v2_04_attainability', '82aae7c2e8c030d5a5866547b2b8298306d9e5e125a73c7826672880333e8e5e'),
            '20260820122335': ('sd_release_flea_rls_parity_hardening', 'ea51ae602b3957d72315d49f3de3a6934b9f014fe76a0200abc177e14aeb235d'),
          }
          rows = json.loads(Path('/tmp/authority-sources.json').read_text(encoding='utf-8'))
          by_version = {str(r['version']): r for r in rows}
          out = Path('sql/release-gate')
          out.mkdir(parents=True, exist_ok=True)
          manifest = []
          for version, (name, digest) in expected.items():
              row = by_version.get(version)
              if not row or row.get('name') != name:
                  raise SystemExit(f'missing/mismatched export row: {version} {name}')
              data = row['sql_text'].encode('utf-8')
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f'SHA mismatch before write: {version}: {actual} != {digest}')
              path = out / f'{version}_{name}.sql'
              path.write_bytes(data)
              written = hashlib.sha256(path.read_bytes()).hexdigest()
              if written != digest:
                  raise SystemExit(f'SHA mismatch after write: {path}: {written} != {digest}')
              manifest.append(f'{digest}  {path.as_posix()}')
          Path('sql/release-gate/AUTHORITY_SOURCE_SHA256.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(f'restored {len(expected)} exact migration sources')
      - name: Commit restored sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql/release-gate
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore validated authority migration sources'
          git push origin HEAD:release/v024-final-gate-20260820
