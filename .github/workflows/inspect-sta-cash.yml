name: Inspect STA cash bug

on:
  push:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack STA
        run: |
          rm -rf /tmp/sta
          mkdir -p /tmp/sta
          unzip -q downloads/extensions/STA_Version6_Desktop.zip -d /tmp/sta
          find /tmp/sta -maxdepth 3 -type f -printf '%p\n'
      - name: Print cash-stage context
        shell: python
        run: |
          from pathlib import Path
          root = Path('/tmp/sta')
          keys = ['현금','cash','money','rapid','연타','final','finalize','next','stage','phase','complete','finish','click']
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.html','.json','.md'}:
                  continue
              try:
                  lines = p.read_text(encoding='utf-8').splitlines()
              except Exception:
                  continue
              hits=[]
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(k.lower() in low for k in keys):
                      hits.append(i)
              if not hits:
                  continue
              print(f'\n===== {p} =====')
              shown=[]
              for i in hits:
                  a=max(0,i-8); b=min(len(lines),i+13)
                  if shown and a <= shown[-1][1]:
                      shown[-1]=(shown[-1][0],max(shown[-1][1],b))
                  else:
                      shown.append((a,b))
              for a,b in shown[:18]:
                  print(f'--- lines {a+1}-{b} ---')
                  for n in range(a,b):
                      print(f'{n+1:05d}: {lines[n]}')
