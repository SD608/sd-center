name: Homepage V2 copy editor check temp
on:
  push:
    branches:
      - feat/homepage-v2-live-editor-preview-20260912
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check dev/homepage-v2-live-editor-preview/all-copy-editor.js
      - name: Preview wiring and safety assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('dev/homepage-v2-live-editor-preview/index.html').read_text(encoding='utf-8')
          script = Path('dev/homepage-v2-live-editor-preview/all-copy-editor.js').read_text(encoding='utf-8')
          assert index.count('<script src="./all-copy-editor.js"></script>') == 1
          assert 'sd-homepage-v2-live-editor-preview-v1' in index
          assert 'sd-homepage-v2-live-editor-preview-copy-v1' in script
          for token in ['.site-header','[data-section=hero]','[data-section=account]','[data-section=apps]','[data-section=extensions]','[data-section=download]','[data-section=mobile]','.site-footer']:
              assert token in script, token
          for token in ['saveButton','resetButton','localStorage','createTreeWalker']:
              assert token in script, token
          assert 'supabase' not in script.lower()
          assert 'service_role' not in script.lower()
          print('V2 full copy editor static checks: PASS')
          PY
