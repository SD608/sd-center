name: Build and publish SDCenter v2.2.6 Stack Overflow Hotfix

on:
  push:
    branches: [fix/center-update-stack-overflow]
    paths:
      - '.github/workflows/build-v226-stack-overflow.yml'
      - 'tools/patch-v226-stack-overflow.js'
      - 'tools/build-v226-installer.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-update-stack-overflow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified v2.2.5 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.5.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.5/SDCenterSetup.exe' -OutFile $setup
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if($hash -ne 'dfc817f595e8dc0ed523bcf3c9018131aed9cddf24d6f463e3895e6cc9a86c1c'){ throw "v2.2.5 hash mismatch: $hash" }
          "BASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install v2.2.5 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process -FilePath $env:BASE_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $appDir=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.5'
          if(-not (Test-Path (Join-Path $appDir 'SDCenter.exe'))){ throw 'v2.2.5 install missing' }
          "APP_DIR=$appDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$appDir\resources\app" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch SDCenter v2.2.6 stack overflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/patch-v226-stack-overflow.js "$env:APP_ROOT"

      - name: Validate patched source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check "$env:APP_ROOT\main.js"
          node --check "$env:APP_ROOT\preload.js"
          node --check "$env:APP_ROOT\public\js\app.js"
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.6'){ throw "Center version mismatch: $($pkg.version)" }
          $main=Get-Content "$env:APP_ROOT\main.js" -Raw
          $start=$main.IndexOf('async function installInspectedZipWithRetry(inspected, destinationDirectory)')
          $end=$main.IndexOf('async function terminateAppAndWait(id)', $start)
          if($start -lt 0 -or $end -le $start){ throw 'retry helper not found' }
          $helper=$main.Substring($start, $end-$start)
          if($helper.Contains('await installInspectedZipWithRetry(inspected, destinationDirectory);')){ throw 'recursive retry call remains' }
          if(-not $helper.Contains('installInspectedZip(inspected, destinationDirectory);')){ throw 'original install call missing' }
          foreach($m in @('forceKillChildTree','taskkill.exe','installInspectedZipWithRetry','retryableCodes','--sd-link-auto-start','autoUpdater','quitAndInstall')) {
            if(-not $main.Contains($m)){ throw "v2.2.6 marker missing: $m" }
          }
          foreach($bad in @('powershell.exe','powershellScript','ShowWindowAsync')) {
            if($main.Contains($bad)){ throw "forbidden marker remains: $bad" }
          }

      - name: Install Squirrel builder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $builder=Join-Path $env:RUNNER_TEMP 'squirrel-builder-v226'
          New-Item -ItemType Directory -Force -Path $builder | Out-Null
          Push-Location $builder
          npm init -y | Out-Null
          npm install electron-winstaller@latest --no-audit --no-fund
          Pop-Location
          "NODE_PATH=$builder\node_modules" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $output=Join-Path $env:RUNNER_TEMP 'squirrel-v226'
          "BUILD_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build SDCenter v2.2.6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/build-v226-installer.js
          $setup=Join-Path $env:BUILD_OUTPUT 'SDCenterSetup.exe'
          $releases=Join-Path $env:BUILD_OUTPUT 'RELEASES'
          $nupkg=Get-ChildItem $env:BUILD_OUTPUT -Filter '*-full.nupkg' | Select-Object -First 1
          if(-not (Test-Path $setup)){ throw 'v2.2.6 installer missing' }
          if(-not (Test-Path $releases)){ throw 'Squirrel RELEASES missing' }
          if(-not $nupkg){ throw 'Squirrel full nupkg missing' }
          $size=(Get-Item $setup).Length
          if($size -lt 100MB){ throw "Installer too small: $size" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "BUILT_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_RELEASES=$releases" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_NUPKG=$($nupkg.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_NUPKG_NAME=$($nupkg.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and smoke test v2.2.6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:BUILT_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $dir=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.6'
          $exe=Join-Path $dir 'SDCenter.exe'
          if(-not (Test-Path $exe)){ throw 'v2.2.6 in-place install failed' }
          $pkg=Get-Content (Join-Path $dir 'resources\app\package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.6'){ throw 'Installed Center version mismatch' }
          $installedMain=Get-Content (Join-Path $dir 'resources\app\main.js') -Raw
          $start=$installedMain.IndexOf('async function installInspectedZipWithRetry(inspected, destinationDirectory)')
          $end=$installedMain.IndexOf('async function terminateAppAndWait(id)', $start)
          $helper=$installedMain.Substring($start, $end-$start)
          if($helper.Contains('await installInspectedZipWithRetry(inspected, destinationDirectory);')){ throw 'Installed v2.2.6 still recursive' }
          if(-not $helper.Contains('installInspectedZip(inspected, destinationDirectory);')){ throw 'Installed original installer call missing' }
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if($proc.HasExited){ throw "Center exited during smoke test: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Prepare release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:GITHUB_WORKSPACE 'release-v2.2.6'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $env:BUILT_SETUP (Join-Path $dir 'SDCenterSetup.exe') -Force
          Copy-Item $env:BUILT_RELEASES (Join-Path $dir 'RELEASES') -Force
          Copy-Item $env:BUILT_NUPKG (Join-Path $dir $env:BUILT_NUPKG_NAME) -Force
          gh release download 'v.2.2.5' --repo 'SD608/sd-center' --pattern 'SDCenter-Mobile.apk' --dir $dir
          gh release download 'v.2.2.5' --repo 'SD608/sd-center' --pattern 'SDLink_v1.2.8_Desktop.zip' --dir $dir
          "$env:BUILT_HASH  SDCenterSetup.exe" | Set-Content (Join-Path $dir 'SHA256.txt') -Encoding ascii
          @(
            'SD종합센터 v2.2.6',
            '- v2.2.5 확장팩 설치/업데이트의 Maximum call stack size exceeded 수정',
            '- 설치 재시도 함수의 자기 재귀 호출 제거',
            '- EBUSY/EPERM/EACCES 잠금 재시도 유지',
            '- taskkill 기반 실행 프로세스 종료 유지',
            '- 기존 앱 저장 데이터 유지',
            "Installer bytes: $env:BUILT_SIZE",
            "SHA256: $env:BUILT_HASH"
          ) | Set-Content (Join-Path $dir 'BUILD_INFO.txt') -Encoding utf8
          "RELEASE_DIR=$dir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish v2.2.6 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create 'v.2.2.6' `
            "$env:RELEASE_DIR/SDCenterSetup.exe" `
            "$env:RELEASE_DIR/SDCenter-Mobile.apk" `
            "$env:RELEASE_DIR/RELEASES" `
            "$env:RELEASE_DIR/$env:BUILT_NUPKG_NAME" `
            "$env:RELEASE_DIR/SDLink_v1.2.8_Desktop.zip" `
            "$env:RELEASE_DIR/SHA256.txt" `
            "$env:RELEASE_DIR/BUILD_INFO.txt" `
            --repo 'SD608/sd-center' `
            --target 'fix/center-update-stack-overflow' `
            --title 'SD종합센터 v2.2.6' `
            --notes 'v2.2.5에서 확장팩 설치 또는 업데이트 시 Maximum call stack size exceeded가 발생하던 재귀 호출 오류를 수정했습니다. 파일 잠금 재시도 기능은 그대로 유지됩니다.'

      - name: Update website and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path('.')
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          manifest = {
              'version': '2.2.6',
              'downloadUrl': 'https://github.com/SD608/sd-center/releases/download/v.2.2.6/SDCenterSetup.exe',
              'sha256': os.environ['BUILT_HASH'],
              'notes': '확장팩 설치/업데이트의 재귀 호출 오류를 수정했습니다. 파일 잠금 재시도 기능은 유지됩니다.',
              'publishedAt': now,
              'squirrelFeedUrl': 'https://github.com/SD608/sd-center/releases/latest/download'
          }
          (root / 'update/center-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          site = root / 'site-config.js'
          text = site.read_text(encoding='utf-8')
          text = text.replace('v2.2.5 App Update Lock Fix', 'v2.2.6 Stack Overflow Hotfix')
          text = text.replace('version: "2.2.5"', 'version: "2.2.6"')
          text = text.replace('releases/download/v.2.2.5/SDCenterSetup.exe', 'releases/download/v.2.2.6/SDCenterSetup.exe')
          text = text.replace('releases/tag/v.2.2.5', 'releases/tag/v.2.2.6')
          site.write_text(text, encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\update-v226-site.py" -Encoding utf8
          python "$env:RUNNER_TEMP\update-v226-site.py"

      - name: Validate published metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content 'update/center-update.json' -Raw | ConvertFrom-Json
          if($manifest.version -ne '2.2.6'){ throw 'center update metadata version mismatch' }
          if($manifest.sha256 -ne $env:BUILT_HASH){ throw 'center update metadata hash mismatch' }
          $site=Get-Content 'site-config.js' -Raw
          if(-not $site.Contains('version: "2.2.6"')){ throw 'site config v2.2.6 missing' }
          $catalog=Get-Content 'update/extensions-catalog.json' -Raw | ConvertFrom-Json
          if($catalog.apps.'odd-even'.version -ne '1.1.1'){ throw 'SD홀짝 catalog v1.1.1 missing' }
          if($catalog.apps.'sdlink-desktop'.version -ne '1.2.8'){ throw 'SD Link catalog v1.2.8 missing' }

      - name: Commit v2.2.6 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/center-update.json site-config.js
          if(git diff --cached --quiet){ exit 0 }
          git commit -m '센터 v2.2.6 재귀 설치 오류 수정 배포 반영'
          git push origin HEAD:fix/center-update-stack-overflow
