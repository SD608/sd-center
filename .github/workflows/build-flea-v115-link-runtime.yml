name: Build SD Flea v1.1.5 link runtime fix

on:
  push:
    paths:
      - ".github/workflows/build-flea-v115-link-runtime.yml"
      - "tools/patch-flea-v115-link-runtime.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched flea package
        run: python tools/patch-flea-v115-link-runtime.py

      - name: Verify package
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('downloads/extensions/SDFleaMarket_v1.1.5_Desktop.zip')
          assert p.is_file() and p.stat().st_size > 100000, p.stat().st_size if p.exists() else 'missing'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              pkg_name=next(n for n in names if n.endswith('package.json') and 'node_modules/' not in n)
              root=pkg_name[:-len('package.json')]
              pkg=json.loads(z.read(pkg_name))
              assert pkg['version']=='1.1.5'
              integration=z.read(root+'src/sd-integration.js').decode('utf-8')
              renderer=z.read(root+'public/app.js').decode('utf-8')
              mission=z.read(root+'public/mission3d.js').decode('utf-8')
              assert 'FLEA_SDLINK_SHARED_STATE_V115' in integration
              assert 'readSdLinkIntegrationState' in integration
              assert 'FLEA_LIMITED_ITEM_SCOPE_FIX_V115' in renderer
              assert 'function isLimitedItem(item)' in renderer
              assert 'FLEA_MISSION3D_BLACKSCREEN_V114' in mission
          catalog=json.load(open('update/extensions-catalog.json',encoding='utf-8'))
          assert catalog['apps']['sd-flea-market']['version']=='1.1.5'
          print('verification OK',p.stat().st_size)
          PY

      - name: Commit build and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            downloads/extensions/SDFleaMarket_v1.1.5_Desktop.zip \
            update/extensions-catalog.json \
            extensions-data.js \
            assets/js/extensions-data.js
          if git diff --cached --quiet; then
            echo "No build changes"
            exit 0
          fi
          git commit -m "build: publish SD flea v1.1.5 link runtime fix"
          git push
