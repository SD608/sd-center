name: Rebuild Flea Market v1.2.2 Icon Mapping

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == '[build] flea v1.2.2 icons'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드를 시작했습니다. Run ID: $RUN_ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build corrected v1.2.0 base
        run: |
          cat tools/build-flea-v120.part0.py tools/build-flea-v120.part1.py tools/build-flea-v120.part2.py > /tmp/build-flea-v120.py
          python /tmp/build-flea-v120.py

      - name: Promote to v1.2.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tempfile, zipfile

          src = Path('downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip')
          out = Path('downloads/extensions/SDFleaMarket_v1.2.2_Desktop.zip')
          sha = Path('downloads/extensions/SDFleaMarket_v1.2.2_Desktop.sha256')

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              with zipfile.ZipFile(src) as z:
                  z.extractall(root)
              pkg = root / 'sd-flea-market'
              if not pkg.is_dir():
                  raise RuntimeError('sd-flea-market package root missing')

              package_json = pkg / 'package.json'
              data = json.loads(package_json.read_text(encoding='utf-8'))
              data['version'] = '1.2.2'
              package_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              app_json = pkg / 'sd-app.json'
              data = json.loads(app_json.read_text(encoding='utf-8'))
              data['version'] = '1.2.2'
              data['displayVersion'] = 'PC Expansion · v1.2.2'
              app_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              (pkg / 'RELEASE_NOTES.txt').write_text(
                  'SD 플리마켓 v1.2.2\n\n'
                  '- 아이템 이름과 아이콘이 서로 어긋나던 매핑 오류 수정\n'
                  '- 최초 스프라이트 제작 시의 정상 6x6 좌표표 복원\n'
                  '- 아이템 사전과 물건 보관함에 동일한 수정 적용\n'
                  '- 기존 보관함, 획득 기록, 가격, 진행도 유지\n',
                  encoding='utf-8'
              )

              if out.exists():
                  out.unlink()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for path in sorted(pkg.rglob('*')):
                      if path.is_file():
                          z.write(path, Path('sd-flea-market') / path.relative_to(pkg))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          sha.write_text(f'{digest}  {out.name}\n', encoding='utf-8')
          print(out, out.stat().st_size, digest)
          PY

      - name: Validate 36 mapped assets
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path('downloads/extensions/SDFleaMarket_v1.2.2_Desktop.zip')
          expected = {
            'ballpoint-pen.png','paper-clips.png','eraser.png','ruler-15cm.png','small-notebook.png','keychain.png','mug.png','usb-cable.png',
            'wired-earphones.png','phone-charger.png','mini-fan.png','usb-drive.png','wireless-mouse.png','power-bank.png','budget-headset.png','gamepad.png',
            'mechanical-keyboard.png','brand-sneakers.png','bluetooth-speaker.png','wireless-earbuds.png','smartwatch.png','portable-game-console.png','premium-headphones.png','premium-tablet.png',
            'mirrorless-camera.png','flagship-smartphone.png','graphics-card.png','gold-ring.png','rare-coin.png','gold-necklace.png','gold-coins.png','luxury-watch.png','gemstone.png','small-gold-bar.png','large-gold-bar.png','red-diamond.png'
          }
          with zipfile.ZipFile(path) as z:
              prefix='sd-flea-market/public/assets/items/'
              actual={n[len(prefix):] for n in z.namelist() if n.startswith(prefix) and n.endswith('.png')}
              if actual != expected:
                  raise SystemExit(f'asset mismatch: missing={expected-actual}, extra={actual-expected}')
              app=z.read('sd-flea-market/public/app.js').decode('utf-8')
              for token in ['dictionary-product-image','inventory-item-image','itemImageHtml']:
                  if token not in app:
                      raise SystemExit(f'missing {token}')
          print('v1.2.2 asset validation OK')
          PY

      - name: Commit package
        run: |
          git config user.name 'SD Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add downloads/extensions/SDFleaMarket_v1.2.2_Desktop.zip downloads/extensions/SDFleaMarket_v1.2.2_Desktop.sha256
          if git diff --cached --quiet; then
            echo 'No package changes to commit.'
          else
            git commit -m 'Build flea market v1.2.2 icon mapping fix'
            git push origin main
          fi

      - name: Report success
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드가 완료되었습니다. Run ID: $RUN_ID"

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "플리마켓 v1.2.2 아이콘 매핑 수정 빌드가 실패했습니다. Run ID: $RUN_ID"
