name: Fix migrated extension packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-migrated-extension-packages.yml'
      - 'tools/fix-migrated-extension-packages.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate extension hotfixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/fix-migrated-extension-packages.py
      - name: Commit repaired packages and catalog
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip `
                  downloads/extensions/SDVault_v1.2.1_Desktop.zip `
                  downloads/extensions/SDMiner_v1.1.1_Desktop.zip `
                  update/extensions-catalog.json `
                  diagnostics/migration-hotfix-build.json
          if(git diff --cached --quiet){ exit 0 }
          git commit -m 'fix: repair migrated extension packages'
          git push origin HEAD:main
