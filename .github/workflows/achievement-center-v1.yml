name: SD Achievement Center v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/migrations/sd_achievement_center_read_v1.sql'
      - 'assets/js/achievement-sync.js'
      - 'assets/js/achievements-all.js'
      - 'assets/js/achievement-custom-ui.js'
      - 'tests/achievement-center/**'
      - '.github/workflows/achievement-center-v1.yml'

permissions:
  contents: read

jobs:
  achievement-center-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: achievement_center_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d achievement_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: achievement_center_test
    steps:
      - uses: actions/checkout@v4
      - name: Build stacked Chapter 3 foundation
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/achievement-lineage/fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_identity_lineage_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/achievement-migration/fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_migration_classification_v1.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_migration_classification_v1_rls.sql
          psql -v ON_ERROR_STOP=1 -f tests/achievement-core-event/fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_core_event_registry_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/achievement-content-move/fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_content_move_backfill_v1.sql
      - name: Expand exact 99 catalog and refresh classification
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/achievement-hidden/fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_migration_classification_v1.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_hidden_policy_v1.sql
      - name: Add title/profile fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-center/fixture.sql
      - name: Apply canonical achievement center read model
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_achievement_center_read_v1.sql
      - name: Run server masking/category/title regression
        run: psql -v ON_ERROR_STOP=1 -f tests/achievement-center/center_read_regression.sql
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/achievement-sync.js
          node --check assets/js/achievements-all.js
          node --check assets/js/achievement-custom-ui.js
      - name: Verify server-authority and release safety
        shell: bash
        run: |
          set -euo pipefail
          RPC=database/migrations/sd_achievement_center_read_v1.sql
          SYNC=assets/js/achievement-sync.js
          UI=assets/js/achievements-all.js
          CUSTOM=assets/js/achievement-custom-ui.js
          grep -q "get_sd_achievement_center_v1" "$RPC"
          grep -q "hidden and not unlocked" "$RPC"
          grep -q "ua.achievement_id is not null" "$RPC"
          grep -q 'get_sd_achievement_center_v1' "$SYNC"
          grep -q 'Client-derived achievement claims are never submitted' "$SYNC"
          ! grep -q 'sync_sd_achievement_progress' "$SYNC"
          ! grep -q 'PENDING_IDS' "$CUSTOM"
          grep -q 'Boolean(item?.unlocked)' "$UI"
          ! grep -Eq 'current_value[^\n]*>=|progress[^\n]*>=.*target' "$UI"
          ! grep -Eiq 'wallets[[:space:]]+set[[:space:]]+balance|center-update\.json|site-config\.js|releases/download' "$RPC"
          ! grep -Eiq 'insert[[:space:]]+into[[:space:]]+public\.sd_(achievement_progress|user_achievements)' "$RPC"
          echo 'Chapter 3-6 server-authority/UI/release safety guard PASS'
