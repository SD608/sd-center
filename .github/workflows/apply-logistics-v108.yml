name: Apply logistics v1.0.8 progression

on:
  push:
    paths:
      - ".github/workflows/apply-logistics-v108.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply logistics v1.0.8 progression patch
        run: python tools/patch_logistics_progression_v108.py

      - name: Verify website and desktop package
        run: |
          node --check assets/js/logistics-center.js
          grep -q '{rank:"E", min:300, next:800}' assets/js/logistics-center.js
          grep -q '{rank:"S", min:7000, next:null}' assets/js/logistics-center.js
          grep -q 'minRank:"E"' assets/js/logistics-center.js
          grep -q 'minRank:"C"' assets/js/logistics-center.js
          grep -q 'minRank:"A"' assets/js/logistics-center.js
          grep -q 'vehicleRankUnlocked' assets/js/logistics-center.js
          grep -q 'logistics-center.js?v=108' logistics-center.html
          grep -q '"minVersion": "1.0.8"' update/desktop-policy.json
          unzip -t downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip >/dev/null
          rm -rf /tmp/logistics-v108
          mkdir -p /tmp/logistics-v108
          unzip -q downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip -d /tmp/logistics-v108
          LOGISTICS_JS=$(grep -rl 'vehicleRankUnlocked' /tmp/logistics-v108 --include='*.js' | head -n 1)
          test -n "$LOGISTICS_JS"
          node --check "$LOGISTICS_JS"
          grep -q '{rank:"S", min:7000, next:null}' "$LOGISTICS_JS"
          grep -q '회사 ${def.minRank}등급부터 구매할 수 있습니다' "$LOGISTICS_JS"
          grep -R -q '"version": "1.0.8"' /tmp/logistics-v108 --include='package.json' --include='sd-app.json'
          sha256sum downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip
          stat -c '%s bytes' downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip

      - name: Commit logistics v1.0.8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/logistics-center.js logistics-center.html update/desktop-policy.json downloads/extensions/SDLogisticsCenter_Season0_Desktop.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "balance: logistics rank progression and vehicle unlocks v1.0.8"
          git push

# retry after supporting both website and desktop logistics source layouts
