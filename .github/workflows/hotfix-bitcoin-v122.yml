name: Publish Bitcoin Miner v1.2.2 forced hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-bitcoin-v122.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v1.2.2 self-contained ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcZip = Join-Path $env:GITHUB_WORKSPACE 'downloads\extensions\SDBitcoinMiner_v1.2.1_Desktop.zip'
          if (-not (Test-Path $srcZip)) { throw 'v1.2.1 ZIP not found' }
          $stage = Join-Path $env:RUNNER_TEMP 'bitcoin-v122'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Expand-Archive -Path $srcZip -DestinationPath $stage -Force

          $mainPath = Join-Path $stage 'main.js'
          $sharedPath = Join-Path $stage 'shared\open-center.js'
          if (-not (Test-Path $mainPath)) { throw 'main.js missing' }
          if (-not (Test-Path $sharedPath)) { throw 'bundled shared/open-center.js missing' }
          $main = Get-Content $mainPath -Raw
          if ($main -match '\.\./\.\./shared/open-center') { throw 'external shared import still present' }
          if ($main -notmatch '\./shared/open-center') { throw 'local shared import missing' }

          $pkgPath = Join-Path $stage 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = '1.2.2'
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

          $manifestPath = Join-Path $stage 'sd-app.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.id -ne 'bitcoin') { throw "Unexpected bitcoin app id: $($manifest.id)" }
          $manifest.version = '1.2.2'
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $manifestPath -Encoding utf8

          node --check $mainPath
          node --check $sharedPath
          node --check (Join-Path $stage 'src\mining-service.js')
          node --check (Join-Path $stage 'src\wallet-database.js')

          if (-not (Select-String -Path (Join-Path $stage 'src\mining-service.js') -Pattern 'SUCCESS_PROBABILITY = 0.0002' -Quiet)) { throw '0.02% probability missing' }
          if (-not (Select-String -Path (Join-Path $stage 'src\wallet-database.js') -Pattern 'GPU_PRICE = 1550000' -Quiet)) { throw 'GPU price patch missing' }
          if (-not (Select-String -Path (Join-Path $stage 'src\wallet-database.js') -Pattern 'ELECTRICITY_FEE_PER_GPU_KRW = 100000' -Quiet)) { throw 'electricity patch missing' }
          if (-not (Select-String -Path (Join-Path $stage 'src\wallet-database.js') -Pattern 'bitcoin_gpu_units' -Quiet)) { throw 'durability table missing' }

          $outZip = Join-Path $env:GITHUB_WORKSPACE 'downloads\extensions\SDBitcoinMiner_v1.2.2_Desktop.zip'
          Compress-Archive -Path "$stage\*" -DestinationPath $outZip -CompressionLevel Optimal -Force
          $size = (Get-Item $outZip).Length
          $sha256 = (Get-FileHash $outZip -Algorithm SHA256).Hash.ToLower()
          if ($size -lt 50000) { throw "ZIP unexpectedly small: $size" }
          Write-Host "Bitcoin v1.2.2 ZIP bytes: $size"
          Write-Host "Bitcoin v1.2.2 SHA256: $sha256"

          $catalogPath = Join-Path $env:GITHUB_WORKSPACE 'update\extensions-catalog.json'
          $catalog = Get-Content $catalogPath -Raw | ConvertFrom-Json
          $catalog.catalogVersion = [int]$catalog.catalogVersion + 1
          $catalog.updatedAt = '2026-08-14T21:27:00+09:00'
          $catalog.apps.bitcoin.version = '1.2.2'
          $catalog.apps.bitcoin.downloadUrl = 'https://sd608.github.io/sd-center/downloads/extensions/SDBitcoinMiner_v1.2.2_Desktop.zip?v=122'
          $catalog.apps.bitcoin.notes = 'v1.2.2 강제 핫픽스. 공용 모듈을 ZIP 내부에 포함해 실행 오류를 수정하고 v1.2.0 밸런스/GPU 내구도 규칙을 유지합니다.'
          $catalog | ConvertTo-Json -Depth 20 | Set-Content $catalogPath -Encoding utf8

          $extPath = Join-Path $env:GITHUB_WORKSPACE 'extensions-data.js'
          $ext = Get-Content $extPath -Raw
          $ext = $ext.Replace('version: "v1.2.1"','version: "v1.2.2"')
          $ext = $ext.Replace('SDBitcoinMiner_v1.2.1_Desktop.zip?v=121','SDBitcoinMiner_v1.2.2_Desktop.zip?v=122')
          $ext = $ext.Replace('SDBitcoinMiner_v1.2.1_Desktop.zip','SDBitcoinMiner_v1.2.2_Desktop.zip')
          Set-Content $extPath -Value $ext -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-bitcoin-v122.yml
          git add downloads/extensions/SDBitcoinMiner_v1.2.2_Desktop.zip update/extensions-catalog.json extensions-data.js
          git commit -m 'fix: force bitcoin self-contained hotfix v1.2.2'
          git push origin main
