name: Miner Work Loop v3

on:
  push:
    branches:
      - feat/miner-remake-loop-v3-20260825
    paths:
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - '.github/workflows/miner-work-loop-v3.yml'
  pull_request:
    paths:
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - '.github/workflows/miner-work-loop-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miner-work-loop-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miner_work_loop_v3_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d miner_work_loop_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: miner_work_loop_v3_test
    steps:
      - uses: actions/checkout@v4
      - name: Build production-shaped auth/device/achievement fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/fixture.sql
      - name: Apply trusted Core wallet delta helper
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_core_server_wallet_delta_v1.sql
      - name: Apply current miner authority baseline
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql
      - name: Apply Chapter 4-2 server-timed work loop
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_work_loop_v3.sql
      - name: Run timing, session, device, idempotency and asset regression
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/regression.sql
