name: Inspect Flea bank carry points

on:
  push:
    branches:
      - feature/flea-red-diamond
    paths:
      - '.github/workflows/inspect-flea-bank-carry.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flea-red-diamond
      - name: Inspect v1.1.2 bank finale and chase
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flea112-inspect && mkdir -p /tmp/flea112-inspect
          unzip -q downloads/extensions/SDFleaMarket_v1.1.2_Desktop.zip -d /tmp/flea112-inspect
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/flea112-inspect')
          targets=[]
          for path in root.rglob('*'):
            if path.is_file() and path.suffix.lower() in {'.js','.html'}:
              try:
                text=path.read_text(encoding='utf-8')
              except Exception:
                continue
              if any(k.lower() in text.lower() for k in [
                'BankChaseGame','bankChaseDifficultyLabel','startBankChase','finishBankChase',
                'safeOpened','bankLoot','safe-node','은행 금고','오토바이','motorcycle'
              ]):
                targets.append(path)

          needles = [
            'buildBankFinaleMission','startMissionSafe','missionSafeAttempt','finishMission',
            'finishBankChase','bankChaseDifficultyLabel','startBankChase','BankChaseGame',
            'safeOpened','bankLoot','safe-node','오토바이','lootValue','durability','targetDistance',
            'damage','spawn','police','rock','bus'
          ]
          out=[]
          for path in sorted(targets):
            text=path.read_text(encoding='utf-8')
            lines=text.splitlines()
            out.append(f'===== {path.relative_to(root)} =====')
            blocks=[]
            for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                start=max(0,i-28); end=min(len(lines),i+82)
                if blocks and start <= blocks[-1][1] + 4:
                  blocks[-1]=(blocks[-1][0],max(blocks[-1][1],end))
                else:
                  blocks.append((start,end))
            for start,end in blocks:
              out.append(f'--- lines {start+1}-{end} ---')
              out.extend(f'{j+1:04d}: {lines[j]}' for j in range(start,end))
              out.append('')
          dest=Path('diagnostics/flea-bank-carry-source.txt')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/flea-bank-carry-source.txt
          git commit -m '진단: 금고 운반·추격전 세부 구조 확인'
          git push origin HEAD:feature/flea-red-diamond
