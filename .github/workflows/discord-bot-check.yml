name: Check SD Center Discord Bot

on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '.github/workflows/discord-bot-check.yml'
  pull_request:
    paths:
      - 'discord-bot/**'
      - '.github/workflows/discord-bot-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: 'npm'
          cache-dependency-path: discord-bot/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Validate slash command JSON
        run: node -e "import('./src/commands.js').then(({commandJson})=>{if(commandJson.length!==2)process.exit(1); console.log(JSON.stringify(commandJson,null,2));})"
