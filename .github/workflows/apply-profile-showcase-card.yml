name: Apply profile flea showcase card

on:
  push:
    branches: [feat/profile-showcase-center-icons-20260818]
    paths:
      - 'tools/patch-profile-showcase-card.js'
      - '.github/workflows/apply-profile-showcase-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-showcase-center-icons-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate profile showcase files
        run: node tools/patch-profile-showcase-card.js
      - name: Validate generated JavaScript
        run: |
          node --check assets/js/profile-page-v8.js
          node --check assets/js/profile-card-edit-v7.js
      - name: Validate showcase markers
        shell: bash
        run: |
          grep -q 'data-card-block="flea_showcase"' profile.html
          grep -q 'data-card-block="flea_showcase"' profile-card-edit.html
          grep -q 'editorShowcasePicker' profile-card-edit.html
          grep -q 'set_sd_flea_showcase' assets/js/profile-card-edit-v7.js
          grep -q 'showcase_items' assets/js/profile-page-v8.js
          grep -q 'sd608-mobile-v28-profile-flea-showcase' service-worker.js
      - name: Commit generated profile files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile.html profile-card-edit.html assets/js/profile-page-v8.js assets/js/profile-card-edit-v7.js assets/css/profile-showcase-card.css service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '프로필 편집기에 플리마켓 자랑 카드 추가'
          git push origin HEAD:feat/profile-showcase-center-icons-20260818
