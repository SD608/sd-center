name: Build genuine SDCenter v2.1.3 extension updater

on:
  push:
    branches:
      - build-v213-extension-updater-20260814
    paths:
      - '.github/workflows/build-v213-extension-updater.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download official v2.1.2 Squirrel installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\SDCenterSetup-v2.1.2.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.1.2/SDCenterSetup.exe' -OutFile $setup
          $size = (Get-Item $setup).Length
          if ($size -lt 100MB) { throw "Official v2.1.2 installer is unexpectedly small: $size" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'e203e6b1e5e23f4f33c0ffada04c60dfd25d0167044138bd4c7cc3c840764fbc') {
            throw "Official v2.1.2 installer hash mismatch: $hash"
          }
          Write-Host "Verified official v2.1.2 base: $size bytes / $hash"

      - name: Install official v2.1.2 base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\SDCenterSetup-v2.1.2.exe"
          Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $appDir = Get-ChildItem $env:LOCALAPPDATA -Filter SDCenter.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\SDCenter\\app-2\.1\.2\\SDCenter\.exe$' } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $appDir) { throw 'Could not locate official %LOCALAPPDATA%\SDCenter\app-2.1.2 base' }
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installed official base: $appDir"

      - name: Apply v2.1.3 extension auto-updater patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hotfix = Join-Path $env:GITHUB_WORKSPACE 'build\v213-hotfix'
          $appRoot = Join-Path $env:APP_DIR 'resources\app'
          if (-not (Test-Path (Join-Path $appRoot 'package.json'))) { throw "Packaged app root not found: $appRoot" }

          node (Join-Path $hotfix 'normalize-source.js') (Join-Path $appRoot 'main.js') (Join-Path $appRoot 'public\js\app.js')
          node (Join-Path $hotfix 'patch-main.js') (Join-Path $appRoot 'main.js')
          node (Join-Path $hotfix 'patch-renderer.js') (Join-Path $appRoot 'public\js\app.js')
          node (Join-Path $hotfix 'update-package.js') (Join-Path $appRoot 'package.json')
          Copy-Item (Join-Path $hotfix 'preload.js') (Join-Path $appRoot 'preload.js') -Force

          node --check (Join-Path $appRoot 'main.js')
          node --check (Join-Path $appRoot 'preload.js')
          node --check (Join-Path $appRoot 'public\js\app.js')

          $pkg = Get-Content (Join-Path $appRoot 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.3') { throw "Patched package version is $($pkg.version), expected 2.1.3" }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern 'extensions-catalog.json' -Quiet)) { throw 'Extension catalog URL missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern 'center:update-app' -Quiet)) { throw 'Update-app IPC missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern 'center:update-all-apps' -Quiet)) { throw 'Update-all IPC missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern '1.0.9' -Quiet)) { throw 'Logistics v1.0.9 fallback missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'preload.js') -Pattern 'checkAppUpdates' -Quiet)) { throw 'Preload update bridge missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'public\js\app.js') -Pattern '모두 업데이트' -Quiet)) { throw 'Renderer update-all UI missing' }
          Write-Host 'v2.1.3 extension updater source patch verified.'

      - name: Rebuild genuine in-place Squirrel installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = "$env:RUNNER_TEMP\squirrel-builder-v213"
          New-Item -ItemType Directory -Path $builder -Force | Out-Null
          Set-Location $builder
          npm init -y | Out-Null
          npm install electron-winstaller@latest --no-audit --no-fund
          @'
          const path = require('node:path');
          const { createWindowsInstaller } = require('electron-winstaller');
          const appDirectory = process.env.APP_DIR;
          const outputDirectory = path.join(process.env.RUNNER_TEMP, 'squirrel-v213');
          createWindowsInstaller({
            appDirectory,
            outputDirectory,
            name: 'SDCenter',
            productName: 'SD종합센터',
            version: '2.1.3',
            authors: 'SDWallet',
            description: '종합센터 안에서 홈페이지 확장팩을 확인하고 앱별 또는 전체 자동 업데이트하는 Windows 데스크톱 센터',
            exe: 'SDCenter.exe',
            setupExe: 'SDCenterSetup.exe',
            noMsi: true,
            setupIcon: path.join(appDirectory, 'resources', 'app', 'public', 'icons', 'icon.ico')
          }).then(() => console.log('Squirrel build complete:', outputDirectory))
            .catch((error) => { console.error(error); process.exit(1); });
          '@ | Set-Content -Path build.js -Encoding utf8
          node build.js
          $setup = "$env:RUNNER_TEMP\squirrel-v213\SDCenterSetup.exe"
          if (-not (Test-Path $setup)) { throw 'SDCenterSetup.exe was not generated' }
          $size = (Get-Item $setup).Length
          if ($size -lt 100MB) { throw "Generated installer is unexpectedly small: $size" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Write-Host "Generated installer bytes: $size"
          Write-Host "Generated installer SHA256: $hash"
          "BUILT_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install-test in-place v2.1.3 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:BUILT_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $expected = Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.1.3\SDCenter.exe'
          if (-not (Test-Path $expected)) { throw "Generated installer did not update in place to $expected" }
          $appRoot = Join-Path (Split-Path $expected -Parent) 'resources\app'
          $pkg = Get-Content (Join-Path $appRoot 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.3') { throw "Installed package version mismatch: $($pkg.version)" }
          node --check (Join-Path $appRoot 'main.js')
          node --check (Join-Path $appRoot 'preload.js')
          node --check (Join-Path $appRoot 'public\js\app.js')
          if (-not (Select-String -Path (Join-Path $appRoot 'main.js') -Pattern 'center:check-app-updates' -Quiet)) { throw 'Installed updater IPC missing' }
          if (-not (Select-String -Path (Join-Path $appRoot 'public\js\app.js') -Pattern 'update-button' -Quiet)) { throw 'Installed updater UI missing' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'sdcenter-desktop\app-2.1.3\SDCenter.exe')) { throw 'Installer incorrectly created a parallel sdcenter-desktop installation' }
          Write-Host "In-place install test passed: $expected"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $releaseDir = "$env:GITHUB_WORKSPACE\release-v2.1.3"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $env:BUILT_SETUP "$releaseDir\SDCenterSetup.exe" -Force
          $hash = (Get-FileHash "$releaseDir\SDCenterSetup.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "$releaseDir\SDCenterSetup.exe").Length
          "$hash  SDCenterSetup.exe" | Set-Content "$releaseDir\SHA256.txt" -Encoding ascii
          @"
          SD종합센터 v2.1.3
          - 확장팩 최신 버전 자동 확인
          - 앱 카드에서 원클릭 업데이트
          - 업데이트 가능한 확장팩 모두 업데이트
          - 실행 중 앱 자동 종료 후 교체
          - 앱 저장 데이터 유지
          - 물류센터 필수 최소 버전 v1.0.9
          Installer bytes: $size
          SHA256: $hash
          "@ | Set-Content "$releaseDir\BUILD_INFO.txt" -Encoding utf8

      - name: Upload genuine installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-v2.1.3-Extension-Auto-Updater
          path: release-v2.1.3/*
          if-no-files-found: error
          retention-days: 14
