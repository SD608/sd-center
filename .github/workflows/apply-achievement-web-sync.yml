name: Apply achievement web sync

on:
  push:
    paths:
      - ".github/workflows/apply-achievement-web-sync.yml"
      - "tools/patch-achievement-web-sync.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch achievement page
        run: python tools/patch-achievement-web-sync.py
      - name: Verify JavaScript
        run: node --check assets/js/achievement-sync.js && node --check assets/js/achievements-all.js
      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.html assets/js/achievements-all.js
          if git diff --cached --quiet; then
            echo "No website changes"
            exit 0
          fi
          git commit -m "feat: enable live achievement account sync"
          git push
