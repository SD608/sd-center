name: Build SDCenter UI Preview v0.8

on:
  push:
    branches: [preview/center-ui-v230-20260819]
    paths:
      - 'tools/patch-center-ui-v08.js'
      - '.github/workflows/build-center-ui-preview-v08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/patch-center-ui-v08.js'
      - '.github/workflows/build-center-ui-preview-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-v08:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.7.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.7/SDCenterSetup.exe' -OutFile $setup
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '9e17490d34a10f8ae076597ef2fb27451bd6c11a318776c4fd70ecde1d87fcde'){ throw "v2.2.7 hash mismatch: $hash" }
          "BASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install v2.2.7 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process -FilePath $env:BASE_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $base=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.7'
          if(-not (Test-Path (Join-Path $base 'SDCenter.exe'))){ throw 'v2.2.7 install missing' }
          "BASE_APP_DIR=$base" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare portable preview v0.8
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $preview=Join-Path $env:RUNNER_TEMP 'SDCenter-UI-Preview-v0.8'
          if(Test-Path $preview){ Remove-Item $preview -Recurse -Force }
          Copy-Item $env:BASE_APP_DIR $preview -Recurse -Force
          $root=Join-Path $preview 'resources\app'
          $assets=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04'
          if(Test-Path $assets){ Remove-Item $assets -Recurse -Force }
          $assetZip=Join-Path $env:RUNNER_TEMP 'center-ui-preview-assets-v04.zip'
          $assetB64=(Get-Content 'tools/center-ui-preview-assets-v04-good.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes($assetZip, [Convert]::FromBase64String($assetB64))
          $assetHash=(Get-FileHash $assetZip -Algorithm SHA256).Hash.ToLower()
          if($assetHash -ne '1b250228b0112b8722eec3eb4cf89dbe138c20d5e7060e7995812e2d73db6b72'){ throw "preview asset hash mismatch: $assetHash" }
          Expand-Archive -Path $assetZip -DestinationPath $assets -Force
          Copy-Item (Join-Path $assets 'index.html') (Join-Path $root 'public\index.html') -Force
          Copy-Item (Join-Path $assets 'ui-preview.css') (Join-Path $root 'public\css\ui-preview.css') -Force
          Copy-Item (Join-Path $assets 'ui-preview.js') (Join-Path $root 'public\js\ui-preview.js') -Force
          node tools/patch-center-ui-v04.js "$root"
          node tools/patch-center-ui-v05.js "$root"
          node tools/patch-center-ui-v06.js "$root"
          node tools/patch-center-ui-v07.js "$root"
          node tools/patch-center-ui-v08.js "$root"
          $htmlPath=Join-Path $root 'public\index.html'
          $html=(Get-Content $htmlPath -Raw).Replace('UI Preview v0.6','UI Preview v0.8').Replace('UI Preview v0.7','UI Preview v0.8')
          Set-Content $htmlPath $html -Encoding utf8
          @(
            'SD종합센터 UI Remake Preview v0.8',
            'Base: official v2.2.7',
            '',
            '버그 감사 수정:',
            '- 폴더 멤버십 초기화 레이스 제거',
            '- 센터 설치 프로그램 실행 확인 후에만 종합센터 종료',
            '- 센터 업데이트 SHA256 및 공식 GitHub 릴리스 URL 필수 검증',
            '- 업데이트 오류 상태 표시 우선순위 수정',
            '- 실패한 앱 실행은 최근 실행에 기록하지 않음',
            '- 자동 업데이트 확인 오류 토스트 억제',
            '- 손상된 최근 실행 저장값 안전 복구',
            '- 업데이트 HTTP 리다이렉트 횟수 제한',
            '- 중복/빈 폴더 ID 저장값 복구',
            '',
            '프리뷰이며 정식 업데이트 메타데이터는 변경하지 않았습니다.'
          ) | Set-Content (Join-Path $preview 'PREVIEW_README.txt') -Encoding utf8
          'SD종합센터 UI Preview`nBase: v2.2.7`nPreview: UI Remake v0.8`nOfficial update metadata is NOT changed.' | Set-Content (Join-Path $root 'UI_PREVIEW.txt') -Encoding utf8
          "PREVIEW_DIR=$preview" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate source and audited regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check "$env:APP_ROOT\main.js"
          node --check "$env:APP_ROOT\public\js\app.js"
          node --check "$env:APP_ROOT\public\js\ui-preview.js"
          node --check "$env:APP_ROOT\preload.js"
          node --check "$env:APP_ROOT\src\required-updates.js"
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.7'){ throw "Base version changed unexpectedly: $($pkg.version)" }

          $main=Get-Content "$env:APP_ROOT\main.js" -Raw
          $appJs=Get-Content "$env:APP_ROOT\public\js\app.js" -Raw
          $previewJs=Get-Content "$env:APP_ROOT\public\js\ui-preview.js" -Raw
          $required=Get-Content "$env:APP_ROOT\src\required-updates.js" -Raw
          $html=Get-Content "$env:APP_ROOT\public\index.html" -Raw

          foreach($marker in @('function validatePortableCenterManifest','공식 GitHub 릴리스가 아닌 센터 업데이트 주소','센터 업데이트 SHA256 정보가 없거나 올바르지 않습니다.','child.once("spawn", resolve)','redirectCount > 5')){ if(-not $main.Contains($marker)){ throw "main audit fix missing: $marker" } }
          foreach($marker in @('function previewSetApps(apps)','savedPreviewRecent','const folderIds = new Set();','if (result?.ok)')){ if(-not $previewJs.Contains($marker)){ throw "preview audit fix missing: $marker" } }
          foreach($marker in @('redirectCount = 0','redirectCount > 5')){ if(-not $required.Contains($marker)){ throw "download redirect guard missing: $marker" } }
          if(-not $appJs.Contains('return result;')){ throw 'launch result return missing' }
          if($appJs.Contains('if (update?.phase === "error") showToast')){ throw 'silent updater still forces error toast' }

          $renderStart=$previewJs.IndexOf('renderApps = function previewRenderApps()')
          $renderEnd=$previewJs.IndexOf('const originalRenderStore', $renderStart)
          if($renderStart -lt 0 -or $renderEnd -lt 0){ throw 'renderApps audit block missing' }
          $renderBlock=$previewJs.Substring($renderStart,$renderEnd-$renderStart)
          if($renderBlock.Contains('preview.appsReady = true')){ throw 'appsReady race remains inside renderApps' }

          $errorIndex=$previewJs.IndexOf('else if (update.phase === "error")')
          $availableIndex=$previewJs.IndexOf('else if (update.updateAvailable)', $errorIndex)
          if($errorIndex -lt 0 -or $availableIndex -lt 0 -or $errorIndex -gt $availableIndex){ throw 'update error must render before updateAvailable' }

          $launchStart=$previewJs.IndexOf('launchApp = async function previewLaunchApp')
          $successIndex=$previewJs.IndexOf('if (result?.ok)', $launchStart)
          $recentIndex=$previewJs.IndexOf('saveRecent(id)', $launchStart)
          if($launchStart -lt 0 -or $successIndex -lt 0 -or $recentIndex -lt $successIndex){ throw 'failed launch may still be recorded as recent' }

          if(-not $html.Contains('UI Preview v0.8')){ throw 'v0.8 HTML version marker missing' }

      - name: Validate live center update manifest contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Invoke-RestMethod -Uri ('https://sd608.github.io/sd-center/update/center-update.json?t=' + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -Headers @{'Cache-Control'='no-cache'}
          if([string]::IsNullOrWhiteSpace($manifest.version) -or $manifest.version -notmatch '^\d+(\.\d+){1,3}$'){ throw 'live center manifest version invalid' }
          if($manifest.downloadUrl -notmatch '^https://github\.com/SD608/sd-center/releases/download/'){ throw 'live center manifest download URL is not official release' }
          if($manifest.sha256 -notmatch '^[0-9a-fA-F]{64}$'){ throw 'live center manifest SHA256 invalid' }

      - name: Smoke test portable preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe=Join-Path $env:PREVIEW_DIR 'SDCenter.exe'
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if($proc.HasExited){ throw "UI preview exited during smoke test: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Write build info
        shell: pwsh
        run: |
          $files=(Get-ChildItem $env:PREVIEW_DIR -Recurse -File | Measure-Object).Count
          $bytes=(Get-ChildItem $env:PREVIEW_DIR -Recurse -File | Measure-Object Length -Sum).Sum
          @("Files: $files","Bytes: $bytes","Commit: $env:GITHUB_SHA","Built: $(Get-Date -Format o)") | Set-Content (Join-Path $env:PREVIEW_DIR 'BUILD_INFO.txt') -Encoding utf8

      - name: Upload portable preview v0.8
        uses: actions/upload-artifact@v4
        with:
          name: SDCenter-UI-Preview-v0.8-win-x64
          path: ${{ env.PREVIEW_DIR }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
