name: Miner Equipment Growth v1

on:
  push:
    branches: [feat/miner-equipment-growth-v1-20260825]
    paths:
      - 'database/migrations/sd_miner_equipment_growth_v1.sql'
      - 'database/migrations/sd_miner_economy_balance_v1.sql'
      - 'database/migrations/sd_shared_item_inventory_v1.sql'
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - 'tests/shared-item-inventory-v1/**'
      - 'tests/miner-economy-balance-v1/**'
      - 'tests/miner-equipment-growth-v1/**'
      - '.github/workflows/miner-equipment-growth-v1.yml'
  pull_request:
    paths:
      - 'database/migrations/sd_miner_equipment_growth_v1.sql'
      - 'database/migrations/sd_miner_economy_balance_v1.sql'
      - 'database/migrations/sd_shared_item_inventory_v1.sql'
      - 'database/migrations/sd_miner_work_loop_v3.sql'
      - 'database/migrations/sd_core_server_wallet_delta_v1.sql'
      - 'sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql'
      - 'sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql'
      - 'tests/miner-work-loop-v3/**'
      - 'tests/shared-item-inventory-v1/**'
      - 'tests/miner-economy-balance-v1/**'
      - 'tests/miner-equipment-growth-v1/**'
      - '.github/workflows/miner-equipment-growth-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miner-equipment-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miner_equipment_growth_v1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d miner_equipment_growth_v1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: miner_equipment_growth_v1_test
    steps:
      - uses: actions/checkout@v4
      - name: Build production-shaped auth/device/achievement fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/fixture.sql
      - name: Apply trusted Core wallet delta helper
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_core_server_wallet_delta_v1.sql
      - name: Apply miner authority baseline
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105343_sd_miner_authority_v2_01_schema.sql
          psql -v ON_ERROR_STOP=1 -f sql/release-gate/20260820105412_sd_miner_authority_v2_02_api.sql
      - name: Apply Chapter 4-2 server-timed miner loop
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_work_loop_v3.sql
      - name: Prove inherited Chapter 4-2 regression
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-work-loop-v3/regression.sql
      - name: Apply Chapter 4-3 shared item authority
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_shared_item_inventory_v1.sql
      - name: Prove inherited Chapter 4-3 shared-item regression
        run: psql -v ON_ERROR_STOP=1 -f tests/shared-item-inventory-v1/regression.sql
      - name: Apply pre-4-7 economy guardrail candidate
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_economy_balance_v1.sql
      - name: Verify inherited economy guardrail regression
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/constants.sql
          psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/quota.sql
          psql -v ON_ERROR_STOP=1 -f tests/miner-economy-balance-v1/sales.sql
      - name: Apply official Chapter 4-4 equipment and growth authority
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/sd_miner_equipment_growth_v1.sql
      - name: Verify equipment costs progression storage and Core exact-once
        run: psql -v ON_ERROR_STOP=1 -f tests/miner-equipment-growth-v1/regression.sql
