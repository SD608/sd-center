name: Build and publish SDCenter v2.2.3 In-App Self Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v223-center-self-update.yml'
      - 'tools/patch-v223-electron-autoupdater*.js'
      - 'tools/build-v223-installer.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified v2.2.2 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.2.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.2/SDCenterSetup.exe' -OutFile $setup
          $size=(Get-Item $setup).Length
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if($size -ne 140103680){ throw "Unexpected v2.2.2 size: $size" }
          if($hash -ne 'be33a0295d67b92aa1292342546e81ea3c90271eb450bad5e22b2c3071ef798e'){ throw "v2.2.2 hash mismatch: $hash" }
          "BASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install v2.2.2 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process -FilePath $env:BASE_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $appDir=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.2'
          if(-not (Test-Path (Join-Path $appDir 'SDCenter.exe'))){ throw 'v2.2.2 install missing' }
          "APP_DIR=$appDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ROOT=$appDir\resources\app" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch SDCenter v2.2.3 Electron autoUpdater
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/patch-v223-electron-autoupdater.js "$env:APP_ROOT"

      - name: Validate patched source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check "$env:APP_ROOT\main.js"
          node --check "$env:APP_ROOT\preload.js"
          node --check "$env:APP_ROOT\public\js\app.js"
          $pkg=Get-Content "$env:APP_ROOT\package.json" -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.3'){ throw "Center version mismatch: $($pkg.version)" }
          $main=Get-Content "$env:APP_ROOT\main.js" -Raw
          foreach($m in @('autoUpdater','CENTER_UPDATE_FEED_URL','center:check-self-update','center:install-self-update','quitAndInstall')) {
            if(-not $main.Contains($m)){ throw "v2.2.3 updater marker missing: $m" }
          }
          $renderer=Get-Content "$env:APP_ROOT\public\js\app.js" -Raw
          foreach($m in @('centerUpdateButton','checkSelfUpdate','handleSelfUpdateButton','onSelfUpdateState')) {
            if(-not $renderer.Contains($m)){ throw "v2.2.3 renderer marker missing: $m" }
          }

      - name: Install Squirrel builder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $builder=Join-Path $env:RUNNER_TEMP 'squirrel-builder-v223'
          New-Item -ItemType Directory -Force -Path $builder | Out-Null
          Push-Location $builder
          npm init -y | Out-Null
          npm install electron-winstaller@latest --no-audit --no-fund
          Pop-Location
          "NODE_PATH=$builder\node_modules" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $output=Join-Path $env:RUNNER_TEMP 'squirrel-v223'
          "BUILD_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build SDCenter v2.2.3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/build-v223-installer.js
          $setup=Join-Path $env:BUILD_OUTPUT 'SDCenterSetup.exe'
          $releases=Join-Path $env:BUILD_OUTPUT 'RELEASES'
          $nupkg=Get-ChildItem $env:BUILD_OUTPUT -Filter '*-full.nupkg' | Select-Object -First 1
          if(-not (Test-Path $setup)){ throw 'v2.2.3 installer missing' }
          if(-not (Test-Path $releases)){ throw 'Squirrel RELEASES missing' }
          if(-not $nupkg){ throw 'Squirrel full nupkg missing' }
          $size=(Get-Item $setup).Length
          if($size -lt 100MB){ throw "Installer too small: $size" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "BUILT_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_RELEASES=$releases" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_NUPKG=$($nupkg.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_NUPKG_NAME=$($nupkg.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and smoke test v2.2.3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:BUILT_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $dir=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.3'
          $exe=Join-Path $dir 'SDCenter.exe'
          if(-not (Test-Path $exe)){ throw 'v2.2.3 in-place install failed' }
          $pkg=Get-Content (Join-Path $dir 'resources\app\package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.3'){ throw 'Installed Center version mismatch' }
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if($proc.HasExited){ throw "Center exited during smoke test: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Prepare release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:GITHUB_WORKSPACE 'release-v2.2.3'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $env:BUILT_SETUP (Join-Path $dir 'SDCenterSetup.exe') -Force
          Copy-Item $env:BUILT_RELEASES (Join-Path $dir 'RELEASES') -Force
          Copy-Item $env:BUILT_NUPKG (Join-Path $dir $env:BUILT_NUPKG_NAME) -Force
          gh release download 'v.2.2.2' --repo 'SD608/sd-center' --pattern 'SDCenter-Mobile.apk' --dir $dir
          "$env:BUILT_HASH  SDCenterSetup.exe" | Set-Content (Join-Path $dir 'SHA256.txt') -Encoding ascii
          $info=@(
            'SD종합센터 v2.2.3',
            '- 종합센터 앱 내부 자체 업데이트 추가',
            '- Electron/Squirrel 정식 autoUpdater 사용',
            '- 시작 후 자동 업데이트 확인',
            '- 새 버전 자동 다운로드 후 앱 안에서 설치/재시작',
            '- RELEASES + full.nupkg를 GitHub 최신 릴리스에 제공',
            '- 확장팩 업데이트와 센터 자체 업데이트를 별도 관리',
            "Installer bytes: $env:BUILT_SIZE",
            "SHA256: $env:BUILT_HASH"
          )
          $info | Set-Content (Join-Path $dir 'BUILD_INFO.txt') -Encoding utf8
          "RELEASE_DIR=$dir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish v2.2.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create 'v.2.2.3' `
            "$env:RELEASE_DIR/SDCenterSetup.exe" `
            "$env:RELEASE_DIR/SDCenter-Mobile.apk" `
            "$env:RELEASE_DIR/RELEASES" `
            "$env:RELEASE_DIR/$env:BUILT_NUPKG_NAME" `
            "$env:RELEASE_DIR/SHA256.txt" `
            "$env:RELEASE_DIR/BUILD_INFO.txt" `
            --repo 'SD608/sd-center' `
            --target 'main' `
            --title 'SD종합센터 v2.2.3' `
            --notes '종합센터 자체 업데이트 기능을 추가했습니다. v2.2.3부터 앱 안에서 새 버전을 자동 확인·다운로드하고 업데이트 후 자동 재시작할 수 있습니다.'

      - name: Update website and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path('.')
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          manifest = {
              'version': '2.2.3',
              'downloadUrl': 'https://github.com/SD608/sd-center/releases/download/v.2.2.3/SDCenterSetup.exe',
              'sha256': os.environ['BUILT_HASH'],
              'notes': '종합센터 앱 내부에서 Electron/Squirrel 자동 업데이트를 지원합니다.',
              'publishedAt': now,
              'squirrelFeedUrl': 'https://github.com/SD608/sd-center/releases/latest/download'
          }
          (root / 'update/center-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          site = root / 'site-config.js'
          text = site.read_text(encoding='utf-8')
          text = text.replace('v2.2.2 SD Link Auto Start', 'v2.2.3 In-App Self Update')
          text = text.replace('version: "2.2.2"', 'version: "2.2.3"')
          text = text.replace('releases/download/v.2.2.2/SDCenterSetup.exe', 'releases/download/v.2.2.3/SDCenterSetup.exe')
          text = text.replace('releases/tag/v.2.2.2', 'releases/tag/v.2.2.3')
          site.write_text(text, encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\update-v223-site.py" -Encoding utf8
          python "$env:RUNNER_TEMP\update-v223-site.py"

      - name: Validate published metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content 'update/center-update.json' -Raw | ConvertFrom-Json
          if($manifest.version -ne '2.2.3'){ throw 'center update metadata version mismatch' }
          if($manifest.sha256 -ne $env:BUILT_HASH){ throw 'center update metadata hash mismatch' }
          $site=Get-Content 'site-config.js' -Raw
          if(-not $site.Contains('version: "2.2.3"')){ throw 'site config v2.2.3 missing' }

      - name: Commit website and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/center-update.json site-config.js
          if(git diff --cached --quiet){ exit 0 }
          git commit -m '센터 v2.2.3 앱내 자동업데이트 배포 반영'
          git push origin HEAD:main
