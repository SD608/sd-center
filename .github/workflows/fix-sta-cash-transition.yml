name: Fix STA cash transition

on:
  push:
    paths:
      - ".github/workflows/fix-sta-cash-transition.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply STA v1.5.1 hotfix
        run: python tools/fix_sta_cash_transition.py

      - name: Verify patched package
        run: |
          rm -rf /tmp/sta-verify
          mkdir -p /tmp/sta-verify
          unzip -q downloads/extensions/STA_Version6_Desktop.zip -d /tmp/sta-verify
          cd /tmp/sta-verify/STA_Version6_Desktop
          node --check public/js/app.js
          node --check src/wallet-database.js
          node --check main.js
          node tools/test-operation.js
          node tools/check-all.js
          grep -q '"version": "1.5.1"' package.json
          grep -q 'transport_ready가 될 때까지 재확인' public/js/app.js
          cd "$GITHUB_WORKSPACE"
          unzip -t downloads/extensions/STA_Version6_Desktop.zip >/dev/null
          sha256sum downloads/extensions/STA_Version6_Desktop.zip
          stat -c '%s bytes' downloads/extensions/STA_Version6_Desktop.zip

      - name: Commit STA v1.5.1 hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/extensions/STA_Version6_Desktop.zip extensions-data.js assets/js/extensions-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: STA cash phase transition v1.5.1"
          git push
