name: Inspect Flea v1.0.9 raw bytes

on:
  push:
    branches:
      - chatgpt/flea-v110-rebuild
    paths:
      - '.github/workflows/inspect-flea109-bytes.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect historical v1.0.9 blob
        shell: bash
        run: |
          set -euo pipefail
          git show 358e673ebddef7e33deb182b21d33c0178facae5:downloads/extensions/SDFleaMarket_v1.0.9_Desktop.zip > /tmp/flea109.bin
          echo '=== size/file ==='
          wc -c /tmp/flea109.bin
          file /tmp/flea109.bin
          echo '=== first 512 bytes hex ==='
          xxd -g 1 -l 512 /tmp/flea109.bin
          echo '=== first 2000 bytes repr ==='
          python - <<'PY'
          from pathlib import Path
          b = Path('/tmp/flea109.bin').read_bytes()
          print(repr(b[:2000]))
          print('NUL count', b.count(b'\x00'))
          for enc in ('utf-8','utf-16','utf-16le','cp949','latin1'):
              try:
                  t=b.decode(enc)
                  print('DECODE',enc,'OK',repr(t[:2000]))
              except Exception as e:
                  print('DECODE',enc,'FAIL',type(e).__name__)
          PY
          echo '=== printable strings ==='
          strings -a -n 4 /tmp/flea109.bin | head -n 500
