name: Hide hidden achievement method

on:
  push:
    branches: [fix/hidden-achievement-method]
    paths:
      - '.github/workflows/hide-hidden-achievement-method.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hidden-achievement-method
          fetch-depth: 0

      - name: Hide hidden achievement details
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/js/achievements-all.js')
          text = js.read_text(encoding='utf-8')

          replacements = [
              (
                  'bitcoin-05|bitcoin|BTC NOT FOUND|비트코인 보유량 정확히 404개 달성|h||BTC',
                  'bitcoin-05|bitcoin|???|???|h||'
              ),
              (
                  '<div class="achievement-condition"><small>달성 조건</small><strong>???</strong></div></article>',
                  '<div class="achievement-condition"><small>달성 방법</small><strong>???</strong></div></article>'
              ),
              (
                  '히든 업적은 달성 전까지 이름과 조건이 ???로 표시되고, 누적형·보유형·연승형 업적은 진행률을 %로 표시합니다.',
                  '히든 업적은 달성 전까지 이름과 달성 방법이 ???로 표시되고 진행도·목표치도 공개하지 않습니다. 누적형·보유형·연승형 일반 업적은 진행률을 %로 표시합니다.'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'achievements-all.js patch target missing: {old[:70]}')
              text = text.replace(old, new, 1)

          js.write_text(text, encoding='utf-8')

          html = Path('achievements.html')
          page = html.read_text(encoding='utf-8')
          page = page.replace(
              '히든 업적은 달성 전까지 이름과 조건이 가려지고, 누적형·보유형 업적은 진행률을 %로 표시합니다.',
              '히든 업적은 달성 전까지 이름과 달성 방법이 가려지고 진행도·목표치도 표시하지 않습니다. 일반 진행형 업적은 진행률을 %로 표시합니다.'
          )
          page = page.replace(
              '<div class="achievement-condition"><small>달성 조건</small><strong>???</strong></div>\n      <p class="achievement-note">달성 전에는 업적 이름과 조건을 공개하지 않습니다. 달성하면 실제 이름인 “BTC NOT FOUND”가 표시됩니다.</p>',
              '<div class="achievement-condition"><small>달성 방법</small><strong>???</strong></div>\n      <p class="achievement-note">히든 업적은 달성 전까지 이름, 달성 방법, 진행 정보를 공개하지 않습니다.</p>'
          )
          html.write_text(page, encoding='utf-8')
          PY

      - name: Validate hidden data is not public
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'BTC NOT FOUND' assets/js/achievements-all.js
          ! grep -q '정확히 404개' assets/js/achievements-all.js
          ! grep -q 'BTC NOT FOUND' achievements.html
          grep -q '달성 방법</small><strong>???' assets/js/achievements-all.js
          grep -q '달성 방법</small><strong>???' achievements.html
          node --check assets/js/achievements-all.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/achievements-all.js achievements.html
          git commit -m '업적: 히든 달성 방법과 실제 정보 비공개 처리'
          git push origin HEAD:fix/hidden-achievement-method
