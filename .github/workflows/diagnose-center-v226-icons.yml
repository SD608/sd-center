name: Diagnose SDCenter v2.2.6 app icons

on:
  push:
    branches: [feat/profile-showcase-center-icons-20260818]
    paths:
      - '.github/workflows/diagnose-center-v226-icons.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-showcase-center-icons-20260818
          fetch-depth: 0
      - name: Download and install v2.2.6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:RUNNER_TEMP\SDCenterSetup-v2.2.6.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.2.6/SDCenterSetup.exe' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 5
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $root=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.2.6\resources\app'
          if(-not (Test-Path (Join-Path $root 'main.js'))){ throw 'v2.2.6 source missing' }
          "APP_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Copy icon-related source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'diagnostics\center-v226-source'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $env:APP_ROOT 'main.js') (Join-Path $out 'main.js') -Force
          Copy-Item (Join-Path $env:APP_ROOT 'preload.js') (Join-Path $out 'preload.js') -Force
          Copy-Item (Join-Path $env:APP_ROOT 'public\js\app.js') (Join-Path $out 'public__app.js') -Force
          Copy-Item (Join-Path $env:APP_ROOT 'src\app-registry.js') (Join-Path $out 'app-registry.js') -Force
          Copy-Item (Join-Path $env:APP_ROOT 'package.json') (Join-Path $out 'package.json') -Force
      - name: Commit diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/center-v226-source
          if(git diff --cached --quiet){ exit 0 }
          git commit -m '센터 v2.2.6 앱 레지스트리 아이콘 소스 진단'
          git push origin HEAD:feat/profile-showcase-center-icons-20260818
