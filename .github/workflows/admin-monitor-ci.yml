name: SD Admin Monitor CI

on:
  push:
    branches:
      - "feature/admin-monitor-v1-*"
    paths:
      - "admin-monitor/**"
      - "sql/SD608_관리자_접속현황_v1.sql"
      - "sql/SD608_회원계좌_개인정보보호.sql"
      - "account.html"
      - "ranking.html"
      - "members.html"
      - "assets/js/members-page.js"
      - ".github/workflows/admin-monitor-ci.yml"
  pull_request:
    paths:
      - "admin-monitor/**"
      - "sql/SD608_관리자_접속현황_v1.sql"
      - "sql/SD608_회원계좌_개인정보보호.sql"
      - "account.html"
      - "ranking.html"
      - "members.html"
      - "assets/js/members-page.js"
      - ".github/workflows/admin-monitor-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        working-directory: admin-monitor
        run: npm run check
      - name: Unit and regression tests
        working-directory: admin-monitor
        run: npm test
      - name: Bug suite x5
        working-directory: admin-monitor
        shell: bash
        run: for i in {1..5}; do npm run test:bug; done
      - name: Error suite x5
        working-directory: admin-monitor
        shell: bash
        run: for i in {1..5}; do npm run test:error; done

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned build dependencies
        working-directory: admin-monitor
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS candidate
        working-directory: admin-monitor
        run: npm run build:win
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: sd-admin-monitor-windows-candidate
          path: admin-monitor/dist/*.exe
          if-no-files-found: error
