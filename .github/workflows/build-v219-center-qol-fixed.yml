/* v2.1.9: Center version, bulk ZIP download, favorites */
.center-version-chip { display:grid;min-height:34px;padding:0 11px;place-items:center;border:1px solid rgba(100,215,255,.22);border-radius:10px;background:rgba(36,112,158,.16);color:#9ee8ff;font-size:.68rem;font-weight:900;letter-spacing:.04em; }
.button-download { border-color:rgba(99,211,255,.28);background:linear-gradient(135deg,rgba(45,150,215,.92),rgba(65,102,203,.92));color:#effbff;box-shadow:0 12px 30px rgba(44,123,211,.18); }
.favorites-section { margin-top:22px;padding:18px;border:1px solid rgba(255,211,95,.16);border-radius:19px;background:linear-gradient(145deg,rgba(52,43,18,.24),rgba(9,22,37,.72)); }
.favorites-heading { display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:13px; }
.favorites-heading h2 { margin:0;font-size:1.2rem;letter-spacing:-.04em; }
.favorites-heading p:last-child { margin:0;color:#8da1b3;font-size:.72rem;font-weight:700; }
.favorite-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px; }
.favorite-shortcut { display:flex;min-width:0;min-height:64px;padding:9px 12px;align-items:center;gap:10px;border:1px solid rgba(255,211,95,.14);border-radius:14px;background:rgba(8,19,32,.78);color:#dce8f3;text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease; }
.favorite-shortcut:hover { transform:translateY(-1px);border-color:rgba(255,211,95,.4);background:rgba(28,34,37,.9); }
.favorite-shortcut.is-running { border-color:rgba(78,225,157,.28); }
.favorite-shortcut img { width:42px;height:42px;flex:0 0 auto;border-radius:11px;object-fit:cover;background:#0a1726; }
.favorite-shortcut span { min-width:0;flex:1; }
.favorite-shortcut strong,.favorite-shortcut small { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.favorite-shortcut strong { font-size:.78rem; }
.favorite-shortcut small { margin-top:4px;color:#7e95aa;font-size:.62rem;font-weight:750; }
.favorite-shortcut b { color:#ffd86e;font-size:.65rem; }
.favorite-button { display:grid;width:34px;height:34px;flex:0 0 auto;place-items:center;padding:0;border:1px solid rgba(255,211,95,.16);border-radius:10px;background:rgba(7,17,29,.62);color:#7d8fa0;font-size:1.16rem;line-height:1;cursor:pointer;transition:border-color .16s ease,color .16s ease,background .16s ease,transform .16s ease; }
.favorite-button:hover { transform:translateY(-1px);border-color:rgba(255,211,95,.5);color:#ffe38b; }
.favorite-button.is-favorite { border-color:rgba(255,211,95,.42);background:rgba(119,87,12,.2);color:#ffd35f;box-shadow:0 0 18px rgba(255,211,95,.1); }
@media (max-width:1100px) { .favorite-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:760px) { .favorite-grid { grid-template-columns:1fr; } .favorites-heading { align-items:flex-start;flex-direction:column; } .center-version-chip { display:none; } }
'@
          Write-Lf $cssPath $css

      - name: Validate patched v2.1.9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:APP_DIR 'resources\app'
          node --check (Join-Path $root 'main.js')
          node --check (Join-Path $root 'preload.js')
          node --check (Join-Path $root 'public\js\app.js')
          $pkg=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.1.9'){ throw "Center version mismatch: $($pkg.version)" }
          $main=Get-Content (Join-Path $root 'main.js') -Raw
          $pre=Get-Content (Join-Path $root 'preload.js') -Raw
          $ui=Get-Content (Join-Path $root 'public\js\app.js') -Raw
          $html=Get-Content (Join-Path $root 'public\index.html') -Raw
          foreach($m in @('center:get-center-info','center:toggle-favorite','center:download-extension-zips','center:bulk-download-progress','center-settings.json','downloadAllExtensionZips','favorite: isFavoriteId')){ if(-not $main.Contains($m)){ throw "missing main marker $m" } }
          foreach($m in @('getCenterInfo','toggleFavorite','downloadExtensionZips','onBulkDownloadProgress')){ if(-not $pre.Contains($m)){ throw "missing preload marker $m" } }
          foreach($m in @('centerVersionChip','favoritesSection','favoriteGrid','downloadExtensionsButton')){ if(-not $html.Contains($m)){ throw "missing HTML marker $m" } }
          foreach($m in @('renderFavorites','favoriteShortcut','downloadExtensionZips','toggleFavorite')){ if(-not $ui.Contains($m)){ throw "missing UI marker $m" } }
          $btc=Get-Content (Join-Path $root 'apps\SDBitcoinMiner\sd-app.json') -Raw | ConvertFrom-Json
          if($btc.version -ne '1.2.2'){ throw 'Bitcoin v1.2.2 was not preserved' }

      - name: Verify current catalog
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $catalog=Invoke-RestMethod -Uri 'https://sd608.github.io/sd-center/update/extensions-catalog.json'
          $apps=@($catalog.apps.psobject.Properties)
          if($apps.Count -lt 6){ throw "Unexpected extension count: $($apps.Count)" }
          foreach($prop in $apps){
            $url=[string]$prop.Value.downloadUrl
            if($url -notmatch '^https://.*\.zip'){ throw "Invalid ZIP URL: $($prop.Name) $url" }
          }
          Write-Host "Validated $($apps.Count) extension ZIP entries"

      - name: Build Squirrel v2.1.9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $builder="$env:RUNNER_TEMP\squirrel-builder-v219-fixed"
          New-Item -ItemType Directory -Force -Path $builder | Out-Null
          Set-Location $builder
          npm init -y | Out-Null
          npm install electron-winstaller@latest --no-audit --no-fund
          @'
const path=require('node:path');
const {createWindowsInstaller}=require('electron-winstaller');
createWindowsInstaller({
  appDirectory:process.env.APP_DIR,
  outputDirectory:path.join(process.env.RUNNER_TEMP,'squirrel-v219-fixed'),
  name:'SDCenter',
  productName:'SD종합센터',
  version:'2.1.9',
  authors:'SDWallet',
  description:'센터 버전 표시 · 확장팩 ZIP 일괄 다운로드 · 즐겨찾기',
  exe:'SDCenter.exe',
  setupExe:'SDCenterSetup.exe',
  noMsi:true,
  setupIcon:path.join(process.env.APP_DIR,'resources','app','public','icons','icon.ico')
}).then(()=>console.log('v2.1.9 build complete')).catch(e=>{console.error(e);process.exit(1);});
'@ | Set-Content build.js -Encoding utf8
          node build.js
          $setup="$env:RUNNER_TEMP\squirrel-v219-fixed\SDCenterSetup.exe"
          if(-not (Test-Path $setup)){ throw 'v2.1.9 setup missing' }
          $size=(Get-Item $setup).Length
          if($size -lt 100MB){ throw "setup too small: $size" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "BUILT_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILT_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and smoke-test v2.1.9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:BUILT_SETUP -ArgumentList '--silent' -PassThru -Wait | Out-Null
          Start-Sleep -Seconds 6
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $appDir=Join-Path $env:LOCALAPPDATA 'SDCenter\app-2.1.9'
          $exe=Join-Path $appDir 'SDCenter.exe'
          if(-not (Test-Path $exe)){ throw 'v2.1.9 install missing' }
          $root=Join-Path $appDir 'resources\app'
          $pkg=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.1.9'){ throw 'installed version mismatch' }
          $proc=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if($proc.HasExited){ throw "Center smoke test exited: $($proc.ExitCode)" }
          Get-Process SDCenter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Prepare release files
        shell: pwsh
        run: |
          $dir="$env:GITHUB_WORKSPACE\release-v2.1.9"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $env:BUILT_SETUP "$dir\SDCenterSetup.exe" -Force
          "$env:BUILT_HASH  SDCenterSetup.exe" | Set-Content "$dir\SHA256.txt" -Encoding ascii
          @"
SD종합센터 v2.1.9
- 앱 내부에서 현재 SD종합센터 버전 확인
- 최신 확장팩 ZIP 일괄 다운로드 (각 ZIP 개별 저장)
- 저장 위치 선택 후 SD확장팩_날짜시간 폴더 자동 생성/열기
- 앱 카드 ★/☆ 즐겨찾기
- 즐겨찾기 빠른 실행 영역 및 즐겨찾기 우선 정렬
- 즐겨찾기 설정 업데이트 후 유지
- 비트코인 v1.2.2 및 v2.1.8 기본 앱 버전 동기화 수정 유지
- 홈페이지 통합 확장팩 ZIP 기능은 사용자 확인 전이므로 미포함
Installer bytes: $env:BUILT_SIZE
SHA256: $env:BUILT_HASH
"@ | Set-Content "$dir\BUILD_INFO.txt" -Encoding utf8

      - name: Publish v2.1.9
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create 'v.2.1.9' `
            'release-v2.1.9/SDCenterSetup.exe' `
            'release-v2.1.9/SHA256.txt' `
            'release-v2.1.9/BUILD_INFO.txt' `
            --repo 'SD608/sd-center' `
            --target 'build-v219-center-qol-20260816' `
            --title 'SD종합센터 v2.1.9' `
            --notes '종합센터 내부 버전 표시, 확장팩 ZIP 일괄 다운로드, 앱 즐겨찾기/빠른 실행 기능을 추가했습니다. 즐겨찾기는 업데이트 후에도 유지됩니다. 홈페이지에서 모든 확장팩을 ZIP 하나로 받는 기능은 사용자 확인 전이라 아직 추가하지 않았습니다.'
