name: Build flea v1.1.4 integration and render fix

on:
  push:
    paths:
      - ".github/workflows/build-flea-v114-integration-render.yml"
      - "tools/patch-flea-v114-integration-render.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v1.1.4 from current v1.1.3
        run: python tools/patch-flea-v114-integration-render.py

      - name: Verify package
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('downloads/extensions/SDFleaMarket_v1.1.4_Desktop.zip')
          assert p.is_file() and p.stat().st_size > 100000
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              i=next(n for n in names if n.endswith('src/sd-integration.js'))
              m=next(n for n in names if n.endswith('public/mission3d.js'))
              assert 'FLEA_LOGISTICS_HQ_UNLOCK_V114' in z.read(i).decode('utf-8')
              assert 'const S_RANK_REP = 7000;' in z.read(i).decode('utf-8')
              assert 'headquartersLevel >= 1' in z.read(i).decode('utf-8')
              assert 'FLEA_MISSION3D_BLACKSCREEN_V114' in z.read(m).decode('utf-8')
          catalog=json.loads(Path('update/extensions-catalog.json').read_text())
          assert catalog['apps']['sd-flea-market']['version']=='1.1.4'
          print('v1.1.4 verification passed')
          PY

      - name: Commit built package and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/extensions/SDFleaMarket_v1.1.4_Desktop.zip update/extensions-catalog.json assets/js/extensions-data.js extensions-data.js
          if git diff --cached --quiet; then
            echo "No build changes"
            exit 0
          fi
          git commit -m "fix: publish flea v1.1.4 logistics and 3D render fix"
          git push
