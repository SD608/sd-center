name: Build flea v1.2.0 item dictionary

on:
  push:
    branches:
      - feat/flea-v120-item-dictionary-20260819
    paths:
      - tools/build-flea-v120.part*.py
      - tools/flea-v120-items-manifest.txt
      - tools/flea-v120-items-sprite.webp.b64
      - .github/workflows/build-flea-v120-item-dictionary.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flea-v120-item-dictionary-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tools
        run: python -m pip install --quiet pillow
      - name: Build and verify SD Flea Market v1.2.0
        shell: bash
        run: |
          set -euo pipefail
          cat tools/build-flea-v120.part*.py > /tmp/build-flea-v120.py
          python -m py_compile /tmp/build-flea-v120.py
          python /tmp/build-flea-v120.py
          rm -rf /tmp/flea-v120-check
          mkdir -p /tmp/flea-v120-check
          unzip -q downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip -d /tmp/flea-v120-check
          cd /tmp/flea-v120-check/sd-flea-market
          npm run check
          test "$(find public/assets/items -maxdepth 1 -name '*.png' | wc -l)" -eq 36
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('public/app.js', 'utf8');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('sd-app.json','utf8'));
          for (const token of ['ITEM_IMAGE_PATHS','ITEM_DICTIONARY_CATALOG','renderDictionary','dictionarySort','firstAcquiredAt','totalAcquired']) {
            if (!app.includes(token)) throw new Error(`missing ${token}`);
          }
          for (const token of ['dictionaryPanel','phoneDictionaryCount','data-dictionary-tier="safe"']) {
            if (!html.includes(token)) throw new Error(`missing ${token}`);
          }
          if ('description' in manifest || 'improvement' in manifest) throw new Error('launch descriptions must be absent');
          if (manifest.version !== '1.2.0') throw new Error('wrong manifest version');
          NODE
          cd "$GITHUB_WORKSPACE"
          unzip -t downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip | tail -2
      - name: Update center release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          catalog_path = Path('update/extensions-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['catalogVersion'] = max(int(catalog.get('catalogVersion', 0)), 36)
          catalog['updatedAt'] = '2026-08-19T01:10:00+09:00'
          flea = catalog['apps']['sd-flea-market']
          flea['version'] = '1.2.0'
          flea['downloadUrl'] = 'https://sd608.github.io/sd-center/downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip?v=120'
          flea['notes'] = '36종 아이템 고유 이미지와 아이템 사전을 추가했습니다. 상자별 카테고리, 획득 여부, 최초 획득 날짜, 누적 획득 개수, 가격 오름차·내림차 정렬을 지원합니다.'
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for filename in ['extensions-data.js', 'assets/js/extensions-data.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(r'(\{\n\s+"id": "sd-flea-market",.*?\n\s+\})', re.S)
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f'flea block missing: {filename}')
              block = match.group(1)
              block = re.sub(r'"version": "v[^"]+"', '"version": "v1.2.0"', block, count=1)
              block = re.sub(r'"fileName": "[^"]+"', '"fileName": "SDFleaMarket_v1.2.0_Desktop.zip"', block, count=1)
              block = re.sub(r'"downloadUrl": "[^"]+"', '"downloadUrl": "downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip?v=120"', block, count=1)
              block = re.sub(r'"description": "[^"]*"', '"description": "36종 아이템 고유 이미지와 아이템 사전을 추가한 플리마켓 확장팩입니다. 은행 습격 금고는 상자 보관함에서 직접 개봉합니다."', block, count=1)
              block = re.sub(r'"updatedAt": "[^"]+"', '"updatedAt": "2026-08-19"', block, count=1)
              path.write_text(text[:match.start()] + block + text[match.end():], encoding='utf-8')

          guide = Path('README_새확장팩_추가방법.txt')
          text = guide.read_text(encoding='utf-8-sig')
          text = text.replace('4. 이름, Stage, 버전, 아이콘, 파일명, 설명, 필요 버전을 바꿉니다.', '4. 이름, Stage, 버전, 아이콘, 파일명, 홈페이지 카탈로그 설명, 필요 버전을 바꿉니다.')
          rule = '''\n개발 UI 원칙\n- 새로 개발하는 확장팩의 접속/시작 화면에는 앱 소개 문구나 부가 설명 문구를 넣지 않습니다.\n- sd-app.json에는 접속 화면 설명용 description, improvement 필드를 기본적으로 작성하지 않습니다.\n- 첫 화면은 기능 이름, 버튼, 필수 상태 정보 위주로 구성합니다.\n'''
          if '개발 UI 원칙' not in text:
              text = text.rstrip() + '\n' + rule
          guide.write_text(text, encoding='utf-8')
          PY
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            downloads/extensions/SDFleaMarket_v1.2.0_Desktop.zip \
            downloads/extensions/SDFleaMarket_v1.2.0_Desktop.sha256 \
            update/extensions-catalog.json \
            extensions-data.js \
            assets/js/extensions-data.js \
            README_새확장팩_추가방법.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: SD 플리마켓 v1.2.0"
          git push origin HEAD:feat/flea-v120-item-dictionary-20260819
