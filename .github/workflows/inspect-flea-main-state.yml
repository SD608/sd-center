name: Inspect Flea main state

on:
  push:
    branches: [chatgpt/flea-v110-rebuild]
    paths: ['.github/workflows/inspect-flea-main-state.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print state and sync sections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/f104 && mkdir -p /tmp/f104
          unzip -q downloads/extensions/SDFleaMarket_v1.0.4_Desktop.zip -d /tmp/f104
          echo '=== sync 130-230 ==='
          nl -ba /tmp/f104/main.js | sed -n '130,230p'
          echo '=== company/public 240-420 ==='
          nl -ba /tmp/f104/main.js | sed -n '240,420p'
