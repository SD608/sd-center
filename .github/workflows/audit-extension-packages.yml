name: Audit extension packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-extension-packages.yml'
      - 'tools/audit-extension-packages.py'
      - 'update/extensions-catalog.json'
      - 'downloads/extensions/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current extension ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/audit-extension-packages.py
