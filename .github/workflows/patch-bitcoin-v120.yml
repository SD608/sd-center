name: Publish Bitcoin Miner v1.2.0 balance patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-bitcoin-v120.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract verified v2.1.3 Bitcoin miner source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\SDCenterSetup-v2.1.3.exe"
          Invoke-WebRequest -Uri 'https://github.com/SD608/sd-center/releases/download/v.2.1.3/SDCenterSetup.exe' -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '336a39e3b804974fa4b01793898c3be4e056216de04a9f5ffbe70e77c373526e') { throw "v2.1.3 installer hash mismatch: $hash" }
          $seven = (Get-Command 7z).Source
          $outer = "$env:RUNNER_TEMP\sdc-v213"
          $inner = "$env:RUNNER_TEMP\sdc-v213-nupkg"
          New-Item -ItemType Directory -Force -Path $outer,$inner | Out-Null
          & $seven x -y $setup "-o$outer" | Out-Null
          $nupkg = Join-Path $outer 'SDCenter-2.1.3-full.nupkg'
          if (-not (Test-Path $nupkg)) { throw 'v2.1.3 full nupkg not found' }
          & $seven x -y $nupkg "-o$inner" | Out-Null
          $source = Join-Path $inner 'lib\net45\resources\app\apps\SDBitcoinMiner'
          if (-not (Test-Path (Join-Path $source 'src\wallet-database.js'))) { throw 'Bitcoin miner source not found' }
          $stage = "$env:RUNNER_TEMP\SDBitcoinMiner-v1.2.0"
          Copy-Item $source $stage -Recurse -Force
          "BTC_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply v1.2.0 economy and durability patch
        shell: pwsh
        env:
          PATCH_B64: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $pyPath = "$env:RUNNER_TEMP\patch-bitcoin-v120.py"
          python -c "import base64,gzip,pathlib,os; pathlib.Path(os.environ['RUNNER_TEMP'],'patch-bitcoin-v120.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))"
          python $pyPath $env:BTC_STAGE
          node --check "$env:BTC_STAGE\main.js"
          node --check "$env:BTC_STAGE\src\mining-service.js"
          node --check "$env:BTC_STAGE\src\wallet-database.js"
          node --check "$env:BTC_STAGE\public\js\app.js"
          if (-not (Select-String -Path "$env:BTC_STAGE\src\wallet-database.js" -Pattern 'GPU_PRICE = 1550000' -Quiet)) { throw 'GPU price patch missing' }
          if (-not (Select-String -Path "$env:BTC_STAGE\src\wallet-database.js" -Pattern 'ELECTRICITY_FEE_PER_GPU_KRW = 100000' -Quiet)) { throw 'electricity patch missing' }
          if (-not (Select-String -Path "$env:BTC_STAGE\src\mining-service.js" -Pattern 'SUCCESS_PROBABILITY = 0.0002' -Quiet)) { throw '0.02% probability patch missing' }
          if (-not (Select-String -Path "$env:BTC_STAGE\src\wallet-database.js" -Pattern 'bitcoin_gpu_units' -Quiet)) { throw 'GPU durability table missing' }

      - name: Smoke test GPU durability and electricity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = "$env:RUNNER_TEMP\bitcoin-smoke.js"
          $code = @'
          const fs=require('fs');
          const {DatabaseSync}=require('node:sqlite');
          const path=process.argv[2];
          const root=process.argv[3];
          try{fs.unlinkSync(path)}catch{}
          let db=new DatabaseSync(path);
          db.exec(`PRAGMA foreign_keys=ON; CREATE TABLE users(id TEXT PRIMARY KEY,username TEXT); CREATE TABLE accounts(id TEXT PRIMARY KEY,user_id TEXT,bank_name TEXT,account_number TEXT,owner_name TEXT,balance INTEGER,updated_at TEXT); CREATE TABLE transactions(id TEXT PRIMARY KEY,account_id TEXT,transaction_type TEXT,amount INTEGER,memo TEXT,created_at TEXT); INSERT INTO users VALUES('u1','tester'); INSERT INTO accounts VALUES('a1','u1','SD','123456789','tester',100000000,'2026-08-14T00:00:00Z');`); db.close();
          const w=require(root+'/src/wallet-database.js');
          if(w.GPU_PRICE!==1550000 || w.ELECTRICITY_FEE_PER_GPU_KRW!==100000) throw new Error('config mismatch');
          w.buyRoom(path,'a1','A'); w.buyFrame(path,'a1','A'); w.buyGpu(path,'a1','A');
          let st=w.getAccountState(path,'a1');
          if(st.rooms[0].gpuUnits[0].durability!==100 || st.electricity.dailyFeeKrw!==100000) throw new Error('initial GPU/electricity mismatch');
          function one(rooms){return rooms.map(r=>({accountId:r.accountId,roomKey:r.roomKey,btc:0.05,successes:1,gpuSuccesses:[{slotIndex:r.gpuUnits[0].slotIndex,successes:1}],elapsedSeconds:10,elapsedIntervals:1}));}
          w.resetMiningClock(path,Date.now()-11000); w.processMiningWindow(path,one,Date.now(),10);
          st=w.getAccountState(path,'a1'); if(st.rooms[0].gpuUnits[0].durability!==99) throw new Error('durability did not drop');
          console.log('Bitcoin v1.2.0 smoke test passed');
          '@
          Set-Content -Path $test -Value $code -Encoding utf8
          node $test "$env:RUNNER_TEMP\bitcoin-v120-test.sqlite" $env:BTC_STAGE

      - name: Build extension ZIP and update catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'downloads\extensions\SDBitcoinMiner_v1.2.0_Desktop.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:BTC_STAGE\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          Write-Host "Bitcoin ZIP bytes: $size"
          Write-Host "Bitcoin ZIP SHA256: $hash"
          $catalogPath = Join-Path $env:GITHUB_WORKSPACE 'update\extensions-catalog.json'
          $catalog = Get-Content $catalogPath -Raw | ConvertFrom-Json
          $catalog.catalogVersion = [Math]::Max(2, [int]$catalog.catalogVersion + 1)
          $catalog.updatedAt = '2026-08-14T20:47:00+09:00'
          $bitcoin = [PSCustomObject]@{
            name = 'SD비트코인 채굴장'
            version = '1.2.0'
            downloadUrl = 'https://sd608.github.io/sd-center/downloads/extensions/SDBitcoinMiner_v1.2.0_Desktop.zip?v=120'
            notes = '채굴 확률 0.02%, GPU 155만원, GPU당 UTC 하루 전기세 10만원, 채굴 성공 시 해당 GPU 내구도 1% 감소 및 0% 파손'
          }
          $catalog.apps | Add-Member -NotePropertyName bitcoin -NotePropertyValue $bitcoin -Force
          $catalog | ConvertTo-Json -Depth 10 | Set-Content $catalogPath -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/SDBitcoinMiner_v1.2.0_Desktop.zip update/extensions-catalog.json
          git commit -m 'balance: nerf bitcoin miner and add GPU durability v1.2.0'
          git push origin main
