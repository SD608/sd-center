<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17150c">
  <title>SD금고 Mobile</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/vault.png">
  <link rel="stylesheet" href="assets/css/mobile-app.css?v=3">
  <link rel="stylesheet" href="assets/css/mobile-vault.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/supabase-config.js?v=2" defer></script>
  <script src="assets/js/auth-common.js?v=2" defer></script>
  <script src="assets/js/mobile-common.js?v=2" defer></script>
  <script src="assets/js/mobile-vault.js?v=4" defer></script>
</head>
<body class="mobile-body">
  <header class="mobile-topbar">
    <a class="mobile-brand" href="mobile.html">
      <img src="assets/icons/vault.png" alt="">
      <span><small>VIRTUAL GOLD</small><strong>SD금고</strong></span>
    </a>
    <button id="lockVaultButton" class="icon-button" type="button">잠금</button>
  </header>

  <main class="mobile-main">
    <section class="app-panel">
      <div class="page-heading">
        <img src="assets/icons/vault.png" alt="">
        <div>
          <span class="eyebrow-mobile">SECURE VAULT</span>
          <h1>내 가상금고</h1>
          <p>잔액을 고정 가상 시세 1돈 826,000원으로 환산합니다.</p>
        </div>
      </div>

      <div id="vaultStatus" class="status-mobile" hidden></div>

      <div class="vault-door-wrap">
        <div id="vaultDoor" class="vault-door">
          <div class="vault-wheel"></div>
          <div class="vault-handle"></div>
        </div>
        <div id="goldRoom" class="gold-room">
          <div class="gold-summary">
            <span>금괴 개수</span>
            <strong id="goldCount">0개</strong>
            <span>총 가상 금 중량</span>
            <button id="goldWeight" class="gold-weight-toggle" type="button" aria-label="현재 g 단위. 눌러서 kg로 변경">0g</button>
            <span class="gold-unit-hint">숫자를 눌러 g ↔ kg 변환</span>
            <span>금괴 1개 = 3.75g</span>
          </div>
          <div id="goldGrid" class="gold-grid"></div>
        </div>
      </div>

      <section id="vaultSetupPanel" class="pin-panel" hidden>
        <h2>금고 PIN 처음 설정</h2>
        <p>숫자 4자리를 설정하세요.<br>PIN은 서버에 암호화된 형태로 저장됩니다.</p>
        <input id="newVaultPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="새 PIN 4자리">
        <input id="confirmVaultPin" class="pin-input" style="margin-top:8px" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 다시 입력">
        <button id="setPinButton" class="primary-mobile" type="button">PIN 설정</button>
      </section>

      <section id="vaultUnlockPanel" class="pin-panel" hidden>
        <h2>금고 잠금 해제</h2>
        <p>설정한 숫자 4자리 PIN을 입력하세요.</p>
        <input id="vaultPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리">
        <button id="unlockVaultButton" class="primary-mobile" type="button">금고 열기</button>
      </section>

      <p class="small-note">실제 금을 구매하거나 보관하는 서비스가 아닙니다.<br>표시 금은 가상 잔액의 시각화입니다.</p>
    </section>
  </main>

  <nav class="mobile-bottom-nav">
    <a href="mobile.html"><b>⌂</b>홈</a>
    <a href="wallet-mobile.html"><b>₩</b>지갑</a>
    <a class="active" href="vault-mobile.html"><b>▣</b>금고</a>
    <a href="odd-even-mobile.html"><b>⚄</b>홀짝</a>
    <a href="slot-mobile.html"><b>7</b>슬롯</a>
  </nav>
</body>
</html>
