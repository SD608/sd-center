<html lang="ko"><head>

</head><body class="auth-body"><div class="page-glow glow-one"></div><div class="page-glow glow-two"></div>

<header class="site-header auth-site-header">
  <a class="brand" href="index.html" aria-label="SD종합센터 홈"><img src="assets/icons/center.png" alt="" /><span>SD종합센터</span></a>
  <nav class="nav-links"><a href="index.html">홈</a><a href="index.html#extensions">확장팩</a></nav>
  <div class="header-account"><a class="header-login" href="login.html">로그인</a><a class="header-signup" href="signup.html">회원가입</a></div>
</header>
<main class="auth-main single section-shell"><section class="auth-card">
  <div class="auth-brand-icon"><img src="assets/icons/center.png" alt="" /></div><span class="section-kicker">SD608 ONLINE</span><h1>로그인</h1>
  <p class="auth-intro">홈페이지와 앞으로 출시될 Windows·Android 온라인 앱에서 같은 SD 계정을 사용합니다.</p>
  <form id="loginForm" class="auth-form" novalidate>
    <label>이메일<input id="email" name="email" type="email" autocomplete="email" required /></label>
    <label>비밀번호<input name="password" type="password" autocomplete="current-password" required /></label>
    <div id="formStatus" class="form-status" hidden aria-live="polite"></div>
    <button id="loginButton" class="primary-button auth-submit" type="submit">로그인</button>
    <button id="resendButton" class="secondary-button auth-secondary" type="button" hidden>인증메일 다시 보내기</button>
  </form>
  <p class="auth-switch">초대 코드를 받았나요? <a href="signup.html">회원가입</a></p>
</section></main></body></html>
