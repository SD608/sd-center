<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="SD608 온라인 공개 프로필" />
<meta name="theme-color" content="#0b1224" />
<title>프로필 · SD608 온라인</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="assets/css/style.css?v=online2" />
<link rel="stylesheet" href="assets/css/profile-page.css?v=1" />
<link rel="stylesheet" href="assets/css/profile-card-layout.css?v=3-clean" />
<link rel="stylesheet" href="assets/css/profile-tabs.css?v=1" />
<link rel="stylesheet" href="assets/css/profile-assets-v3.css?v=1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/supabase-config.js?v=2" defer></script>
<script src="assets/js/auth-common.js?v=2" defer></script>
<script src="assets/js/profile-page-v7.js?v=1" defer></script>
<script src="assets/js/profile-tabs-v2.js?v=1" defer></script>
</head>
<body class="auth-body profile-body">
<div class="page-glow glow-one"></div><div class="page-glow glow-two"></div>
<header class="site-header auth-site-header">
  <a class="brand" href="index.html"><img src="assets/icons/center.png" alt="" /><span>SD종합센터</span></a>
  <nav class="nav-links"><a href="index.html">홈</a><a href="account.html">내 지갑</a><a href="ranking.html">잔액 랭킹</a><a href="mobile.html">모바일 센터</a><a href="profile-shop.html">프로필 상점</a></nav>
  <div class="header-account"><button id="logoutButton" class="header-login" type="button">로그아웃</button></div>
</header>

<main class="profile-main section-shell">
  <section class="profile-hero">
    <div><span class="section-kicker">SD608 공개 프로필</span><h1 id="profileHeading">회원 프로필</h1></div>
    <div class="profile-hero-actions"><a class="secondary-button" href="ranking.html">랭킹으로 돌아가기</a><button id="refreshProfile" class="secondary-button" type="button">새로고침</button></div>
  </section>
  <div id="profileStatus" class="form-status account-status" hidden aria-live="polite"></div>

  <section id="profileMissing" class="profile-missing" hidden>
    <span>프로필 미생성</span>
    <h2 id="missingName">아직 프로필이 없습니다.</h2>
    <button id="createProfileButton" class="primary-button" type="button" hidden>내 프로필 만들기</button>
  </section>

  <section id="profileContent" hidden>
    <nav id="profileTabs" class="profile-tabs" aria-label="프로필 탭" hidden>
      <button class="profile-tab-button is-active" type="button" data-profile-tab="view" aria-selected="true">프로필 보기</button>
      <button id="profileEditTabButton" class="profile-tab-button" type="button" data-profile-tab="edit" aria-selected="false">프로필 수정</button>
    </nav>

    <div id="profileViewTabPanel" class="profile-tab-panel" data-profile-panel="view">
      <article id="profileIdCard" class="sd-id-card modular-profile-card" aria-label="SD608 공개 프로필 카드">
        <div class="id-watermark">SD608</div>
        <header class="id-card-header"><div><small>SD608 온라인</small><strong>게임 프로필 등록증</strong></div><span>공개 프로필</span></header>

        <div id="profileCardGrid" class="profile-card-grid">
          <section class="profile-card-module profile-card-photo-module" data-card-block="photo">
            <span class="profile-card-module-label">프로필 사진</span>
            <div class="id-photo" id="profilePhoto"><span>👤</span></div>
          </section>

          <section class="profile-card-module profile-card-nickname-module" data-card-block="nickname">
            <span class="profile-card-module-label">닉네임</span>
            <h2 id="profileNickname">회원</h2>
          </section>

          <section class="profile-card-module profile-card-title-module" data-card-block="title">
            <span class="profile-card-module-label">칭호</span>
            <strong id="profileTitleBadge" class="profile-card-value">장착된 칭호 없음</strong>
          </section>

          <section class="profile-card-module" data-card-block="assets">
            <span class="profile-card-module-label">공개 자산</span>
            <strong id="profileAssetTotal" class="profile-card-value">-</strong>
          </section>

          <section class="profile-card-module" data-card-block="gold">
            <span class="profile-card-module-label">보유 금</span>
            <strong id="profileGold" class="profile-card-value">-</strong>
          </section>

          <section class="profile-card-module" data-card-block="coins">
            <span class="profile-card-module-label">SD코인 보유량</span>
            <div id="profileCoins" class="profile-coin-holdings"><span class="profile-coin-empty">불러오는 중...</span></div>
          </section>
        </div>

        <div id="profileCardEmpty" class="profile-card-empty" hidden>공개 항목 없음</div>
      </article>
    </div>

    <section id="profileEditTabPanel" class="profile-tab-panel profile-edit-tab-panel" data-profile-panel="edit" hidden>
      <div class="profile-edit-tab-heading">
        <div><span class="section-kicker">실시간 프로필 편집</span><h2>프로필 실시간 편집</h2></div>
      </div>
      <iframe id="profileCardEditorFrame" class="profile-card-editor-frame" title="프로필 실시간 편집기" loading="lazy" data-src="profile-card-edit.html?embed=1&amp;v=8"></iframe>
    </section>
  </section>
</main>
</body>
</html>
